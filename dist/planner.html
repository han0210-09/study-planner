<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4C6EF5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>스터디 플래너</title>
  <style>
:root {
  --bg: #FAFAFB;
  --surface: #FFFFFF;
  --line: #E4E6EB;
  --text: #1F2329;
  --muted: #767C87;
  --accent: #4C6EF5;
  --danger: #E03131;
  --radius: 12px;
  --tt-row: 44px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
body.sheet-open { overflow: hidden; }

.screen { max-width: 560px; margin: 0 auto; padding: 12px 12px calc(24px + var(--safe-b)); }

.banner {
  position: sticky; top: 0; z-index: 40;
  background: #FFF3BF; color: #7A5B00;
  padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #FFE08A;
}

button { font: inherit; color: inherit; }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-ghost { background: transparent; }
.icon-btn {
  min-width: 44px; min-height: 44px; border: 0; background: transparent;
  border-radius: var(--radius); cursor: pointer; font-size: 18px;
}

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  max-width: 560px; margin: 0 auto;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  max-height: 86vh; display: flex; flex-direction: column;
  padding-bottom: var(--safe-b);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.sheet-title { margin: 0; font-size: 16px; }
.sheet-body { padding: 16px; overflow-y: auto; }
.sheet-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.sheet-actions .btn { flex: 1; }
.confirm-msg { margin: 0; white-space: pre-line; }

#toast-root { position: fixed; left: 0; right: 0; bottom: calc(24px + var(--safe-b)); z-index: 60; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { background: rgba(31,35,41,.92); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: opacity .3s; }
.toast-out { opacity: 0; }

.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input[type="text"], .field input[type="date"], .field textarea, .field select {
  width: 100%; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); font: inherit;
}
.field textarea { min-height: 88px; resize: vertical; }

/* ---------- 달력 ---------- */
.cal-head { display: grid; grid-template-columns: 44px 1fr 44px auto auto; align-items: center; gap: 4px; margin-bottom: 8px; }
.cal-title { margin: 0; font-size: 18px; text-align: center; }
/* .btn과 특이도가 같고 뒤에 오므로 이 값이 이긴다. 44px 아래로 내리면 안 된다. */
.cal-today-btn { min-height: 44px; padding: 0 10px; font-size: 13px; }

.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-weekday { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
.cal-sun { color: #E03131; }
.cal-sat { color: #1C7ED6; }

.cal-cell {
  min-height: 74px; padding: 4px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; gap: 2px;
  cursor: pointer; touch-action: pan-y; user-select: none;
}
.cal-cell-out { background: transparent; border: 0; min-height: 74px; cursor: default; }
.cal-today { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.cal-num { font-size: 13px; font-weight: 600; }

.cal-badges { display: flex; flex-direction: column; gap: 1px; min-height: 0; }
.cal-badge { display: flex; align-items: center; gap: 3px; font-size: 10px; line-height: 1.2; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.cal-badge-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-more { font-size: 10px; color: var(--muted); }

.cal-bar { margin-top: auto; height: 4px; background: #EDEFF3; border-radius: 2px; overflow: hidden; }
.cal-bar-fill { height: 100%; background: var(--accent); }
.cal-achieve { font-size: 10px; color: var(--muted); text-align: right; }

.cal-summary { display: flex; justify-content: space-between; margin-top: 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; color: var(--muted); }

.menu { display: flex; flex-direction: column; }
.menu-item { min-height: 48px; text-align: left; padding: 0 4px; border: 0; background: transparent; border-bottom: 1px solid var(--line); cursor: pointer; }
.menu-item:last-child { border-bottom: 0; }

/* ---------- 하루 화면 ---------- */
.day-head { display: grid; grid-template-columns: 44px auto 1fr 44px; align-items: center; gap: 6px; margin-bottom: 10px; }
.day-nav { display: flex; align-items: center; justify-content: center; gap: 2px; }
.day-date { font-size: 15px; font-weight: 600; white-space: nowrap; }
.dday { background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.dday-none { background: #E9ECEF; color: var(--muted); font-weight: 500; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.card-title { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
.empty { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.add-btn { width: 100%; }

.achieve-head { display: flex; justify-content: space-between; align-items: baseline; }
.achieve-value { font-size: 18px; font-weight: 700; }

.event-list { list-style: none; margin: 0; padding: 0; }
.event-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.event-item:last-child { border-bottom: 0; }
.event-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.event-title { flex: 1; font-weight: 600; }
.event-type { font-size: 11px; color: var(--muted); }

.todo-list { list-style: none; margin: 0 0 10px; padding: 0; }
/* 길게 누르면 삭제다. user-select를 끄지 않으면 그동안 iOS가 텍스트를 잡아
   복사 메뉴를 띄운다. touch-action은 pan-y로 둬야 목록을 그대로 스크롤할 수 있다. */
.todo-row {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid var(--line);
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.todo-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
/* 할 일 텍스트를 누르면 편집 시트가 열린다. 주 터치 타깃이므로 44px이어야 한다.
   행은 이미 체크박스(44px) 때문에 56px 이상이라 레이아웃은 바뀌지 않는다. */
.todo-text {
  text-align: left; border: 0; background: transparent; padding: 6px 0; cursor: pointer;
  min-height: 44px; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
}
.todo-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.todo-when { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.todo-when-none { opacity: .6; }
.todo-done .todo-title { text-decoration: line-through; color: var(--muted); }
/* 한 할 일을 나눠 잡았을 때만 회차가 붙는다. 이름과 붙어 다녀야 어느 이름의
   몇 번째인지 읽힌다. */
.todo-head { display: flex; align-items: baseline; gap: 6px; max-width: 100%; min-width: 0; }
.todo-nth {
  flex: 0 0 auto; font-size: 10px; font-weight: 700; color: var(--muted);
  background: #EDEFF3; border-radius: 999px; padding: 1px 6px; font-variant-numeric: tabular-nums;
}
/* 체크박스는 이 앱의 핵심 동작이다. 보이는 상자는 24px이지만 탭 영역은 44px로 넓힌다.
   input에는 가상요소가 안 먹으므로 label로 감싼다. */
.todo-check-hit {
  display: flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; cursor: pointer;
}
.todo-check { width: 24px; height: 24px; }
/* 할 일 시트의 배정된 시간 목록. 0개·1개·여러 개가 같은 모양이다. */
.slot-list { margin-bottom: 4px; }
.slot { display: grid; grid-template-columns: 1fr 44px; align-items: center; border-bottom: 1px solid var(--line); }
.slot-on { background: #F1F3F9; }
.slot-head {
  display: flex; align-items: baseline; gap: 8px;
  min-height: 44px; padding: 0 8px; border: 0; background: transparent;
  cursor: pointer; text-align: left;
}
.slot-range { font-weight: 600; font-variant-numeric: tabular-nums; }
.slot-dur { font-size: 12px; color: var(--muted); }
/* .icon-btn의 44px을 그대로 물려받고 색만 바꾼다. 크기를 다시 쓰면 안 된다. */
.slot-del { color: var(--danger); }
.slot-step { padding: 0 8px; margin: 8px 0; }

.subject-select { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font: inherit; }

.totals-row { display: flex; justify-content: space-between; padding: 3px 0; }
.totals-label { color: var(--muted); font-size: 13px; }
.totals-note { margin: 6px 0 0; font-size: 11px; color: var(--muted); }
.totals-bar { height: 8px; background: #EDEFF3; border-radius: 4px; overflow: hidden; margin-top: 10px; }
.totals-fill { height: 100%; background: var(--accent); }

.memo { width: 100%; min-height: 88px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; resize: vertical; }

/* ---------- 타임테이블 (한 행 = 한 시간, 한 칸 = 5분) ---------- */
.tt-wrap { display: flex; margin-top: 8px; user-select: none; }
.tt-labels { flex: 0 0 34px; }
.tt-label-cell {
  height: var(--tt-row); display: flex; align-items: flex-start; justify-content: flex-end;
  padding: 2px 6px 0 0; font-size: 10px; color: var(--muted); line-height: 1;
}
.tt-cells {
  flex: 1; min-width: 0; display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: var(--tt-row);
  border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: var(--surface);
  touch-action: pan-y;
}
/* 눈금은 테두리가 아니라 배경 그라디언트로 그린다. 격자 아이템에 border 를 주면
   box-sizing 때문에 행 높이가 옆의 시각 라벨과 1px 어긋난다. */
.tt-row {
  grid-column: 1 / -1;
  background-image:
    linear-gradient(to bottom, var(--line) 0 1px, transparent 1px),
    repeating-linear-gradient(to right, #E9ECEF 0 1px, transparent 1px 50%),
    repeating-linear-gradient(to right, #F1F3F5 0 1px, transparent 1px calc(100% / 12));
}

/* 손잡이가 안쪽에 자리로 들어오면서 밖으로 삐져나오는 것이 없어졌다. 다시
   숨겨서 둥근 모서리가 손잡이 배경을 잘라내게 한다. */
.tt-seg {
  display: flex; align-items: stretch; overflow: hidden;
  margin: 2px 0; filter: saturate(.75); box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.tt-seg-first { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
.tt-seg-last { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
.tt-seg-done { filter: saturate(1.35); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.tt-seg-dragging { opacity: .3; }
/* 들린 블록. 원래 자리는 흐려지고 그림자가 손가락을 따라간다. */
.tt-seg-lifted { opacity: .35; }
.merge-btn { width: 100%; min-height: 44px; margin-bottom: 8px; font-size: 13px; color: var(--accent); border-color: var(--accent); }

/* 조각이 한 칸(약 25px)일 수도 있으므로 44px 을 고정폭으로 못 준다. 줄어들게 두고,
   짧은 블록의 완료 처리는 편집 시트의 완료 토글이 맡는다. */
.tt-check {
  flex: 0 1 34px; min-width: 18px; border: 0; background: rgba(255,255,255,.5);
  font-size: 12px; font-weight: 700; cursor: pointer; padding: 0;
}
.tt-seg-done .tt-check { background: rgba(255,255,255,.75); }
.tt-body {
  flex: 1 1 auto; min-width: 0; border: 0; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  padding: 0 4px; overflow: hidden; text-align: left;
}
.tt-label { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tt-time { font-size: 9px; opacity: .65; white-space: nowrap; }

/* 손잡이는 블록 안에서 제 자리를 차지한다. 겹쳐 띄우면 ✓ 와 같은 자리에 놓여
   어느 쪽을 눌렀는지 알 수 없다. 순서는 손잡이 → ✓ → 이름이다.
   flex-shrink 를 열어둔다 - 5분(약 25px)짜리에서는 양쪽이 절반씩 나눠 갖는다.
   touch-action: none 이라 잡으면 곧바로 우리 제스처가 되고, 좁아서 화면
   스크롤을 가로막지도 않는다.

   평소에는 바탕 없이 가는 눈금만 둔다. 시간표에서 읽어야 하는 것은 과목과
   내용이지 손잡이가 아니다. 폭은 줄이되 높이는 조각 전체를 쓴다 - 세로로 길면
   좁아도 손가락이 잡는다. */
.tt-handle {
  flex: 0 1 12px; min-width: 7px; align-self: stretch;
  border: 0; background: transparent; padding: 0;
  cursor: ew-resize; touch-action: none;
  display: flex; align-items: center; justify-content: center;
}
.tt-handle::before {
  content: ""; width: 2px; height: 42%; border-radius: 1px; background: rgba(31,35,41,.26);
}
/* 끝 손잡이는 늘 조각의 오른쪽 끝이다. 줄이 바뀌어 이어지는 조각에서는 이것이
   유일한 자식이라, 밀어주지 않으면 왼쪽에 붙어 엉뚱한 자리를 잡는다. */
.tt-handle-end { margin-left: auto; }
/* 맞닿은 두 블록이 함께 움직이는 경계. 잡으면 양쪽이 같이 바뀌므로 눈금을
   둘로 나눠 구분한다. */
.tt-handle-shared { flex-basis: 15px; }
.tt-handle-shared::before { box-shadow: 4px 0 0 rgba(31,35,41,.26), -4px 0 0 rgba(31,35,41,.26); }
/* 잡고 있는 동안에만 또렷해진다. */
.tt-handle-on { background: rgba(255,255,255,.75); }
.tt-handle-on::before { background: var(--accent); width: 3px; height: 58%; }
.tt-handle-shared.tt-handle-on::before { box-shadow: 5px 0 0 var(--accent), -5px 0 0 var(--accent); }

/* 미리보기. 손을 떼면 이렇게 된다는 그림이다. 원래 블록은 흐려지므로(.tt-seg-lifted)
   이쪽이 결과로 읽힌다. 과목 색을 옅게 깔아 어느 블록인지 알아본다. */
/* z-index 를 줘야 블록 위로 올라온다. 자리만 겹쳐 놓으면 미리보기의 배경은
   블록 배경 위에 깔리지만, 블록의 글자는 그보다 늦게 그려져 미리보기를 뚫고
   나온다(CSS 는 인라인 내용을 블록 배경보다 나중에 그린다). */
.tt-ghost {
  background: rgba(76,110,245,.25); border: 1.5px dashed var(--accent);
  margin: 2px 0; pointer-events: none; overflow: hidden;
  position: relative; z-index: 4;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
}
.tt-ghost-label { font-size: 10px; font-weight: 700; color: var(--accent); background: rgba(255,255,255,.9); padding: 0 4px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tt-ghost-sub { font-size: 9px; font-weight: 700; color: #1F2329; background: rgba(255,255,255,.9); padding: 0 4px; border-radius: 4px; white-space: nowrap; }

/* ---------- 탭과 좌우 넘김 ---------- */
.pager-wrap { margin-top: 4px; }
.tabs { display: flex; gap: 6px; padding: 0 2px 8px; }
.tab {
  flex: 1; min-height: 40px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
}
.tab-on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
/* 화면에는 보고 있는 쪽 하나만 들어간다. 높이는 그 내용만큼 자란다 - 재서
   넣을 것이 없다. overflow 는 넘어올 때의 미끄러짐만 가린다. */
.pager { overflow: hidden; touch-action: pan-y; }
.pager-page { min-width: 0; }
.page-in-left { animation: page-in-left .18s ease-out; }
.page-in-right { animation: page-in-right .18s ease-out; }
@keyframes page-in-left { from { transform: translateX(26%); opacity: .35; } to { transform: none; opacity: 1; } }
@keyframes page-in-right { from { transform: translateX(-26%); opacity: .35; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .page-in-left, .page-in-right { animation: none; } }

.tt-now-row { grid-column: 1 / -1; position: relative; pointer-events: none; }
.tt-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); }
.tt-now::before { content: ""; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }

.editor-range { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; margin-bottom: 12px; }
.editor-duration { font-size: 13px; color: var(--muted); }
.stepper { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin-bottom: 10px; }
.stepper-label { font-size: 13px; color: var(--muted); }
/* .btn과 특이도가 같고 뒤에 오므로 이 값이 이긴다(cal-today-btn과 동일 패턴). 44px 아래로 내리면 안 된다. */
.stepper-btn { min-height: 44px; padding: 0 12px; }

/* 짧은 블록은 트랙 위 ✓가 작아 누르기 어렵다. 시트에서도 완료를 바꿀 수 있어야 한다. */
.editor-done { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 14px; cursor: pointer; }
.editor-done input { width: 24px; height: 24px; }

/* ---------- 시트 내부 ---------- */
.sheet-sub { margin: 16px 0 8px; font-size: 13px; color: var(--muted); }
.sheet-sub:first-child { margin-top: 0; }

.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
/* 브리프 원안은 38px였다. 범위/요일/모드 선택 칩은 주 탭 타깃이므로 44px로 올린다. */

  <script>
(function (root) {
  const DAY_START = 300;   // 05:00
  const DAY_END = 1560;    // 익일 02:00
  const SLOT = 5;
  const DAY_BOUNDARY_HOUR = 4;
  const WEEKDAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function snapToSlot(minutes) {
    return Math.round(minutes / SLOT) * SLOT;
  }

  function clampToDay(minutes) {
    return Math.min(DAY_END, Math.max(DAY_START, minutes));
  }

  function minutesToLabel(minutes) {
    const wrapped = ((minutes % 1440) + 1440) % 1440;
    return pad2(Math.floor(wrapped / 60)) + ":" + pad2(wrapped % 60);
  }

  function formatDuration(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h === 0) return m + "분";
    if (m === 0) return h + "시간";
    return h + "시간 " + m + "분";
  }

  function dateKey(date) {
    return (
      date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate())
    );
  }

  function parseDateKey(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  // 모양만 보면 안 된다. "2026-02-30"은 정규식을 통과하지만 파싱하면 3월 2일이 되어
  // 화면에 뜨는 날짜와 D-day 계산이 어긋난다. 왕복시켜 같은 문자열이 나오는지 본다.
  function isValidDateKey(key) {
    if (typeof key !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return false;
    return dateKey(parseDateKey(key)) === key;
  }

  function addDays(key, n) {
    const d = parseDateKey(key);
    d.setDate(d.getDate() + n);
    return dateKey(d);
  }

  function toUTCms(key) {
    const [y, m, d] = key.split("-").map(Number);
    return Date.UTC(y, m - 1, d);
  }

  function daysBetween(fromKey, toKey) {
    return Math.round((toUTCms(toKey) - toUTCms(fromKey)) / 86400000);
  }

  function weekdayOf(key) {
    return parseDateKey(key).getDay();
  }

  function plannerDateKey(now) {
    const shifted = new Date(now.getTime());
    shifted.setHours(shifted.getHours() - DAY_BOUNDARY_HOUR);
    return dateKey(shifted);
  }

  function formatDateKorean(key) {
    const d = parseDateKey(key);
    return (
      d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate() +
      ". (" + WEEKDAY_NAMES[d.getDay()] + ")"
    );
  }

  const datetime = {
    DAY_START, DAY_END, SLOT, DAY_BOUNDARY_HOUR, WEEKDAY_NAMES,
    snapToSlot, clampToDay, minutesToLabel, formatDuration,
    dateKey, parseDateKey, isValidDateKey, addDays, daysBetween, weekdayOf,
    plannerDateKey, formatDateKorean,
  };

  root.SP = root.SP || {};
  root.SP.datetime = datetime;
  if (typeof module !== "undefined") module.exports = datetime;
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>
  <script>
(function (root) {
  const dt = typeof require !== "undefined" ? require("./datetime.js") : root.SP.datetime;

  const STORAGE_KEY = "studyPlanner.v1";
  const SCHEMA_VERSION = 1;

  const DEFAULT_SUBJECTS = [
    { id: "kor", name: "국어", color: "#FFE08A" },
    { id: "eng", name: "영어", color: "#A8E6CF" },
    { id: "math", name: "수학", color: "#FFB3BA" },
    { id: "soc", name: "사회", color: "#BAE1FF" },
    { id: "sci", name: "과학", color: "#D5C6FF" },
    { id: "hist", name: "한국사", color: "#FFD6A5" },
    { id: "etc", name: "기타", color: "#D9D9D9" },
  ];

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function emptyDay() {
    return { achievement: 0, memo: "", todos: [], blocks: [], updatedAt: 0 };
  }

  function isDayEmpty(day) {
    return (
      !day ||
      ((day.todos || []).length === 0 &&
        (day.blocks || []).length === 0 &&
        !day.memo &&
        !day.achievement)
    );
  }

  function validateBlock(b) {
    if (!b || typeof b.start !== "number" || typeof b.end !== "number")
      return { ok: false, error: "시간이 올바르지 않습니다." };
    if (b.start % dt.SLOT !== 0 || b.end % dt.SLOT !== 0)
      return { ok: false, error: "시간은 5분 단위여야 합니다." };
    if (b.end - b.start < dt.SLOT)
      return { ok: false, error: "블록은 최소 5분이어야 합니다." };
    if (b.start < dt.DAY_START || b.end > dt.DAY_END)
      return { ok: false, error: "05:00 ~ 익일 02:00 범위 안에만 만들 수 있습니다." };
    return { ok: true, error: null };
  }

  function overlaps(a, b) {
    return a.start < b.end && b.start < a.end;
  }

  function findOverlap(blocks, candidate, ignoreId) {
    for (const b of blocks) {
      if (ignoreId && b.id === ignoreId) continue;
      if (b.id === candidate.id) continue;
      if (overlaps(b, candidate)) return b;
    }
    return null;
  }

  // anchor = 손가락을 처음 댄 지점, cursor = 지금 위치. 둘 다 클램프해서 쓴다.
  //
  // 계약:
  //   1. anchor가 빈 구간에 있으면 (호출부가 항상 보장하는 조건) 결과는 anchor를
  //      품고, 드래그 방향으로 가장 가까운 블록 경계에서 멈춘다.
  //   2. anchor가 블록 안에 있으면 (UI에서는 도달 불가한 방어적 경로) 결과를
  //      그 블록 밖으로, 드래그 방향 쪽으로 밀어낸다. 이때는 anchor를 품지 않는다.
  //   3. 남는 자리가 없으면 빈 구간(start === end)을 돌려준다. 호출부가 최소 5분
  //      검사로 걸러낸다.
  //
  // 방향을 구간의 중점으로 판정하면 안 된다 — 멀리 드래그할 때 선택이 기존
  // 블록을 통째로 건너뛴다.
  function limitRange(blocks, anchor, cursor, ignoreId) {
    const a = dt.clampToDay(anchor);
    const c = dt.clampToDay(cursor);
    let lo = Math.min(a, c);
    let hi = Math.max(a, c);
    for (const b of blocks) {
      if (ignoreId && b.id === ignoreId) continue;
      if (b.end <= lo || b.start >= hi) continue;
      if (b.end <= a) lo = Math.max(lo, b.end);          // 블록이 anchor 위쪽
      else if (b.start >= a) hi = Math.min(hi, b.start); // 블록이 anchor 아래쪽
      else if (c >= a) lo = Math.max(lo, b.end);         // anchor가 블록 안 + 아래로 끄는 중
      else hi = Math.min(hi, b.start);                   // anchor가 블록 안 + 위로 끄는 중
    }
    if (hi < lo) hi = lo;
    return { start: lo, end: hi };
  }

  // 과목을 안 고른 블록은 공부로 세지 않는다. 밥 먹기·이동·쉬는 시간처럼
  // 시간표에는 두고 싶지만 공부는 아닌 것이 여기 들어온다.
  //
  // 거르는 자리는 합계 함수 안이다. 목표시간·실제시간·달성률·달력이 모두 이
  // 함수들을 거치므로, 화면마다 따로 거르면 어느 하나가 빠졌을 때 값이 어긋난다.
  function isStudy(b) {
    return !!(b && b.subjectId);
  }

  function sumPlanned(blocks) {
    return (blocks || []).reduce((sum, b) => (isStudy(b) ? sum + (b.end - b.start) : sum), 0);
  }

  function sumDone(blocks) {
    return (blocks || []).reduce((sum, b) => (isStudy(b) && b.done ? sum + (b.end - b.start) : sum), 0);
  }

  // 시간표에는 있는데 합계에서 빠진 시간. 왜 목표시간이 시간표보다 적은지
  // 화면에서 설명하려면 이 값이 필요하다.
  function sumUncounted(blocks) {
    return (blocks || []).reduce((sum, b) => (isStudy(b) ? sum : sum + (b.end - b.start)), 0);
  }

  // 달성률은 계획 대비 실제다. 하루 화면과 달력이 같은 값을 보여야 하므로
  // 여기 한 곳에서만 계산한다. 계획이 없으면 나눌 수 없으니 0이다.
  function doneRatio(blocks) {
    const planned = sumPlanned(blocks);
    if (planned <= 0) return 0;
    return Math.min(100, Math.round((sumDone(blocks) / planned) * 100));
  }

  function sanitizeState(raw) {
    // 저장된 데이터가 아예 없는 첫 실행은 "복구"가 아니다. 구분하지 않으면 앱을 처음
    // 켠 사용자에게 매번 데이터 손상 경고 배너가 뜬다. fresh일 때는 기본값을 몇 개
    // 채워 넣든 recovered를 올리지 않는다.
    const fresh = raw == null;
    let recovered = false;
    const mark = () => { if (!fresh) recovered = true; };

    if (fresh || typeof raw !== "object" || Array.isArray(raw)) {
      mark();
      raw = {};
    }

    const version = typeof raw.version === "number" ? raw.version : SCHEMA_VERSION;
    const readOnly = version > SCHEMA_VERSION;
    if (typeof raw.version !== "number") mark();

    // 걸러낸 뒤에 기본값을 채운다. 순서를 바꾸면 subjects: [null] 같은 입력이
    // 빈 과목 목록으로 남아 앱에 과목이 하나도 없게 된다.
    let subjects = raw.settings && Array.isArray(raw.settings.subjects) ? raw.settings.subjects : null;
    if (!subjects) mark();
    subjects = (subjects || []).filter((s) => s && typeof s.id === "string" && typeof s.name === "string");
    if (subjects.length === 0) { mark(); subjects = DEFAULT_SUBJECTS.map((s) => ({ ...s })); }

    const days = {};
    const rawDays = raw.days && typeof raw.days === "object" && !Array.isArray(raw.days) ? raw.days : (mark(), {});
    for (const [key, value] of Object.entries(rawDays)) {
      if (!dt.isValidDateKey(key)) { mark(); continue; }
      if (!value || typeof value !== "object") { mark(); continue; }
      const day = emptyDay();
      day.achievement = typeof value.achievement === "number" ? Math.min(100, Math.max(0, value.achievement)) : 0;
      day.memo = typeof value.memo === "string" ? value.memo : "";
      day.updatedAt = typeof value.updatedAt === "number" ? value.updatedAt : 0;
      // 과목이 없으면 완료도 없다. 이 규칙이 생기기 전에 켜둔 표시가 남아 있으면
      // 화면에 체크가 없어 끌 방법이 사라진다. 손상이 아니라 정리이므로 mark() 하지 않는다.
      day.todos = (Array.isArray(value.todos) ? value.todos : []).filter((t) => t && typeof t.text === "string")
        .map((t) => ({ id: t.id || newId(), subjectId: t.subjectId || null, text: t.text, done: !!(t.subjectId && t.done) }));
      const accepted = [];
      for (const b of Array.isArray(value.blocks) ? value.blocks : []) {
        const block = { id: (b && b.id) || newId(), subjectId: (b && b.subjectId) || null,
          text: b && typeof b.text === "string" ? b.text : "", start: b && b.start, end: b && b.end,
          done: !!(b && b.subjectId && b.done), todoId: b && typeof b.todoId === "string" ? b.todoId : null };
        if (!validateBlock(block).ok) { mark(); continue; }
        if (findOverlap(accepted, block)) { mark(); continue; }
        accepted.push(block);
      }
      day.blocks = accepted.sort((a, b) => a.start - b.start);

      // 가리키는 할 일이 없는 링크는 끊는다. 블록은 살린다 — 시각 정보가 더 아깝다.
      // JSON 가져오기로 얼마든지 들어올 수 있는 모양이다.
      const todoIds = new Set(day.todos.map((t) => t.id));
      for (const b of day.blocks) {
        if (b.todoId && !todoIds.has(b.todoId)) { mark(); b.todoId = null; }
      }
      if (isDayEmpty(day)) continue;
      days[key] = day;
    }

    const events = (Array.isArray(raw.events) ? raw.events : (mark(), []))
      .filter((e) => e && typeof e.title === "string" && dt.isValidDateKey(e.startDate))
      .map((e) => ({
        id: e.id || newId(), title: e.title, type: e.type || "etc", color: e.color || "#FFA94D",
        startDate: e.startDate, endDate: dt.isValidDateKey(e.endDate) ? e.endDate : e.startDate,
        memo: typeof e.memo === "string" ? e.memo : "",
      }));

    // clipboard는 describeClip이 ⋯ 메뉴를 그릴 때마다 읽는다. 모양이 깨진 값을
    // 통과시키면 메뉴가 통째로 안 열리고, 앱 안에서 복구할 방법이 없어진다.
    let clipboard = null;
    const rawClip = raw.clipboard;
    if (rawClip && typeof rawClip === "object" && rawClip.payload && typeof rawClip.payload === "object") {
      if (rawClip.kind === "day" &&
          Array.isArray(rawClip.payload.todos) && Array.isArray(rawClip.payload.blocks)) {
        clipboard = rawClip;
      } else if (rawClip.kind === "week" &&
                 rawClip.payload.byWeekday && typeof rawClip.payload.byWeekday === "object") {
        clipboard = rawClip;
      }
    }
    if (raw.clipboard && !clipboard) mark();

    // 사전의 분류. 항목 자체는 날짜 데이터에서 뽑으므로 여기서 지킬 것은
    // 사용자가 만든 분류와 배정뿐이다. 없는 것은 손상이 아니다 — 이 기능이
    // 생기기 전에 저장된 데이터에는 당연히 없다.
    const dictionary = { groups: [], assign: {} };
    const rawDict = raw.dictionary;
    if (rawDict && typeof rawDict === "object" && !Array.isArray(rawDict)) {
      dictionary.groups = (Array.isArray(rawDict.groups) ? rawDict.groups : [])
        .filter((g) => g && typeof g.id === "string" && typeof g.name === "string")
        .map((g) => ({ id: g.id, name: g.name }));
      const ids = new Set(dictionary.groups.map((g) => g.id));
      const rawAssign = rawDict.assign && typeof rawDict.assign === "object" && !Array.isArray(rawDict.assign)
        ? rawDict.assign : {};
      for (const [text, gid] of Object.entries(rawAssign)) {
        // 없어진 분류를 가리키는 배정은 버린다. 남겨두면 어느 묶음에도 안 잡힌다.
        if (typeof gid === "string" && ids.has(gid)) dictionary.assign[text] = gid;
      }
    } else if (rawDict != null) {
      mark();
    }

    return {
      state: { version, settings: { subjects, dayBoundaryHour: dt.DAY_BOUNDARY_HOUR }, days, events, clipboard, dictionary },
      recovered,
      readOnly,
    };
  }

  function createStore(storage) {
    let state = sanitizeState(null).state;
    let error = null;
    let readOnly = false;

    function load() {
      let parsed = null;
      let corrupt = false;
      try {
        const text = storage.getItem(STORAGE_KEY);
        if (text) parsed = JSON.parse(text);
      } catch (e) {
        corrupt = true;
        try { storage.setItem(STORAGE_KEY + ".corrupt." + Date.now(), storage.getItem(STORAGE_KEY) || ""); } catch (_) {}
        try { storage.removeItem(STORAGE_KEY); } catch (_) {}
      }
      const result = sanitizeState(parsed);
      state = result.state;
      readOnly = result.readOnly;
      return { recovered: corrupt || result.recovered, readOnly };
    }

    function save() {
      if (readOnly) return false;
      try {
        storage.setItem(STORAGE_KEY, JSON.stringify(state));
        error = null;
        return true;

  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const subjectsApi = SP.subjects;
  const eventsApi = SP.events;
  const clip = SP.clipboard;
  const ui = SP.ui;

  function afterMutation(onDone) {
    SP.app.persist();
    ui.closeSheet();
    if (onDone) onDone();
  }

  /* ---------- 일정 ---------- */

  function eventEditor(dateKey, eventId, onDone) {
    const state = SP.app.state();
    const existing = eventId ? state.events.find((e) => e.id === eventId) : null;

    const title = ui.el("input", { type: "text", value: existing ? existing.title : "", placeholder: "예: 국어 수행평가", maxlength: "40" });
    const typeSelect = ui.el("select", { class: "subject-select" },
      eventsApi.EVENT_TYPES.map((t) =>
        ui.el("option", { value: t.id, text: t.label, selected: existing ? existing.type === t.id : t.id === "assessment" }))
    );
    const startInput = ui.el("input", { type: "date", value: existing ? existing.startDate : dateKey });
    const endInput = ui.el("input", { type: "date", value: existing ? existing.endDate : dateKey });
    const memoInput = ui.el("textarea", { placeholder: "메모 (선택)", maxlength: "300" });
    if (existing) memoInput.value = existing.memo;

    function save() {
      const payload = {
        title: title.value, type: typeSelect.value,
        color: eventsApi.typeOf(typeSelect.value).color,
        startDate: startInput.value, endDate: endInput.value, memo: memoInput.value,
      };
      if (!payload.title.trim()) { ui.toast("제목을 입력하세요."); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(payload.startDate)) { ui.toast("시작일을 선택하세요."); return; }
      if (existing) eventsApi.updateEvent(state, eventId, payload);
      else eventsApi.addEvent(state, payload);
      afterMutation(onDone);
    }

    ui.openSheet({
      title: existing ? "일정 수정" : "일정 추가",
      body: [
        ui.el("label", { class: "field" }, [ui.el("span", { text: "제목" }), title]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "유형" }), typeSelect]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "시작일" }), startInput]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "종료일 (하루면 시작일과 같게)" }), endInput]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "메모" }), memoInput]),
      ],
      actions: [
        existing
          ? ui.el("button", { class: "btn btn-danger", text: "삭제", onclick: () => {
              eventsApi.removeEvent(state, eventId); afterMutation(onDone);
            } })
          : ui.el("button", { class: "btn btn-ghost", text: "취소", onclick: ui.closeSheet }),
        ui.el("button", { class: "btn btn-primary", text: "저장", onclick: save }),
      ],
    });
  }

  /* ---------- 붙여넣기 ---------- */

  function pasteSheet(baseKey, onDone) {
    const state = SP.app.state();
    if (!state.clipboard) { ui.toast("먼저 계획을 복사하세요."); return; }

    let range = { type: "day" };
    let filter = { type: "all" };
    let mode = "overwrite";

    const customFrom = ui.el("input", { type: "date", value: baseKey });
    const customTo = ui.el("input", { type: "date", value: baseKey });
    const customRow = ui.el("div", { class: "custom-range", hidden: true }, [
      ui.el("label", { class: "field" }, [ui.el("span", { text: "시작" }), customFrom]),
      ui.el("label", { class: "field" }, [ui.el("span", { text: "끝" }), customTo]),
    ]);

    const weekdayBoxes = dt.WEEKDAY_NAMES.map((name, i) =>
      ui.el("label", { class: "wd-chip" }, [
        ui.el("input", { type: "checkbox", value: String(i), checked: true, onchange: update }),
        ui.el("span", { text: name }),
      ])
    );
    const weekdayRow = ui.el("div", { class: "wd-row", hidden: true }, weekdayBoxes);

    const preview = ui.el("p", { class: "paste-preview" });

    function currentRange() {
      if (range.type !== "custom") return range;
      return { type: "custom", from: customFrom.value || baseKey, to: customTo.value || baseKey };
    }

    function currentFilter() {
      if (filter.type !== "custom") return filter;
      const days = weekdayBoxes
        .map((box) => (box.querySelector("input").checked ? Number(box.querySelector("input").value) : -1))
        .filter((n) => n >= 0);
      return { type: "custom", days };
    }

    function targets() {
      return clip.resolveTargetDates(currentRange(), currentFilter(), baseKey);
    }

    function update() {
      customRow.hidden = range.type !== "custom";
      weekdayRow.hidden = filter.type !== "custom";
      preview.textContent = "총 " + targets().length + "일에 적용됩니다.";
    }

    function chipGroup(options, getActive, onPick) {
      const group = ui.el("div", { class: "chip-group" });
      options.forEach((opt) => {
        const chip = ui.el("button", {
          class: "chip", text: opt.label,
          onclick: () => {
            onPick(opt.value);
            [...group.children].forEach((c) => c.classList.remove("chip-on"));
            chip.classList.add("chip-on");
            update();
          },
        });
        if (getActive() === opt.value) chip.classList.add("chip-on");
        group.appendChild(chip);
      });
      return group;
    }

    customFrom.addEventListener("change", update);
    customTo.addEventListener("change", update);

    ui.openSheet({
      title: "붙여넣기",
      body: [
        ui.el("p", { class: "paste-source", text: clip.describeClip(state.clipboard) }),
        ui.el("h3", { class: "sheet-sub", text: "범위" }),
        chipGroup(
          [
            { label: "이 날", value: "day" }, { label: "이번 주", value: "week" },
            { label: "이번 달", value: "month" }, { label: "올해", value: "year" },
            { label: "직접 선택", value: "custom" },
          ],
          () => range.type,
          (v) => { range = { type: v }; }
        ),
        customRow,
        ui.el("h3", { class: "sheet-sub", text: "요일" }),
        chipGroup(
          [
            { label: "전체", value: "all" }, { label: "평일만", value: "weekday" },
            { label: "주말만", value: "weekend" }, { label: "직접 선택", value: "custom" },
          ],
          () => filter.type,
          (v) => { filter = { type: v }; }
        ),
        weekdayRow,
        ui.el("h3", { class: "sheet-sub", text: "기존 계획" }),
        chipGroup(
          [
            { label: "덮어쓰기", value: "overwrite" },
            { label: "겹치지 않는 것만 추가", value: "merge" },
            { label: "계획 있는 날 건너뛰기", value: "skip" },
          ],
          () => mode,
          (v) => { mode = v; }
        ),
        preview,
      ],
      actions: [
        ui.el("button", { class: "btn btn-ghost", text: "취소", onclick: ui.closeSheet }),
        ui.el("button", { class: "btn btn-primary", text: "붙여넣기", onclick: () => {
          const keys = targets();
          if (keys.length === 0) { ui.toast("대상 날짜가 없습니다."); return; }
          const result = clip.paste(state, state.clipboard, keys, mode);
          afterMutation(onDone);
          const parts = [result.applied + "일 적용"];
          if (result.skipped) parts.push(result.skipped + "일 건너뜀");
          if (result.skippedBlocks) parts.push("겹친 블록 " + result.skippedBlocks + "개 제외");
          ui.toast(parts.join(" · "));
        } }),
      ],
    });
    update();
  }

  /* ---------- 하루 메뉴 ---------- */

  function dayMenu(dateKey, onDone) {
    const state = SP.app.state();

    function copyDay() {
      const result = clip.copyDay(state, dateKey);
      if (!result) { ui.toast("복사할 계획이 없습니다."); return; }
      state.clipboard = result;
      SP.app.persist();
      ui.closeSheet();
      ui.toast("이 날 계획을 복사했습니다.");
    }

    function copyWeek() {
      const result = clip.copyWeek(state, dateKey);
      if (!result) { ui.toast("이 주에 복사할 계획이 없습니다."); return; }
      state.clipboard = result;
      SP.app.persist();
      ui.closeSheet();
      ui.toast("이 주 계획을 복사했습니다.");
    }

    async function resetDay() {
      ui.closeSheet();
      const ok = await ui.confirmDialog("이 날의 할 일, 시간 블록, 성취도, 메모를 모두 지웁니다.\n일정은 지워지지 않습니다.");
      if (!ok) return;
      SP.app.store().setDay(dateKey, { todos: [], blocks: [], achievement: 0, memo: "" });
      SP.app.persist();
      if (onDone) onDone();
      ui.toast("초기화했습니다.");
    }

    ui.openSheet({
      title: dt.formatDateKorean(dateKey),
      body: [
        ui.el("p", { class: "paste-source", text: clip.describeClip(state.clipboard) }),
        ui.el("div", { class: "menu" }, [
          ui.el("button", { class: "menu-item", text: "이 날 복사", onclick: copyDay }),
          ui.el("button", { class: "menu-item", text: "이 주 복사", onclick: copyWeek }),
          ui.el("button", { class: "menu-item", text: "여기에 붙여넣기", onclick: () => { ui.closeSheet(); pasteSheet(dateKey, onDone); } }),
          ui.el("button", { class: "menu-item", text: "일정 추가", onclick: () => { ui.closeSheet(); eventEditor(dateKey, null, onDone); } }),
          // 사전이 모으는 할 일은 날짜와 무관하지만, 거기서 고른 것을 넣을 곳은
          // 이 날짜다. 그래서 날짜를 함께 넘긴다.
          ui.el("button", { class: "menu-item", text: "사전", onclick: () => { ui.closeSheet(); SP.dictsheet.open(dateKey, onDone); } }),
          ui.el("button", { class: "menu-item", text: "설정", onclick: () => { ui.closeSheet(); settings(onDone); } }),
          ui.el("button", { class: "menu-item menu-danger", text: "하루 초기화", onclick: resetDay }),
        ]),
      ],
    });
  }

  /* ---------- 설정 ---------- */

  function settings(onDone) {
    const state = SP.app.state();

    function subjectRow(subject) {
      // 과목을 고치면 시트 아래 화면의 태그 색·이름도 즉시 따라가야 한다.
      // onDone을 부르지 않으면 다른 화면으로 갔다 돌아올 때까지 옛 색이 남는다.
      const nameInput = ui.el("input", { type: "text", value: subject.name, maxlength: "12",
        onchange: (e) => {
          subjectsApi.updateSubject(state, subject.id, { name: e.target.value });
          SP.app.persist();
          if (onDone) onDone();
        } });
      const colorInput = ui.el("input", { type: "color", value: subject.color,
        onchange: (e) => {
          subjectsApi.updateSubject(state, subject.id, { color: e.target.value });
          SP.app.persist();
          if (onDone) onDone();
        } });
      const removeBtn = ui.el("button", { class: "icon-btn", text: "🗑", "aria-label": "삭제", onclick: async () => {
        const count = subjectsApi.countReferences(state, subject.id);
        ui.closeSheet();
        const ok = await ui.confirmDialog(
          "'" + subject.name + "' 과목을 삭제합니다.\n" +
          (count > 0 ? count + "개 항목이 '과목 없음'이 됩니다." : "사용 중인 항목은 없습니다."));
        if (!ok) { settings(onDone); return; }
        if (subjectsApi.removeSubject(state, subject.id) === -1) ui.toast("마지막 과목은 지울 수 없습니다.");
        SP.app.persist();
        if (onDone) onDone();
        settings(onDone);
      } });
      return ui.el("div", { class: "subject-row" }, [colorInput, nameInput, removeBtn]);
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = ui.el("a", { href: url, download: "study-planner-" + SP.app.today() + ".json" });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    const fileInput = ui.el("input", { type: "file", accept: "application/json", class: "hidden-file",
      onchange: (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          let parsed = null;
          try { parsed = JSON.parse(reader.result); }
          catch (_) { ui.toast("JSON 파일을 읽을 수 없습니다."); return; }
          const result = storeApi.sanitizeState(parsed);
          // 파싱은 됐지만 이 앱의 백업 파일이 아니면 통째로 기본값이 된다. 그대로
          // 진행하면 학생이 파일을 잘못 골랐을 때 한 학기 기록이 빈 상태로 덮이고
          // "불러왔습니다"라고 뜬다. 되돌릴 수 없으므로 여기서 막는다.
          const empty = Object.keys(result.state.days).length === 0 && result.state.events.length === 0;
          if (result.recovered || empty) {
            ui.toast("이 앱의 백업 파일이 아닙니다. 불러오지 않았습니다.");
            return;
          }
          ui.closeSheet();
          const ok = await ui.confirmDialog("현재 기기의 계획을 파일 내용으로 완전히 교체합니다.\n되돌릴 수 없습니다.");
          if (!ok) { settings(onDone); return; }
          const target = SP.app.state();
          target.settings = result.state.settings;
          target.days = result.state.days;
          target.events = result.state.events;
          target.clipboard = result.state.clipboard;
          SP.app.persist();
          if (onDone) onDone();
          ui.toast("불러왔습니다.");
        };
        reader.readAsText(file);
      } });

    ui.openSheet({
      title: "설정",
      body: [
        ui.el("h3", { class: "sheet-sub", text: "과목" }),
        ui.el("div", { class: "subject-list" }, state.settings.subjects.map(subjectRow)),
        ui.el("button", { class: "btn add-btn", text: "+ 과목 추가", onclick: () => {
          subjectsApi.addSubject(state, "새 과목", "#DDDDDD");
          SP.app.persist();
          if (onDone) onDone();
          settings(onDone);
        } }),
        ui.el("h3", { class: "sheet-sub", text: "백업" }),
        ui.el("p", { class: "empty", text: "이 기기에만 저장됩니다. 기기를 바꾸기 전에 반드시 내보내세요." }),
        ui.el("div", { class: "backup-row" }, [
          ui.el("button", { class: "btn", text: "JSON 내보내기", onclick: exportJson }),
          ui.el("button", { class: "btn", text: "JSON 불러오기", onclick: () => fileInput.click() }),
        ]),
        fileInput,
      ],
    });
  }

  const api = { dayMenu, eventEditor, pasteSheet, settings };
  SP.sheets = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const ui = SP.ui;
  const dt = SP.datetime;
  const storeApi = SP.store;
  const dictApi = SP.dict;
  const subjectsApi = SP.subjects;

  // 항목이 이만큼 넘어야 찾기 칸을 보여준다. 서너 개뿐인데 검색창이 있으면
  // 자리만 차지한다.
  const SEARCH_FROM = 8;
  // 사전에서 바로 넣는 블록의 기본 길이. 어차피 편집 시트가 곧바로 열리므로
  // 여기서 고민할 값이 아니다.
  const DEFAULT_MINUTES = 60;

  // 무엇을 보고 있었는지는 시트를 닫아도 남는다. 한 분류를 정리하는 동안 열 때마다
  // 처음으로 돌아가면 정리가 되지 않는다.
  let filter = "all"; // "all" | "none" | 분류 id

  // 사전. 여태 등록한 할 일을 모든 날짜에서 모아 본다.
  //
  // 시트를 다시 열어 그리지 않는다. 예전에는 분류를 하나 바꿀 때마다 시트가
  // 닫혔다 열려서, 어디를 보고 있었는지 매번 잃었다. 안쪽만 다시 그린다.
  function open(dateKey, onChange) {
    const groupsNow = () => SP.app.state().dictionary.groups;
    // 지난번에 보던 분류가 그 사이 없어졌을 수 있다. 그대로 두면 빈 목록만 뜬다.
    if (filter !== "all" && filter !== "none" && !groupsNow().some((g) => g.id === filter)) filter = "all";

    let mode = "";  // "" | "add" | "rename" | "del"
    let query = "";

    const chipsHost = ui.el("div", {});
    const manageHost = ui.el("div", {});
    const listHost = ui.el("div", {});
    // 찾기 칸은 한 번만 만든다. 다시 그리면 한 글자 칠 때마다 포커스가 떨어진다.
    const search = ui.el("input", {
      type: "search", class: "dict-search", placeholder: "이름으로 찾기", maxlength: "40",
      oninput: (e) => { query = e.target.value; paintList(); },
    });
    const searchRow = ui.el("div", { class: "dict-search-row" }, [search]);

    function currentGroup() {
      return groupsNow().find((g) => g.id === filter) || null;
    }

    function save() {
      SP.app.persist();
      paintAll();
    }

    /* ---------- 분류 칩 ---------- */

    function paintChips() {
      const list = dictApi.entries(SP.app.state());
      const counts = new Map();
      for (const e of list) {
        const key = e.groupId || "none";
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      const chip = (key, name, n) => ui.el("button", {
        class: "chip dict-chip" + (filter === key ? " chip-on" : ""), type: "button",
        text: name + " " + n,
        onclick: () => { filter = key; mode = ""; paintAll(); },
      });

      const nodes = [chip("all", "전체", list.length)];
      for (const g of groupsNow()) nodes.push(chip(g.id, g.name, counts.get(g.id) || 0));
      nodes.push(chip("none", "미분류", counts.get("none") || 0));
      nodes.push(ui.el("button", {
        class: "chip dict-chip-new", type: "button", text: "＋ 분류",
        onclick: () => { mode = mode === "add" ? "" : "add"; paintManage(); },
      }));

      ui.clear(chipsHost).appendChild(ui.el("div", { class: "chip-group" }, nodes));
    }

    /* ---------- 분류 만들기 · 이름 바꾸기 · 없애기 ---------- */

    // 셋 다 이 줄 안에서 끝낸다. 새 시트를 띄우면 사전이 닫히고, 돌아왔을 때
    // 보던 자리를 잃는다.
    function paintManage() {
      ui.clear(manageHost);
      const group = currentGroup();

      if (mode === "add") {
        const input = ui.el("input", { type: "text", placeholder: "예: 학원, 학교 수업", maxlength: "20" });
        manageHost.appendChild(ui.el("div", { class: "row-add" }, [
          input,
          ui.el("button", { class: "btn", type: "button", text: "만들기", onclick: () => {
            const made = dictApi.addGroup(SP.app.state(), input.value);
            if (!made) { ui.toast("분류 이름을 입력하세요."); return; }
            // 방금 만든 분류를 바로 보여준다. 만들고 나서 다시 찾아 누르게 하지 않는다.
            filter = made.id;
            mode = "";
            save();
          } }),
        ]));
        setTimeout(() => input.focus(), 50);
        return;
      }

      if (!group) return;

      if (mode === "rename") {
        const input = ui.el("input", { type: "text", value: group.name, maxlength: "20" });
        manageHost.appendChild(ui.el("div", { class: "row-add" }, [
          input,
          ui.el("button", { class: "btn", type: "button", text: "저장", onclick: () => {
            if (!dictApi.renameGroup(SP.app.state(), group.id, input.value)) { ui.toast("이름을 입력하세요."); return; }
            mode = "";
            save();
          } }),
        ]));
        return;
      }

      if (mode === "del") {
        const freed = dictApi.entries(SP.app.state()).filter((e) => e.groupId === group.id).length;
        manageHost.appendChild(ui.el("div", { class: "dict-confirm" }, [
          ui.el("span", { class: "dict-confirm-msg", text: freed
            ? "할 일 " + freed + "개가 미분류로 갑니다. 할 일 자체는 남습니다."
            : "묶여 있는 할 일은 없습니다." }),
          ui.el("div", { class: "dict-confirm-btns" }, [
            ui.el("button", { class: "btn", type: "button", text: "취소", onclick: () => { mode = ""; paintManage(); } }),
            ui.el("button", { class: "btn btn-danger", type: "button", text: "없애기", onclick: () => {
              dictApi.removeGroup(SP.app.state(), group.id);
              filter = "all";
              mode = "";
              save();
            } }),
          ]),
        ]));
        return;
      }

      manageHost.appendChild(ui.el("div", { class: "dict-tools" }, [
        ui.el("button", { class: "link-btn", type: "button", text: "이름 바꾸기",
          onclick: () => { mode = "rename"; paintManage(); } }),
        ui.el("button", { class: "link-btn link-danger", type: "button", text: "분류 없애기",
          onclick: () => { mode = "del"; paintManage(); } }),
      ]));
    }

    /* ---------- 목록 ---------- */

    function visible() {
      const q = dictApi.normalize(query).toLowerCase();
      return dictApi.entries(SP.app.state()).filter((e) => {
        if (filter === "none" && e.groupId) return false;
        if (filter !== "all" && filter !== "none" && e.groupId !== filter) return false;
        return !q || e.text.toLowerCase().indexOf(q) >= 0;
      });
    }

    // 분류는 줄 안에서 바로 바꾼다. 눌러서 시트를 띄우던 예전 방식은, 지금 어느
    // 분류에 든 것인지 열어보기 전에는 알 수 없었다.
    function groupSelect(entry) {
      const select = ui.el("select", { class: "dict-group", "aria-label": entry.text + " 분류" }, [
        ui.el("option", { value: "", text: "미분류", selected: !entry.groupId }),
        ...groupsNow().map((g) => ui.el("option", { value: g.id, text: g.name, selected: g.id === entry.groupId })),
      ]);
      select.addEventListener("change", () => {
        dictApi.assignTo(SP.app.state(), entry.text, select.value || null);
        save();
      });
      return select;
    }

    // 오늘 계획의 빈 시간에 넣고 곧바로 편집 시트를 연다. 어디에 들어갔는지
    // 보여주고 그 자리에서 시간을 맞출 수 있어야 한다.
    function addToPlan(entry) {
      const day = SP.app.store().getDay(dateKey);
      const slot = SP.link.firstFreeSlot(day.blocks, DEFAULT_MINUTES);
      if (!slot) { ui.toast("빈 시간이 없습니다."); return; }
      const block = {
        id: storeApi.newId(), subjectId: entry.subjectId || null, text: entry.text,
        start: slot.start, end: slot.end, done: false, todoId: null,
      };
      SP.app.saveDay(dateKey, SP.link.commitBlock(day, block, "new", entry.text));
      ui.closeSheet();
      onChange();
      SP.timetable.openBlockEditor(dateKey, block.id, onChange);
    }

    function rowNode(entry) {
      const subjects = SP.app.state().settings.subjects;
      return ui.el("li", { class: "dict-row" }, [
        ui.el("div", { class: "dict-main" }, [
          ui.el("span", { class: "dict-name", text: entry.text }),
          ui.el("span", { class: "dict-meta", text:
            (subjectsApi.nameOf(subjects, entry.subjectId) || "과목 없음") + " · " + entry.count + "회" }),
        ]),
        groupSelect(entry),
        dateKey
          ? ui.el("button", {
              class: "icon-btn dict-add", type: "button", text: "＋",
              "aria-label": entry.text + " 계획에 넣기",
              onclick: () => addToPlan(entry),
            })
          : null,
      ]);
    }

    function paintList() {
      const all = dictApi.entries(SP.app.state());
      searchRow.hidden = all.length <= SEARCH_FROM;
      const rows = visible();
      ui.clear(listHost);
      if (rows.length) {
        listHost.appendChild(ui.el("ul", { class: "dict-list" }, rows.map(rowNode)));
        return;
      }
      listHost.appendChild(ui.el("p", { class: "empty", text:
        all.length === 0 ? "아직 등록한 할 일이 없습니다.\n계획을 세우면 여기에 쌓입니다."
          : query ? "찾는 이름이 없습니다."
          : "이 분류에 든 할 일이 없습니다." }));
    }

    function paintAll() {
      paintChips();
      paintManage();
      paintList();
    }

    paintAll();
    ui.openSheet({
      title: "사전",
      body: [
        chipsHost, manageHost, searchRow, listHost,
        // 줄마다 있는 ＋ 가 무엇인지 한 줄로 밝힌다. 아이콘만 두면 눌러보기 전에는 모른다.
        dateKey ? ui.el("p", { class: "dict-hint", text: "＋ 를 누르면 오늘 계획의 빈 시간에 넣습니다." }) : null,
      ],
      actions: [ui.el("button", { class: "btn btn-ghost", text: "닫기", onclick: ui.closeSheet })],
    });
  }

  const api = { open };
  SP.dictsheet = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const subjectsApi = SP.subjects;
  const ui = SP.ui;

  const LONG_PRESS_MS = 450;
  const MOVE_TOLERANCE = 8;

  function openEditor(dateKey, todoId, onDone) {
    const state = SP.app.state();
    const day = SP.app.store().getDay(dateKey);
    const existing = todoId ? day.todos.find((t) => t.id === todoId) : null;

    const select = subjectsApi.buildSelect(state.settings.subjects, existing ? existing.subjectId : null);
    const input = ui.el("input", { type: "text", value: existing ? existing.text : "", placeholder: "할 일을 입력하세요", maxlength: "80" });

    // 배정된 시간을 목록으로 다룬다. 저장 전까지는 여기서만 사는 사본이다.
    const own = SP.link.blocksOfTodo(day, todoId);
    const slots = own.map((b) => ({ id: b.id, start: b.start, end: b.end }));
    let active = slots.length ? 0 : -1;
    let labels = [];

    const listHost = ui.el("div", { class: "slot-list" });

    // 겹침을 볼 때는 다른 할 일의 블록에 더해, 아직 저장 안 된 이 목록의 다른
    // 줄도 함께 봐야 한다. 안 그러면 한 할 일 안에서 시간이 겹친 채 저장된다.
    function others(exceptIndex) {
      const list = day.blocks.filter((b) => b.todoId !== todoId);
      slots.forEach((s, i) => {
        if (i !== exceptIndex) list.push({ id: "slot" + i, start: s.start, end: s.end });
      });
      return list;
    }

    function paint(i) {
      const s = slots[i];
      labels[i].range.textContent = dt.minutesToLabel(s.start) + " ~ " + dt.minutesToLabel(s.end);
      labels[i].dur.textContent = dt.formatDuration(s.end - s.start);
    }

    function nudge(i, which, delta) {
      const s = slots[i];
      const nextStart = which === "start" ? dt.clampToDay(s.start + delta) : s.start;
      const nextEnd = which === "end" ? dt.clampToDay(s.end + delta) : s.end;
      if (nextEnd - nextStart < dt.SLOT) { ui.toast("시간은 최소 5분이어야 합니다."); return; }
      if (storeApi.findOverlap(others(i), { id: "__probe__", start: nextStart, end: nextEnd })) {
        ui.toast("다른 블록과 겹칩니다."); return;
      }
      s.start = nextStart; s.end = nextEnd;
      // 목록 전체를 다시 그리지 않는다. ±5분을 연타하는 동안 버튼이 갈리면
      // 탭이 떨어져 나간다.
      paint(i);
    }

    const stepper = (label, i, which) =>
      ui.el("div", { class: "stepper slot-step" }, [
        ui.el("span", { class: "stepper-label", text: label }),
        ui.el("button", { class: "btn stepper-btn", type: "button", text: "−5분", onclick: () => nudge(i, which, -dt.SLOT) }),
        ui.el("button", { class: "btn stepper-btn", type: "button", text: "+5분", onclick: () => nudge(i, which, dt.SLOT) }),
      ]);

    function addSlot() {
      const found = SP.link.firstFreeSlot(others(-1), 60);
      if (!found) { ui.toast("빈 시간이 없습니다."); return; }
      slots.push({ start: found.start, end: found.end });
      active = slots.length - 1;
      renderSlots();
    }

    function renderSlots() {
      ui.clear(listHost);
      labels = [];
      if (slots.length === 0) {
        listHost.appendChild(ui.el("p", { class: "empty", text: "배정된 시간이 없습니다." }));
      }
      slots.forEach((slot, i) => {
        const range = ui.el("span", { class: "slot-range" });
        const dur = ui.el("span", { class: "slot-dur" });
        labels[i] = { range, dur };
        listHost.appendChild(ui.el("div", { class: "slot" + (i === active ? " slot-on" : "") }, [
          ui.el("button", {
            class: "slot-head", type: "button",
            onclick: () => { active = active === i ? -1 : i; renderSlots(); },
          }, [range, dur]),
          ui.el("button", {
            class: "icon-btn slot-del", type: "button", text: "✕", "aria-label": "이 시간 빼기",
            onclick: () => {
              slots.splice(i, 1);
              if (active >= slots.length) active = slots.length - 1;
              renderSlots();
            },
          }),
        ]));
        paint(i);
        if (i === active) {
          listHost.appendChild(stepper("시작", i, "start"));
          listHost.appendChild(stepper("종료", i, "end"));
        }
      });
      listHost.appendChild(ui.el("button", { class: "btn add-btn", type: "button", text: "+ 시간 추가", onclick: addSlot }));
    }

    renderSlots();

    const save = () => {
      const text = input.value.trim();
      if (!text) { ui.toast("할 일을 입력하세요."); return; }
      const todo = existing
        ? { ...existing, subjectId: select.value || null, text }
        : { id: storeApi.newId(), subjectId: select.value || null, text, done: false };
      SP.app.saveDay(dateKey, SP.link.commitTodo(SP.app.store().getDay(dateKey), todo, slots));
      ui.closeSheet();
      onDone();
    };

    const remove = async () => {
      if (own.length > 0) {
        const ok = await ui.confirmDialog(
          "타임테이블에 배정된 " + own.length + "개 블록도 함께 지워집니다."
        );
        if (!ok) return;
      }
      SP.app.saveDay(dateKey, SP.link.removeTodo(SP.app.store().getDay(dateKey), todoId));
      ui.closeSheet();
      onDone();
    };

    ui.openSheet({
      title: existing ? "할 일 수정" : "할 일 추가",
      body: [
        ui.el("label", { class: "field" }, [ui.el("span", { text: "과목" }), select]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "할 일" }), input]),
        ui.el("p", { class: "sheet-sub", text: "배정된 시간" }),
        listHost,
      ],
      actions: [
        existing
          ? ui.el("button", { class: "btn btn-danger", text: "삭제", onclick: remove })
          : ui.el("button", { class: "btn btn-ghost", text: "취소", onclick: ui.closeSheet }),
        ui.el("button", { class: "btn btn-primary", text: "저장", onclick: save }),
      ],
    });
    setTimeout(() => input.focus(), 50);
  }

  // 목록의 한 줄은 블록 하나다. 한 할 일을 아침·저녁으로 나눠 잡았으면 두 줄이
  // 되고, 각자 자기 시각 자리에 놓인다. 예전처럼 "2개 배정"으로 뭉치면 언제
  // 하는 일인지 목록만 봐서는 알 수 없다.
  //
  // 아직 시간을 안 잡은 할 일은 비교할 시각이 없으므로 맨 아래로 모은다.
  function rowsOf(day) {
    const rows = [];
    for (const block of day.blocks) {
      const todo = day.todos.find((t) => t.id === block.todoId);
      if (!todo) continue;
      const own = day.blocks.filter((b) => b.todoId === todo.id).sort((a, b) => a.start - b.start);
      rows.push({
        key: block.id, todo, block,
        nth: own.findIndex((b) => b.id === block.id) + 1,
        of: own.length,
      });
    }
    rows.sort((a, b) => a.block.start - b.block.start);
    for (const todo of day.todos) {
      if (!day.blocks.some((b) => b.todoId === todo.id)) {
        rows.push({ key: todo.id, todo, block: null, nth: 1, of: 1 });
      }
    }
    return rows;
  }

  // 길게 눌러 지우는 길은 실수로 눌리기 쉽다. 그래서 한 번 묻는다.
  //
  // 줄이 블록 하나이므로 지우는 것도 그 블록 하나다. 그 할 일의 마지막 블록일
  // 때만 할 일까지 사라진다 - removeBlock 이 이미 그렇게 한다.
  async function confirmRemove(dateKey, row, onChange) {
    const what = row.of > 1
      ? "'" + row.todo.text + "' 의 " + dt.minutesToLabel(row.block.start) + " 시간만 지웁니다."
      : "'" + row.todo.text + "' 을(를) 지웁니다." + (row.block ? "\n타임테이블에서도 사라집니다." : "");
    if (!(await ui.confirmDialog(what))) return;
    const day = SP.app.store().getDay(dateKey);
    SP.app.saveDay(dateKey, row.block
      ? SP.link.removeBlock(day, row.block.id)
      : SP.link.removeTodo(day, row.todo.id));
    onChange();
  }

  function openRow(dateKey, row, onChange) {
    // 줄이 블록이면 그 블록을 연다. 시간이 없는 할 일만 할 일 시트로 간다.
    if (row.block) SP.timetable.openBlockEditor(dateKey, row.block.id, onChange);
    else openEditor(dateKey, row.todo.id, onChange);
  }

  // 체크박스와 순서 열은 제스처에서 뺀다. 체크는 이 화면에서 가장 자주 누르는
  // 곳이라, 손이 잠깐 머무는 것만으로 삭제를 묻는 창이 뜨면 쓰기 어려워진다.
  function inControls(target) {
    return !!target.closest(".todo-check-hit");
  }

  // 짧게 누르면 편집, 길게 누르면 삭제. touch-action 은 건드리지 않는다 — 세로
  // 스크롤을 막을 이유가 없고, 손가락이 움직이면 브라우저가 스크롤을 가져가면서
  // pointercancel 을 보내 타이머가 접힌다.
  function attachRowGestures(node, dateKey, row, onChange) {
    let timer = null;
    let startX = 0;
    let startY = 0;
    let fired = false;
    let moved = false;
    let armed = false;

    const cancel = () => { clearTimeout(timer); timer = null; };

    node.addEventListener("pointerdown", (e) => {
      fired = false;
      moved = false;
      armed = !inControls(e.target);
      if (!armed) return;
      startX = e.clientX;
      startY = e.clientY;
      timer = setTimeout(() => { fired = true; confirmRemove(dateKey, row, onChange); }, LONG_PRESS_MS);
    });
    node.addEventListener("pointermove", (e) => {
      if (moved || !armed) return;
      if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE) {
        moved = true;
        cancel();
      }
    });
    node.addEventListener("pointerup", () => {
      cancel();
      if (!armed || fired || moved) return;
      openRow(dateKey, row, onChange);
    });
    node.addEventListener("pointercancel", cancel);
    node.addEventListener("pointerleave", cancel);
    // 길게 누를 때 뜨는 운영체제의 텍스트 선택 메뉴를 막는다.
    node.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  function toggle(dateKey, row, checked, onChange) {
    const day = SP.app.store().getDay(dateKey);
    SP.app.saveDay(dateKey, row.block
      ? SP.link.setBlockDone(day, row.block.id, checked)
      : SP.link.setTodoDone(day, row.todo.id, checked));
    onChange();
  }

  function rowNode(dateKey, row, subjects, onChange) {
    const done = row.block ? row.block.done : row.todo.done;
    const when = row.block
      ? dt.minutesToLabel(row.block.start) + "~" + dt.minutesToLabel(row.block.end)
      : "미배정";

    const title = ui.el("span", { class: "todo-title", text: row.todo.text });
    // 같은 할 일이 여러 번 나뉘어 있을 때만 회차를 붙인다. 한 번뿐인데 1/1 이
    // 붙으면 읽을 것만 늘어난다.
    const nth = row.of > 1
      ? ui.el("span", { class: "todo-nth", text: row.nth + "/" + row.of })
      : null;

    const node = ui.el("li", { class: "todo-row" + (done ? " todo-done" : "") }, [
      ui.el("span", {
        class: "todo-tag",
        text: subjectsApi.nameOf(subjects, row.todo.subjectId) || "-",
        style: { background: subjectsApi.colorOf(subjects, row.todo.subjectId) },
      }),
      ui.el("button", { class: "todo-text", type: "button",
        // 손가락으로 누르는 건 줄 전체의 제스처가 처리한다(짧게 편집, 길게 삭제).
        // 여기 click 은 키보드로 Enter 를 눌렀을 때만 남는다 — 그때는 detail 이 0 이다.
        onclick: (e) => { if (e.detail === 0) openRow(dateKey, row, onChange); } }, [
        ui.el("span", { class: "todo-head" }, [title, nth]),
        ui.el("span", { class: "todo-when" + (row.block ? "" : " todo-when-none"), text: when }),
      ]),
      // 과목이 없으면 완료를 매기지 않는다. 빈 칸은 남겨 열이 어긋나지 않게 한다.
      storeApi.isStudy(row.todo)
        ? ui.el("label", { class: "todo-check-hit" }, [
            ui.el("input", {
              type: "checkbox", class: "todo-check", "aria-label": "완료", checked: done,
              onchange: (e) => toggle(dateKey, row, e.target.checked, onChange),
            }),
          ])
        : ui.el("div", { class: "todo-check-hit", "aria-hidden": "true" }),
    ]);
    attachRowGestures(node, dateKey, row, onChange);
    return node;
  }

  function render(host, dateKey, onChange) {
    const subjects = SP.app.state().settings.subjects;
    const day = SP.app.store().getDay(dateKey);
    const rows = rowsOf(day);

    ui.clear(host).appendChild(
      // 제목은 탭이 대신한다(타임테이블 쪽과 같은 이유).
      ui.el("section", { class: "card" }, [
        rows.length
          ? ui.el("ul", { class: "todo-list" }, rows.map((r) => rowNode(dateKey, r, subjects, onChange)))
          : ui.el("p", { class: "empty", text: "할 일이 없습니다." }),
        ui.el("button", { class: "btn add-btn", text: "+ 할 일 추가", onclick: () => openEditor(dateKey, null, onChange) }),
      ])
    );
  }

  const api = { render, openEditor, rowsOf };
  SP.todos = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);
