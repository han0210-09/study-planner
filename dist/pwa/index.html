<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4C6EF5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>스터디 플래너</title>
  <style>
:root {
  --bg: #FAFAFB;
  --surface: #FFFFFF;
  --line: #E4E6EB;
  --text: #1F2329;
  --muted: #767C87;
  --accent: #4C6EF5;
  --danger: #E03131;
  --radius: 12px;
  --tt-row: 44px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
body.sheet-open { overflow: hidden; }

.screen { max-width: 560px; margin: 0 auto; padding: 12px 12px calc(24px + var(--safe-b)); }

.banner {
  position: sticky; top: 0; z-index: 40;
  background: #FFF3BF; color: #7A5B00;
  padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #FFE08A;
}

button { font: inherit; color: inherit; }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-ghost { background: transparent; }
.icon-btn {
  min-width: 44px; min-height: 44px; border: 0; background: transparent;
  border-radius: var(--radius); cursor: pointer; font-size: 18px;
}

.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 50; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  max-width: 560px; margin: 0 auto;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  max-height: 86vh; display: flex; flex-direction: column;
  padding-bottom: var(--safe-b);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.sheet-title { margin: 0; font-size: 16px; }
.sheet-body { padding: 16px; overflow-y: auto; }
.sheet-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.sheet-actions .btn { flex: 1; }
.confirm-msg { margin: 0; white-space: pre-line; }

#toast-root { position: fixed; left: 0; right: 0; bottom: calc(24px + var(--safe-b)); z-index: 60; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { background: rgba(31,35,41,.92); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: opacity .3s; }
.toast-out { opacity: 0; }

.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input[type="text"], .field input[type="date"], .field textarea, .field select {
  width: 100%; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); font: inherit;
}
.field textarea { min-height: 88px; resize: vertical; }

/* ---------- 달력 ---------- */
.cal-head { display: grid; grid-template-columns: 44px 1fr 44px auto; align-items: center; gap: 4px; margin-bottom: 8px; }
.cal-title { margin: 0; font-size: 18px; text-align: center; }
/* .btn과 특이도가 같고 뒤에 오므로 이 값이 이긴다. 44px 아래로 내리면 안 된다. */
.cal-today-btn { min-height: 44px; padding: 0 10px; font-size: 13px; }

.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-weekday { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
.cal-sun { color: #E03131; }
.cal-sat { color: #1C7ED6; }

.cal-cell {
  min-height: 74px; padding: 4px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; gap: 2px;
  cursor: pointer; touch-action: pan-y; user-select: none;
}
.cal-cell-out { background: transparent; border: 0; min-height: 74px; cursor: default; }
.cal-today { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.cal-num { font-size: 13px; font-weight: 600; }

.cal-badges { display: flex; flex-direction: column; gap: 1px; min-height: 0; }
.cal-badge { display: flex; align-items: center; gap: 3px; font-size: 10px; line-height: 1.2; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.cal-badge-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-more { font-size: 10px; color: var(--muted); }

.cal-bar { margin-top: auto; height: 4px; background: #EDEFF3; border-radius: 2px; overflow: hidden; }
.cal-bar-fill { height: 100%; background: var(--accent); }
.cal-achieve { font-size: 10px; color: var(--muted); text-align: right; }

.cal-summary { display: flex; justify-content: space-between; margin-top: 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; color: var(--muted); }

.menu { display: flex; flex-direction: column; }
.menu-item { min-height: 48px; text-align: left; padding: 0 4px; border: 0; background: transparent; border-bottom: 1px solid var(--line); cursor: pointer; }
.menu-item:last-child { border-bottom: 0; }

/* ---------- 하루 화면 ---------- */
.day-head { display: grid; grid-template-columns: 44px auto 1fr 44px; align-items: center; gap: 6px; margin-bottom: 10px; }
.day-nav { display: flex; align-items: center; justify-content: center; gap: 2px; }
.day-date { font-size: 15px; font-weight: 600; white-space: nowrap; }
.dday { background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.dday-none { background: #E9ECEF; color: var(--muted); font-weight: 500; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; }
.card-title { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
.empty { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.add-btn { width: 100%; }

.achieve-head { display: flex; justify-content: space-between; align-items: baseline; }
.achieve-value { font-size: 18px; font-weight: 700; }

.event-list { list-style: none; margin: 0; padding: 0; }
.event-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.event-item:last-child { border-bottom: 0; }
.event-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.event-title { flex: 1; font-weight: 600; }
.event-type { font-size: 11px; color: var(--muted); }

.todo-list { list-style: none; margin: 0 0 10px; padding: 0; }
/* 길게 누르면 삭제다. user-select를 끄지 않으면 그동안 iOS가 텍스트를 잡아
   복사 메뉴를 띄운다. touch-action은 pan-y로 둬야 목록을 그대로 스크롤할 수 있다. */
.todo-row {
  display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid var(--line);
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.todo-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
/* 할 일 텍스트를 누르면 편집 시트가 열린다. 주 터치 타깃이므로 44px이어야 한다.
   행은 이미 체크박스(44px) 때문에 56px 이상이라 레이아웃은 바뀌지 않는다. */
.todo-text {
  text-align: left; border: 0; background: transparent; padding: 6px 0; cursor: pointer;
  min-height: 44px; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
}
.todo-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.todo-when { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.todo-when-none { opacity: .6; }
.todo-done .todo-title { text-decoration: line-through; color: var(--muted); }
.todo-order { display: flex; flex-direction: column; }
/* 순서 변경 화살표는 세로로 붙는 보조 컨트롤이다. 각 44x22로 두 개가 44x44를 채운다.
   세로로 각각 44px을 주면 목록 행이 88px이 되어 한 화면에 몇 줄 안 들어간다. */
.icon-btn.tiny { min-width: 44px; min-height: 22px; font-size: 10px; padding: 0; }
.icon-btn.tiny[disabled] { opacity: .25; }
/* 체크박스는 이 앱의 핵심 동작이다. 보이는 상자는 24px이지만 탭 영역은 44px로 넓힌다.
   input에는 가상요소가 안 먹으므로 label로 감싼다. */
.todo-check-hit {
  display: flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; cursor: pointer;
}
.todo-check { width: 24px; height: 24px; }
/* 할 일 시트의 배정된 시간 목록. 0개·1개·여러 개가 같은 모양이다. */
.slot-list { margin-bottom: 4px; }
.slot { display: grid; grid-template-columns: 1fr 44px; align-items: center; border-bottom: 1px solid var(--line); }
.slot-on { background: #F1F3F9; }
.slot-head {
  display: flex; align-items: baseline; gap: 8px;
  min-height: 44px; padding: 0 8px; border: 0; background: transparent;
  cursor: pointer; text-align: left;
}
.slot-range { font-weight: 600; font-variant-numeric: tabular-nums; }
.slot-dur { font-size: 12px; color: var(--muted); }
/* .icon-btn의 44px을 그대로 물려받고 색만 바꾼다. 크기를 다시 쓰면 안 된다. */
.slot-del { color: var(--danger); }
.slot-step { padding: 0 8px; margin: 8px 0; }

.subject-select { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font: inherit; }

.totals-row { display: flex; justify-content: space-between; padding: 3px 0; }
.totals-label { color: var(--muted); font-size: 13px; }
.totals-note { margin: 6px 0 0; font-size: 11px; color: var(--muted); }
.totals-bar { height: 8px; background: #EDEFF3; border-radius: 4px; overflow: hidden; margin-top: 10px; }
.totals-fill { height: 100%; background: var(--accent); }

.memo { width: 100%; min-height: 88px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; resize: vertical; }

/* ---------- 타임테이블 (한 행 = 한 시간, 한 칸 = 5분) ---------- */
.tt-wrap { display: flex; margin-top: 8px; user-select: none; }
.tt-labels { flex: 0 0 34px; }
.tt-label-cell {
  height: var(--tt-row); display: flex; align-items: flex-start; justify-content: flex-end;
  padding: 2px 6px 0 0; font-size: 10px; color: var(--muted); line-height: 1;
}
.tt-cells {
  flex: 1; min-width: 0; display: grid;
  grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: var(--tt-row);
  border-left: 1px solid var(--line); border-bottom: 1px solid var(--line);
  background: var(--surface);
  touch-action: pan-y;
}
/* 눈금은 테두리가 아니라 배경 그라디언트로 그린다. 격자 아이템에 border 를 주면
   box-sizing 때문에 행 높이가 옆의 시각 라벨과 1px 어긋난다. */
.tt-row {
  grid-column: 1 / -1;
  background-image:
    linear-gradient(to bottom, var(--line) 0 1px, transparent 1px),
    repeating-linear-gradient(to right, #E9ECEF 0 1px, transparent 1px 50%),
    repeating-linear-gradient(to right, #F1F3F5 0 1px, transparent 1px calc(100% / 12));
}

.tt-seg {
  display: flex; align-items: stretch; overflow: hidden;
  margin: 2px 0; filter: saturate(.75); box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.tt-seg-first { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
.tt-seg-last { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
.tt-seg-done { filter: saturate(1.35); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.tt-seg-dragging { opacity: .3; }
.merge-btn { width: 100%; min-height: 44px; margin-bottom: 8px; font-size: 13px; color: var(--accent); border-color: var(--accent); }

/* 조각이 한 칸(약 25px)일 수도 있으므로 44px 을 고정폭으로 못 준다. 줄어들게 두고,
   짧은 블록의 완료 처리는 편집 시트의 완료 토글이 맡는다. */
.tt-check {
  flex: 0 1 44px; min-width: 16px; border: 0; background: rgba(255,255,255,.5);
  font-size: 12px; font-weight: 700; cursor: pointer; padding: 0;
}
.tt-seg-done .tt-check { background: rgba(255,255,255,.75); }
.tt-body {
  flex: 1 1 auto; min-width: 0; border: 0; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  padding: 0 4px; overflow: hidden; text-align: left;
}
.tt-label { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tt-time { font-size: 9px; opacity: .65; white-space: nowrap; }

.tt-handle { position: absolute; top: 0; bottom: 0; width: 14px; cursor: ew-resize; touch-action: none; }
.tt-handle-start { left: -3px; }
.tt-handle-end { right: -3px; }

.tt-ghost {
  background: rgba(76,110,245,.25); border: 1.5px dashed var(--accent);
  margin: 2px 0; pointer-events: none; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.tt-ghost-label { font-size: 10px; font-weight: 700; color: var(--accent); background: rgba(255,255,255,.85); padding: 1px 4px; border-radius: 4px; white-space: nowrap; }

.tt-plus {
  align-self: center; justify-self: center;
  width: 26px; height: 26px; padding: 0; line-height: 1;
  border: 1.5px dashed var(--accent); border-radius: 50%;
  background: rgba(76,110,245,.10); color: var(--accent);
  font-size: 15px; font-weight: 700; cursor: pointer;
}

.tt-now-row { grid-column: 1 / -1; position: relative; pointer-events: none; }
.tt-now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--danger); }
.tt-now::before { content: ""; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }

.editor-range { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; margin-bottom: 12px; }
.editor-duration { font-size: 13px; color: var(--muted); }
.stepper { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin-bottom: 10px; }
.stepper-label { font-size: 13px; color: var(--muted); }
/* .btn과 특이도가 같고 뒤에 오므로 이 값이 이긴다(cal-today-btn과 동일 패턴). 44px 아래로 내리면 안 된다. */
.stepper-btn { min-height: 44px; padding: 0 12px; }

/* 짧은 블록은 트랙 위 ✓가 작아 누르기 어렵다. 시트에서도 완료를 바꿀 수 있어야 한다. */
.editor-done { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 14px; cursor: pointer; }
.editor-done input { width: 24px; height: 24px; }

/* ---------- 시트 내부 ---------- */
.sheet-sub { margin: 16px 0 8px; font-size: 13px; color: var(--muted); }
.sheet-sub:first-child { margin-top: 0; }

.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
/* 브리프 원안은 38px였다. 범위/요일/모드 선택 칩은 주 탭 타깃이므로 44px로 올린다. */
.chip { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; cursor: pointer; }
.chip-on { background: var(--accent); border-color: var(--accent); color: #fff; }

.custom-range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.custom-range .field { margin-bottom: 0; }

.wd-row { display: flex; gap: 4px; margin-top: 10px; }
/* label 전체가 탭 영역이다(내부 checkbox를 감쌈). 내용만으로는 44px에 못 미쳐 직접 지정한다. */
.wd-chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; flex: 1; min-height: 44px; }
.wd-chip input { width: 20px; height: 20px; }

.paste-source { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
.paste-preview { margin: 16px 0 0; padding: 10px; background: #F1F3F9; border-radius: var(--radius); font-size: 13px; font-weight: 600; text-align: center; }

.menu-danger { color: var(--danger); }

.subject-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.subject-row { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.subject-row input[type="color"] { width: 44px; height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.subject-row input[type="text"] { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; }

.backup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hidden-file { display: none; }

</style>

<body>
  <div id="banner" class="banner" hidden></div>
  <main id="screen-calendar" class="screen"></main>
  <main id="screen-day" class="screen" hidden></main>
  <div id="sheet-root"></div>
  <div id="toast-root"></div>

  <script>
(function (root) {
  const DAY_START = 300;   // 05:00
  const DAY_END = 1560;    // 익일 02:00
  const SLOT = 5;
  const DAY_BOUNDARY_HOUR = 4;
  const WEEKDAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function snapToSlot(minutes) {
    return Math.round(minutes / SLOT) * SLOT;
  }

  function clampToDay(minutes) {
    return Math.min(DAY_END, Math.max(DAY_START, minutes));
  }

  function minutesToLabel(minutes) {
    const wrapped = ((minutes % 1440) + 1440) % 1440;
    return pad2(Math.floor(wrapped / 60)) + ":" + pad2(wrapped % 60);
  }

  function formatDuration(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h === 0) return m + "분";
    if (m === 0) return h + "시간";
    return h + "시간 " + m + "분";
  }

  function dateKey(date) {
    return (
      date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate())
    );
  }

  function parseDateKey(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  // 모양만 보면 안 된다. "2026-02-30"은 정규식을 통과하지만 파싱하면 3월 2일이 되어
  // 화면에 뜨는 날짜와 D-day 계산이 어긋난다. 왕복시켜 같은 문자열이 나오는지 본다.
  function isValidDateKey(key) {
    if (typeof key !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return false;
    return dateKey(parseDateKey(key)) === key;
  }

  function addDays(key, n) {
    const d = parseDateKey(key);
    d.setDate(d.getDate() + n);
    return dateKey(d);
  }

  function toUTCms(key) {
    const [y, m, d] = key.split("-").map(Number);
    return Date.UTC(y, m - 1, d);
  }

  function daysBetween(fromKey, toKey) {
    return Math.round((toUTCms(toKey) - toUTCms(fromKey)) / 86400000);
  }

  function weekdayOf(key) {
    return parseDateKey(key).getDay();
  }

  function plannerDateKey(now) {
    const shifted = new Date(now.getTime());
    shifted.setHours(shifted.getHours() - DAY_BOUNDARY_HOUR);
    return dateKey(shifted);
  }

  function formatDateKorean(key) {
    const d = parseDateKey(key);
    return (
      d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate() +
      ". (" + WEEKDAY_NAMES[d.getDay()] + ")"
    );
  }

  const datetime = {

    clear(host);
    document.body.classList.remove("sheet-open");
  }

  // 길게 눌러서 연 시트는, 손을 떼는 순간 나오는 click 이 방금 그 자리에 나타난
  // scrim 이나 버튼 위로 떨어진다. 그것만으로 시트가 즉시 닫히거나 버튼이 눌린다.
  // 손가락을 뗀 지점이 어디였는지는 시트가 알 수 없다.
  //
  // 시간으로 막지 않는다 — "연 지 300ms 안의 클릭은 무시" 같은 규칙은 빠르게
  // 두 번 조작하는 사람의 진짜 탭까지 함께 삼킨다. 시트 안에서 시작한 누름만
  // 진짜로 친다.
  function guardStrayClick(node, isPressed, markPressed) {
    node.addEventListener("pointerdown", markPressed, true);
    node.addEventListener("click", (e) => {
      // 키보드로 누른 click 은 detail 이 0 이다. 이 경우 앞선 pointerdown 이 없다.
      if (isPressed() || e.detail === 0) return;
      e.stopImmediatePropagation();
      e.preventDefault();
    }, true);
  }

  function openSheet(options) {
    const host = clear(document.getElementById("sheet-root"));
    const panel = el("div", { class: "sheet", role: "dialog", "aria-modal": "true" }, [
      el("div", { class: "sheet-head" }, [
        el("h2", { class: "sheet-title", text: options.title || "" }),
        el("button", { class: "icon-btn", "aria-label": "닫기", text: "✕", onclick: closeSheet }),
      ]),
      el("div", { class: "sheet-body" }, options.body || []),
      options.actions ? el("div", { class: "sheet-actions" }, options.actions) : null,
    ]);
    const scrim = el("div", { class: "scrim" });

    // 시트마다 새로 만드는 요소에만 건다. sheet-root 에 걸면 시트를 열 때마다
    // 리스너가 쌓인다 - clear() 는 자식만 지우지 리스너를 걷어내지 않는다.
    let pressed = false;
    const mark = () => { pressed = true; };
    guardStrayClick(scrim, () => pressed, mark);
    guardStrayClick(panel, () => pressed, mark);
    scrim.addEventListener("click", closeSheet);

    host.appendChild(scrim);
    host.appendChild(panel);
    document.body.classList.add("sheet-open");
    return panel;
  }

  function toast(message) {
    const host = document.getElementById("toast-root");
    const node = el("div", { class: "toast", text: message });
    host.appendChild(node);
    setTimeout(() => node.classList.add("toast-out"), 2200);
    setTimeout(() => node.remove(), 2600);
  }

  function confirmDialog(message) {
    return new Promise((resolve) => {
      openSheet({
        title: "확인",
        body: [el("p", { class: "confirm-msg", text: message })],
        actions: [
          el("button", { class: "btn btn-ghost", text: "취소", onclick: () => { closeSheet(); resolve(false); } }),
          el("button", { class: "btn btn-danger", text: "실행", onclick: () => { closeSheet(); resolve(true); } }),
        ],
      });
    });
  }

  function showBanner(message) {
    const banner = document.getElementById("banner");
    banner.textContent = message;
    banner.hidden = false;
  }

  const api = { el, clear, openSheet, closeSheet, toast, confirmDialog, showBanner };
  root.SP = root.SP || {};
  root.SP.ui = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const subjectsApi = SP.subjects;
  const eventsApi = SP.events;
  const clip = SP.clipboard;
  const ui = SP.ui;

  function afterMutation(onDone) {
    SP.app.persist();
    ui.closeSheet();
    if (onDone) onDone();
  }

  /* ---------- 일정 ---------- */

  function eventEditor(dateKey, eventId, onDone) {

    const existing = eventId ? state.events.find((e) => e.id === eventId) : null;

    const title = ui.el("input", { type: "text", value: existing ? existing.title : "", placeholder: "예: 국어 수행평가", maxlength: "40" });
    const typeSelect = ui.el("select", { class: "subject-select" },
      eventsApi.EVENT_TYPES.map((t) =>
        ui.el("option", { value: t.id, text: t.label, selected: existing ? existing.type === t.id : t.id === "assessment" }))
    );
    const startInput = ui.el("input", { type: "date", value: existing ? existing.startDate : dateKey });
    const endInput = ui.el("input", { type: "date", value: existing ? existing.endDate : dateKey });
    const memoInput = ui.el("textarea", { placeholder: "메모 (선택)", maxlength: "300" });
    if (existing) memoInput.value = existing.memo;

    function save() {
      const payload = {
        title: title.value, type: typeSelect.value,
        color: eventsApi.typeOf(typeSelect.value).color,
        startDate: startInput.value, endDate: endInput.value, memo: memoInput.value,
      };
      if (!payload.title.trim()) { ui.toast("제목을 입력하세요."); return; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(payload.startDate)) { ui.toast("시작일을 선택하세요."); return; }
      if (existing) eventsApi.updateEvent(state, eventId, payload);
      else eventsApi.addEvent(state, payload);
      afterMutation(onDone);
    }

    ui.openSheet({
      title: existing ? "일정 수정" : "일정 추가",
      body: [
        ui.el("label", { class: "field" }, [ui.el("span", { text: "제목" }), title]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "유형" }), typeSelect]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "시작일" }), startInput]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "종료일 (하루면 시작일과 같게)" }), endInput]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "메모" }), memoInput]),
      ],
      actions: [
        existing
          ? ui.el("button", { class: "btn btn-danger", text: "삭제", onclick: () => {
              eventsApi.removeEvent(state, eventId); afterMutation(onDone);
            } })
          : ui.el("button", { class: "btn btn-ghost", text: "취소", onclick: ui.closeSheet }),
        ui.el("button", { class: "btn btn-primary", text: "저장", onclick: save }),
      ],
    });
  }

  /* ---------- 붙여넣기 ---------- */

  function pasteSheet(baseKey, onDone) {
    const state = SP.app.state();
    if (!state.clipboard) { ui.toast("먼저 계획을 복사하세요."); return; }

    let range = { type: "day" };
    let filter = { type: "all" };
    let mode = "overwrite";

    const customFrom = ui.el("input", { type: "date", value: baseKey });
    const customTo = ui.el("input", { type: "date", value: baseKey });
    const customRow = ui.el("div", { class: "custom-range", hidden: true }, [
      ui.el("label", { class: "field" }, [ui.el("span", { text: "시작" }), customFrom]),
      ui.el("label", { class: "field" }, [ui.el("span", { text: "끝" }), customTo]),
    ]);

    const weekdayBoxes = dt.WEEKDAY_NAMES.map((name, i) =>
      ui.el("label", { class: "wd-chip" }, [
        ui.el("input", { type: "checkbox", value: String(i), checked: true, onchange: update }),
        ui.el("span", { text: name }),
      ])
    );
    const weekdayRow = ui.el("div", { class: "wd-row", hidden: true }, weekdayBoxes);

    const preview = ui.el("p", { class: "paste-preview" });

    function currentRange() {
      if (range.type !== "custom") return range;
      return { type: "custom", from: customFrom.value || baseKey, to: customTo.value || baseKey };
    }

    function currentFilter() {
      if (filter.type !== "custom") return filter;
      const days = weekdayBoxes
        .map((box) => (box.querySelector("input").checked ? Number(box.querySelector("input").value) : -1))
        .filter((n) => n >= 0);
      return { type: "custom", days };
    }

    function targets() {
      return clip.resolveTargetDates(currentRange(), currentFilter(), baseKey);
    }

    function update() {
      customRow.hidden = range.type !== "custom";
      weekdayRow.hidden = filter.type !== "custom";
      preview.textContent = "총 " + targets().length + "일에 적용됩니다.";
    }

    function chipGroup(options, getActive, onPick) {
      const group = ui.el("div", { class: "chip-group" });
      options.forEach((opt) => {
        const chip = ui.el("button", {
          class: "chip", text: opt.label,
          onclick: () => {
            onPick(opt.value);
            [...group.children].forEach((c) => c.classList.remove("chip-on"));
            chip.classList.add("chip-on");
            update();
          },
        });
        if (getActive() === opt.value) chip.classList.add("chip-on");
        group.appendChild(chip);
      });
      return group;
    }

    customFrom.addEventListener("change", update);
    customTo.addEventListener("change", update);

    ui.openSheet({
      title: "붙여넣기",
      body: [
        ui.el("p", { class: "paste-source", text: clip.describeClip(state.clipboard) }),
        ui.el("h3", { class: "sheet-sub", text: "범위" }),
        chipGroup(
          [
            { label: "이 날", value: "day" }, { label: "이번 주", value: "week" },
            { label: "이번 달", value: "month" }, { label: "올해", value: "year" },
            { label: "직접 선택", value: "custom" },
          ],
          () => range.type,
          (v) => { range = { type: v }; }
        ),
        customRow,
        ui.el("h3", { class: "sheet-sub", text: "요일" }),
        chipGroup(
          [
            { label: "전체", value: "all" }, { label: "평일만", value: "weekday" },
            { label: "주말만", value: "weekend" }, { label: "직접 선택", value: "custom" },
          ],
          () => filter.type,
          (v) => { filter = { type: v }; }
        ),
        weekdayRow,
        ui.el("h3", { class: "sheet-sub", text: "기존 계획" }),
        chipGroup(
          [
            { label: "덮어쓰기", value: "overwrite" },
            { label: "겹치지 않는 것만 추가", value: "merge" },
            { label: "계획 있는 날 건너뛰기", value: "skip" },
          ],
          () => mode,
          (v) => { mode = v; }
        ),
        preview,
      ],
      actions: [
        ui.el("button", { class: "btn btn-ghost", text: "취소", onclick: ui.closeSheet }),
        ui.el("button", { class: "btn btn-primary", text: "붙여넣기", onclick: () => {
          const keys = targets();
          if (keys.length === 0) { ui.toast("대상 날짜가 없습니다."); return; }
          const result = clip.paste(state, state.clipboard, keys, mode);
          afterMutation(onDone);
          const parts = [result.applied + "일 적용"];
          if (result.skipped) parts.push(result.skipped + "일 건너뜀");
          if (result.skippedBlocks) parts.push("겹친 블록 " + result.skippedBlocks + "개 제외");
          ui.toast(parts.join(" · "));
        } }),
      ],
    });
    update();
  }

  /* ---------- 하루 메뉴 ---------- */

  function dayMenu(dateKey, onDone) {
    const state = SP.app.state();

    function copyDay() {
      const result = clip.copyDay(state, dateKey);
      if (!result) { ui.toast("복사할 계획이 없습니다."); return; }
      state.clipboard = result;
      SP.app.persist();
      ui.closeSheet();
      ui.toast("이 날 계획을 복사했습니다.");
    }

    function copyWeek() {
      const result = clip.copyWeek(state, dateKey);
      if (!result) { ui.toast("이 주에 복사할 계획이 없습니다."); return; }
      state.clipboard = result;
      SP.app.persist();
      ui.closeSheet();
      ui.toast("이 주 계획을 복사했습니다.");
    }

    async function resetDay() {
      ui.closeSheet();
      const ok = await ui.confirmDialog("이 날의 할 일, 시간 블록, 성취도, 메모를 모두 지웁니다.\n일정은 지워지지 않습니다.");
      if (!ok) return;
      SP.app.store().setDay(dateKey, { todos: [], blocks: [], achievement: 0, memo: "" });
      SP.app.persist();
      if (onDone) onDone();
      ui.toast("초기화했습니다.");
    }

    ui.openSheet({
      title: dt.formatDateKorean(dateKey),
      body: [
        ui.el("p", { class: "paste-source", text: clip.describeClip(state.clipboard) }),
        ui.el("div", { class: "menu" }, [
          ui.el("button", { class: "menu-item", text: "이 날 복사", onclick: copyDay }),
          ui.el("button", { class: "menu-item", text: "이 주 복사", onclick: copyWeek }),
          ui.el("button", { class: "menu-item", text: "여기에 붙여넣기", onclick: () => { ui.closeSheet(); pasteSheet(dateKey, onDone); } }),
          ui.el("button", { class: "menu-item", text: "일정 추가", onclick: () => { ui.closeSheet(); eventEditor(dateKey, null, onDone); } }),
          ui.el("button", { class: "menu-item", text: "설정", onclick: () => { ui.closeSheet(); settings(onDone); } }),
          ui.el("button", { class: "menu-item menu-danger", text: "하루 초기화", onclick: resetDay }),
        ]),
      ],
    });
  }

  /* ---------- 설정 ---------- */

  function settings(onDone) {
    const state = SP.app.state();

    function subjectRow(subject) {
      // 과목을 고치면 시트 아래 화면의 태그 색·이름도 즉시 따라가야 한다.
      // onDone을 부르지 않으면 다른 화면으로 갔다 돌아올 때까지 옛 색이 남는다.
      const nameInput = ui.el("input", { type: "text", value: subject.name, maxlength: "12",
        onchange: (e) => {
          subjectsApi.updateSubject(state, subject.id, { name: e.target.value });
          SP.app.persist();
          if (onDone) onDone();
        } });
      const colorInput = ui.el("input", { type: "color", value: subject.color,
        onchange: (e) => {
          subjectsApi.updateSubject(state, subject.id, { color: e.target.value });
          SP.app.persist();
          if (onDone) onDone();
        } });
      const removeBtn = ui.el("button", { class: "icon-btn", text: "🗑", "aria-label": "삭제", onclick: async () => {
        const count = subjectsApi.countReferences(state, subject.id);
        ui.closeSheet();
        const ok = await ui.confirmDialog(
          "'" + subject.name + "' 과목을 삭제합니다.\n" +
          (count > 0 ? count + "개 항목이 '과목 없음'이 됩니다." : "사용 중인 항목은 없습니다."));
        if (!ok) { settings(onDone); return; }
        if (subjectsApi.removeSubject(state, subject.id) === -1) ui.toast("마지막 과목은 지울 수 없습니다.");
        SP.app.persist();
        if (onDone) onDone();
        settings(onDone);
      } });
      return ui.el("div", { class: "subject-row" }, [colorInput, nameInput, removeBtn]);
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = ui.el("a", { href: url, download: "study-planner-" + SP.app.today() + ".json" });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    const fileInput = ui.el("input", { type: "file", accept: "application/json", class: "hidden-file",
      onchange: (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          let parsed = null;
          try { parsed = JSON.parse(reader.result); }
          catch (_) { ui.toast("JSON 파일을 읽을 수 없습니다."); return; }
          const result = storeApi.sanitizeState(parsed);
          // 파싱은 됐지만 이 앱의 백업 파일이 아니면 통째로 기본값이 된다. 그대로
          // 진행하면 학생이 파일을 잘못 골랐을 때 한 학기 기록이 빈 상태로 덮이고
          // "불러왔습니다"라고 뜬다. 되돌릴 수 없으므로 여기서 막는다.
          const empty = Object.keys(result.state.days).length === 0 && result.state.events.length === 0;
          if (result.recovered || empty) {
            ui.toast("이 앱의 백업 파일이 아닙니다. 불러오지 않았습니다.");
            return;
          }
          ui.closeSheet();
          const ok = await ui.confirmDialog("현재 기기의 계획을 파일 내용으로 완전히 교체합니다.\n되돌릴 수 없습니다.");
          if (!ok) { settings(onDone); return; }
          const target = SP.app.state();
          target.settings = result.state.settings;
          target.days = result.state.days;
          target.events = result.state.events;
          target.clipboard = result.state.clipboard;
          SP.app.persist();
          if (onDone) onDone();
          ui.toast("불러왔습니다.");
        };
        reader.readAsText(file);
      } });

    ui.openSheet({
      title: "설정",
      body: [
        ui.el("h3", { class: "sheet-sub", text: "과목" }),
        ui.el("div", { class: "subject-list" }, state.settings.subjects.map(subjectRow)),
        ui.el("button", { class: "btn add-btn", text: "+ 과목 추가", onclick: () => {
          subjectsApi.addSubject(state, "새 과목", "#DDDDDD");
          SP.app.persist();
          if (onDone) onDone();
          settings(onDone);
        } }),
        ui.el("h3", { class: "sheet-sub", text: "백업" }),
        ui.el("p", { class: "empty", text: "이 기기에만 저장됩니다. 기기를 바꾸기 전에 반드시 내보내세요." }),
        ui.el("div", { class: "backup-row" }, [
          ui.el("button", { class: "btn", text: "JSON 내보내기", onclick: exportJson }),
          ui.el("button", { class: "btn", text: "JSON 불러오기", onclick: () => fileInput.click() }),
        ]),
        fileInput,
      ],
    });
  }

  const api = { dayMenu, eventEditor, pasteSheet, settings };
  SP.sheets = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const subjectsApi = SP.subjects;
  const ui = SP.ui;

  const LONG_PRESS_MS = 450;
  const MOVE_TOLERANCE = 8;

  function whenLabel(own) {
    if (own.length === 0) return "미배정";
    if (own.length === 1) return dt.minutesToLabel(own[0].start) + "~" + dt.minutesToLabel(own[0].end);
    return own.length + "개 배정";
  }

  function openEditor(dateKey, todoId, onDone) {
    const state = SP.app.state();
    const day = SP.app.store().getDay(dateKey);
    const existing = todoId ? day.todos.find((t) => t.id === todoId) : null;

    const select = subjectsApi.buildSelect(state.settings.subjects, existing ? existing.subjectId : null);
    const input = ui.el("input", { type: "text", value: existing ? existing.text : "", placeholder: "할 일을 입력하세요", maxlength: "80" });

    // 배정된 시간을 목록으로 다룬다. 저장 전까지는 여기서만 사는 사본이다.
    const own = SP.link.blocksOfTodo(day, todoId);
    const slots = own.map((b) => ({ id: b.id, start: b.start, end: b.end }));
    let active = slots.length ? 0 : -1;
    let labels = [];

    const listHost = ui.el("div", { class: "slot-list" });

    // 겹침을 볼 때는 다른 할 일의 블록에 더해, 아직 저장 안 된 이 목록의 다른
    // 줄도 함께 봐야 한다. 안 그러면 한 할 일 안에서 시간이 겹친 채 저장된다.
    function others(exceptIndex) {
      const list = day.blocks.filter((b) => b.todoId !== todoId);
      slots.forEach((s, i) => {
        if (i !== exceptIndex) list.push({ id: "slot" + i, start: s.start, end: s.end });
      });
      return list;
    }

    function paint(i) {
      const s = slots[i];
      labels[i].range.textContent = dt.minutesToLabel(s.start) + " ~ " + dt.minutesToLabel(s.end);
      labels[i].dur.textContent = dt.formatDuration(s.end - s.start);
    }

    function nudge(i, which, delta) {
      const s = slots[i];
      const nextStart = which === "start" ? dt.clampToDay(s.start + delta) : s.start;
      const nextEnd = which === "end" ? dt.clampToDay(s.end + delta) : s.end;
      if (nextEnd - nextStart < dt.SLOT) { ui.toast("시간은 최소 5분이어야 합니다."); return; }
      if (storeApi.findOverlap(others(i), { id: "__probe__", start: nextStart, end: nextEnd })) {
        ui.toast("다른 블록과 겹칩니다."); return;
      }
      s.start = nextStart; s.end = nextEnd;
      // 목록 전체를 다시 그리지 않는다. ±5분을 연타하는 동안 버튼이 갈리면
      // 탭이 떨어져 나간다.
      paint(i);
    }

    const stepper = (label, i, which) =>
      ui.el("div", { class: "stepper slot-step" }, [
        ui.el("span", { class: "stepper-label", text: label }),
        ui.el("button", { class: "btn stepper-btn", type: "button", text: "−5분", onclick: () => nudge(i, which, -dt.SLOT) }),
        ui.el("button", { class: "btn stepper-btn", type: "button", text: "+5분", onclick: () => nudge(i, which, dt.SLOT) }),
      ]);

    function addSlot() {
      const found = SP.link.firstFreeSlot(others(-1), 60);
      if (!found) { ui.toast("빈 시간이 없습니다."); return; }
      slots.push({ start: found.start, end: found.end });
      active = slots.length - 1;
      renderSlots();
    }

    function renderSlots() {
      ui.clear(listHost);
      labels = [];
      if (slots.length === 0) {
        listHost.appendChild(ui.el("p", { class: "empty", text: "배정된 시간이 없습니다." }));
      }
      slots.forEach((slot, i) => {
        const range = ui.el("span", { class: "slot-range" });
        const dur = ui.el("span", { class: "slot-dur" });
        labels[i] = { range, dur };
        listHost.appendChild(ui.el("div", { class: "slot" + (i === active ? " slot-on" : "") }, [
          ui.el("button", {
            class: "slot-head", type: "button",
            onclick: () => { active = active === i ? -1 : i; renderSlots(); },
          }, [range, dur]),
          ui.el("button", {
            class: "icon-btn slot-del", type: "button", text: "✕", "aria-label": "이 시간 빼기",
            onclick: () => {
              slots.splice(i, 1);
              if (active >= slots.length) active = slots.length - 1;
              renderSlots();
            },
          }),
        ]));
        paint(i);
        if (i === active) {
          listHost.appendChild(stepper("시작", i, "start"));
          listHost.appendChild(stepper("종료", i, "end"));
        }
      });
      listHost.appendChild(ui.el("button", { class: "btn add-btn", type: "button", text: "+ 시간 추가", onclick: addSlot }));
    }

    renderSlots();

    const save = () => {
      const text = input.value.trim();
      if (!text) { ui.toast("할 일을 입력하세요."); return; }
      const todo = existing
        ? { ...existing, subjectId: select.value || null, text }
        : { id: storeApi.newId(), subjectId: select.value || null, text, done: false };
      SP.app.saveDay(dateKey, SP.link.commitTodo(SP.app.store().getDay(dateKey), todo, slots));
      ui.closeSheet();
      onDone();
    };

    const remove = async () => {
      if (own.length > 0) {
        const ok = await ui.confirmDialog(
          "타임테이블에 배정된 " + own.length + "개 블록도 함께 지워집니다."
        );
        if (!ok) return;
      }
      SP.app.saveDay(dateKey, SP.link.removeTodo(SP.app.store().getDay(dateKey), todoId));
      ui.closeSheet();
      onDone();
    };

    ui.openSheet({
      title: existing ? "할 일 수정" : "할 일 추가",
      body: [
        ui.el("label", { class: "field" }, [ui.el("span", { text: "과목" }), select]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "할 일" }), input]),
        ui.el("p", { class: "sheet-sub", text: "배정된 시간" }),
        listHost,
      ],
      actions: [
        existing
          ? ui.el("button", { class: "btn btn-danger", text: "삭제", onclick: remove })
          : ui.el("button", { class: "btn btn-ghost", text: "취소", onclick: ui.closeSheet }),
        ui.el("button", { class: "btn btn-primary", text: "저장", onclick: save }),
      ],
    });
    setTimeout(() => input.focus(), 50);
  }

  // 길게 눌러 지우는 길은 실수로 눌리기 쉽다. 그래서 배정된 시간이 없어도 한 번
  // 묻는다. 시트에서 삭제 버튼을 누르는 건 이미 의도가 분명하므로 그쪽은 그대로 둔다.
  async function confirmRemove(dateKey, todoId, onChange) {
    const todo = SP.app.store().getDay(dateKey).todos.find((t) => t.id === todoId);
    if (!todo) return;
    const own = SP.link.blocksOfTodo(SP.app.store().getDay(dateKey), todoId);
    const ok = await ui.confirmDialog(
      "'" + todo.text + "' 을(를) 지웁니다." +
      (own.length ? "\n타임테이블에 배정된 " + own.length + "개 블록도 함께 사라집니다." : "")
    );
    if (!ok) return;
    // 묻는 동안 시간이 흘렀다. 그 사이의 편집을 덮어쓰지 않도록 다시 읽는다.
    SP.app.saveDay(dateKey, SP.link.removeTodo(SP.app.store().getDay(dateKey), todoId));
    onChange();
  }

  // 체크박스와 순서 화살표는 제스처에서 뺀다. 체크는 이 화면에서 가장 자주 누르는
  // 곳이라, 손이 잠깐 머무는 것만으로 삭제를 묻는 창이 뜨면 쓰기 어려워진다.
  function inControls(target) {
    return !!target.closest(".todo-check-hit, .todo-order");
  }

  // 짧게 누르면 편집, 길게 누르면 삭제. touch-action 은 건드리지 않는다 — 세로
  // 스크롤을 막을 이유가 없고, 손가락이 움직이면 브라우저가 스크롤을 가져가면서
  // pointercancel 을 보내 타이머가 접힌다.
  function attachRowGestures(node, dateKey, todoId, onChange) {
    let timer = null;
    let startX = 0;
    let startY = 0;
    let fired = false;
    let moved = false;
    let armed = false;

    const cancel = () => { clearTimeout(timer); timer = null; };

    node.addEventListener("pointerdown", (e) => {
      fired = false;
      moved = false;
      armed = !inControls(e.target);
      if (!armed) return;
      startX = e.clientX;
      startY = e.clientY;
      timer = setTimeout(() => { fired = true; confirmRemove(dateKey, todoId, onChange); }, LONG_PRESS_MS);
    });
    node.addEventListener("pointermove", (e) => {
      if (moved || !armed) return;
      if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE) {
        moved = true;
        cancel();
      }
    });
    node.addEventListener("pointerup", () => {
      cancel();
      if (!armed || fired || moved) return;
      openEditor(dateKey, todoId, onChange);
    });
    node.addEventListener("pointercancel", cancel);
    node.addEventListener("pointerleave", cancel);
    // 길게 누를 때 뜨는 운영체제의 텍스트 선택 메뉴를 막는다.
    node.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  function move(dateKey, todoId, delta, onChange) {
    const day = SP.app.store().getDay(dateKey);
    const todos = day.todos.slice();
    const index = todos.findIndex((t) => t.id === todoId);
    const target = index + delta;
    if (index === -1 || target < 0 || target >= todos.length) return;
    [todos[index], todos[target]] = [todos[target], todos[index]];
    SP.app.store().setDay(dateKey, { todos });
    SP.app.persist();
    onChange();
  }

  function render(host, dateKey, onChange) {
    const state = SP.app.state();
    const day = SP.app.store().getDay(dateKey);
    const subjects = state.settings.subjects;

    const rows = day.todos.map((todo, index) => {
      const own = SP.link.blocksOfTodo(day, todo.id);
      const row = ui.el("li", { class: "todo-row" + (todo.done ? " todo-done" : "") }, [
        ui.el("span", {
          class: "todo-tag",
          text: subjectsApi.nameOf(subjects, todo.subjectId) || "-",
          style: { background: subjectsApi.colorOf(subjects, todo.subjectId) },
        }),
        // 배정 시각을 별도 열로 빼면 390px에서 할 일 이름이 눌린다. 이름 아래에
        // 붙이고 버튼 전체를 탭 영역으로 둔다.
        //
        // 손가락으로 누르는 건 행 전체의 제스처가 처리한다(짧게 편집, 길게 삭제).
        // 여기 click 은 키보드로 Enter 를 눌렀을 때만 남는다 — 그때는 detail 이 0 이다.
        ui.el("button", { class: "todo-text", onclick: (e) => { if (e.detail === 0) openEditor(dateKey, todo.id, onChange); } }, [
          ui.el("span", { class: "todo-title", text: todo.text }),
          ui.el("span", { class: "todo-when" + (own.length ? "" : " todo-when-none"), text: whenLabel(own) }),
        ]),
        ui.el("div", { class: "todo-order" }, [
          ui.el("button", { class: "icon-btn tiny", text: "▲", "aria-label": "위로", disabled: index === 0, onclick: () => move(dateKey, todo.id, -1, onChange) }),
          ui.el("button", { class: "icon-btn tiny", text: "▼", "aria-label": "아래로", disabled: index === day.todos.length - 1, onclick: () => move(dateKey, todo.id, 1, onChange) }),
        ]),
        // 과목이 없으면 완료를 매기지 않는다 — 공부 시간에도 달성률에도 안 들어가는
        // 일이라 체크할 대상이 없다. 빈 칸은 남겨둔다. 없애면 그 줄만 순서 화살표가
        // 오른쪽으로 밀려 다른 줄과 열이 어긋난다.
        storeApi.isStudy(todo)
          ? ui.el("label", { class: "todo-check-hit" }, [
              ui.el("input", {
                type: "checkbox", class: "todo-check", "aria-label": "완료", checked: todo.done,
                onchange: (e) => {
                  SP.app.saveDay(dateKey, SP.link.setTodoDone(SP.app.store().getDay(dateKey), todo.id, e.target.checked));
                  onChange();
                },
              }),
            ])
          : ui.el("div", { class: "todo-check-hit", "aria-hidden": "true" }),
      ]);
      attachRowGestures(row, dateKey, todo.id, onChange);
      return row;
    });

    ui.clear(host).appendChild(
      ui.el("section", { class: "card" }, [
        ui.el("h2", { class: "card-title", text: "To-Do List" }),
        day.todos.length
          ? ui.el("ul", { class: "todo-list" }, rows)
          : ui.el("p", { class: "empty", text: "할 일이 없습니다. 아래 버튼으로 추가하세요." }),
        // 길게 누르는 동작은 눈에 보이지 않는다. 안내가 없으면 아무도 못 찾는다.
        day.todos.length
          ? ui.el("p", { class: "empty", text: "할 일을 길게 누르면 지웁니다. 배정된 시간도 함께 사라집니다." })
          : null,
        ui.el("button", { class: "btn add-btn", text: "+ 할 일 추가", onclick: () => openEditor(dateKey, null, onChange) }),
      ])
    );
  }

  const api = { render, openEditor };
  SP.todos = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>
  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const subjectsApi = SP.subjects;
  const grid = SP.grid;
  const ui = SP.ui;

  // 드래그는 가로로 8px 넘게 끌 때만 시작한다.
  //
  // "길게 누르면 방향 무관"도 넣어봤지만 실제 터치에서는 동작하지 않는다.
  // .tt-cells 의 touch-action: pan-y 를 브라우저는 터치가 시작될 때 한 번만 보고,
  // 세로 팬을 컴포지터에서 바로 처리한다. 길게 누른 뒤 none 으로 바꿔도 이미 늦다.
  // 마우스에는 touch-action 이 적용되지 않아 CDP 로 진짜 터치를 보내기 전까지
  // 이 사실이 드러나지 않았다.
  //
  // 격자를 touch-action: none 으로 두고 세로 스크롤을 직접 굴리면 되게 만들 수는
  // 있지만, 관성과 플릭이 사라져 주 화면 스크롤이 확연히 나빠진다. 그 값을 치를
  // 만한 기능이 아니다.
  //
  // 실제 터치에서는 이 8px 이 최종 관문이 아니다. 브라우저가 자기 슬롭을 넘길
  // 때까지 방향 판정을 보류하다가 애매하면 세로 팬으로 가져가므로, 손가락이
  // 확실히 옆으로 가야(수십 px) 제스처가 우리에게 넘어온다. 그래도 시작 시각은
  // 안 밀린다 — anchor 는 pointerdown 시점에 고정되고 이후 이동은 끝점만 움직인다.
  const MOVE_TOLERANCE = 8;

  // .tt-cells 의 사각형이 곧 데이터 영역이다. 시각 라벨을 같은 격자에 넣지 않고
  // 옆에 따로 둔 이유가 이것 — 라벨 폭을 빼는 보정이 필요 없어진다.
  function pointToMinutes(clientX, clientY, cellsEl) {
    const r = cellsEl.getBoundingClientRect();
    const col = Math.min(grid.COLS - 1, Math.max(0, Math.floor(((clientX - r.left) / r.width) * grid.COLS)));
    const row = Math.min(grid.ROWS - 1, Math.max(0, Math.floor(((clientY - r.top) / r.height) * grid.ROWS)));
    return dt.DAY_START + row * 60 + col * dt.SLOT;
  }

  function segStyle(seg) {
    return { gridRow: String(seg.row + 1), gridColumn: (seg.col + 1) + " / span " + seg.span };
  }

  function blocksOf(dateKey) {
    return SP.app.store().getDay(dateKey).blocks;
  }

  function saveBlocks(dateKey, blocks) {
    SP.app.store().setDay(dateKey, { blocks: blocks.slice().sort((a, b) => a.start - b.start) });
    SP.app.persist();
  }

  function openBlockEditor(dateKey, blockId, onChange, isNew) {
    const state = SP.app.state();
    const day = SP.app.store().getDay(dateKey);
    const blocks = day.blocks;
    const block = blocks.find((b) => b.id === blockId);
    if (!block) return;

    let start = block.start;
    let end = block.end;

    const rangeLabel = ui.el("strong", { text: dt.minutesToLabel(start) + " ~ " + dt.minutesToLabel(end) });
    const durationLabel = ui.el("span", { class: "editor-duration", text: dt.formatDuration(end - start) });

    function redraw() {
      rangeLabel.textContent = dt.minutesToLabel(start) + " ~ " + dt.minutesToLabel(end);
      durationLabel.textContent = dt.formatDuration(end - start);
    }

    function nudge(which, delta) {
      const next = { ...block, start, end };
      if (which === "start") next.start = dt.clampToDay(start + delta);
      else next.end = dt.clampToDay(end + delta);
      if (next.end - next.start < dt.SLOT) { ui.toast("블록은 최소 5분이어야 합니다."); return; }
      if (storeApi.findOverlap(blocks, next, blockId)) { ui.toast("다른 블록과 겹칩니다."); return; }
      start = next.start; end = next.end;
      redraw();
    }

    const stepper = (label, which) =>
      ui.el("div", { class: "stepper" }, [
        ui.el("span", { class: "stepper-label", text: label }),
        ui.el("button", { class: "btn stepper-btn", text: "−5분", onclick: () => nudge(which, -dt.SLOT) }),
        ui.el("button", { class: "btn stepper-btn", text: "+5분", onclick: () => nudge(which, dt.SLOT) }),
      ]);

    const select = subjectsApi.buildSelect(state.settings.subjects, block.subjectId);
    const textInput = ui.el("input", { type: "text", value: block.text, placeholder: "무엇을 공부하나요?", maxlength: "40" });
    // 조각이 한 칸(약 25px)일 수도 있어 트랙 위의 ✓ 를 손가락으로 정확히 누르기는
    // 어렵다. 편집 시트에서도 완료를 바꿀 수 있어야 한다.
    const doneInput = ui.el("input", { type: "checkbox", checked: block.done });

    // 새 블록은 할 일을 함께 만드는 게 기본이다. 이미 있는 블록은 지금 상태가 기본.
    const initialChoice = block.todoId || (isNew ? "new" : "none");
    const todoSelect = ui.el("select", { class: "subject-select" }, [
      ui.el("option", { value: "new", text: "＋ 새 할 일로 추가", selected: initialChoice === "new" }),
      ...day.todos.map((t) =>
        ui.el("option", { value: t.id, text: t.text, selected: initialChoice === t.id })),
      ui.el("option", { value: "none", text: "할 일과 연결 안 함", selected: initialChoice === "none" }),
    ]);
    // 기존 할 일을 고르면 과목·내용을 그 할 일 값으로 맞춘다. 저장할 때는 화면에
    // 보이는 값이 양쪽에 쓰이므로, 고른 순간 보여줘야 무엇이 저장될지 알 수 있다.
    todoSelect.addEventListener("change", () => {
      const picked = day.todos.find((t) => t.id === todoSelect.value);
      if (!picked) return;
      textInput.value = picked.text;
      select.value = picked.subjectId || "";
    });

    ui.openSheet({
      title: "시간 블록",
      body: [
        ui.el("div", { class: "editor-range" }, [rangeLabel, durationLabel]),
        stepper("시작", "start"),
        stepper("종료", "end"),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "과목" }), select]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "내용" }), textInput]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "할 일" }), todoSelect]),
        ui.el("label", { class: "editor-done" }, [doneInput, ui.el("span", { text: "이 시간 공부 완료" })]),
      ],
      actions: [
        ui.el("button", { class: "btn btn-danger", text: "삭제", onclick: () => {
          // 연결된 할 일도 함께 사라진다(그 할 일의 마지막 블록일 때만).
          SP.app.saveDay(dateKey, SP.link.removeBlock(SP.app.store().getDay(dateKey), blockId));
          ui.closeSheet(); onChange();
        } }),
        ui.el("button", { class: "btn btn-primary", text: "저장", onclick: () => {
          const next = { ...block, start, end, subjectId: select.value || null,
            text: textInput.value.trim(), done: doneInput.checked };
          const check = storeApi.validateBlock(next);
          if (!check.ok) { ui.toast(check.error); return; }
          if (storeApi.findOverlap(blocks, next, blockId)) { ui.toast("다른 블록과 겹칩니다."); return; }
          // 빈 할 일이 생기지 않게 하되 새 검증 규칙은 만들지 않는다.
          const todoText = next.text || subjectsApi.nameOf(state.settings.subjects, next.subjectId) || "이름 없음";
          SP.app.saveDay(dateKey,
            SP.link.commitBlock(SP.app.store().getDay(dateKey), next, todoSelect.value, todoText));
          ui.closeSheet(); onChange();
        } }),
      ],
    });
  }

  // 새로 만든 블록의 편집 시트를 취소로 닫으면 그 빈 블록을 되돌린다.
  function openBlockEditorOrRollback(dateKey, blockId, onChange) {
    const before = blocksOf(dateKey).find((b) => b.id === blockId);
    let committed = false;
    openBlockEditor(dateKey, blockId, () => { committed = true; onChange(); }, true);
    const host = document.getElementById("sheet-root");
    const observer = new MutationObserver(() => {
      if (host.childElementCount === 0) {
        observer.disconnect();
        if (!committed && before && !before.text && !before.subjectId) {
          saveBlocks(dateKey, blocksOf(dateKey).filter((b) => b.id !== blockId));
          onChange();
        }
      }
    });
    observer.observe(host, { childList: true });
  }

  function toggleDone(dateKey, block, onChange) {
    SP.app.saveDay(dateKey, SP.link.setBlockDone(SP.app.store().getDay(dateKey), block.id, !block.done));
    onChange();
  }

  function createBlock(dateKey, start, end, onChange) {
    const candidate = { id: storeApi.newId(), subjectId: null, text: "", start, end, done: false, todoId: null };
    const check = storeApi.validateBlock(candidate);
    if (!check.ok) { ui.toast(check.error); return; }
    if (storeApi.findOverlap(blocksOf(dateKey), candidate)) { ui.toast("다른 블록과 겹칩니다."); return; }
    saveBlocks(dateKey, blocksOf(dateKey).concat([candidate]));
    onChange();
    openBlockEditorOrRollback(dateKey, candidate.id, onChange);
  }

  function drawGhost(cells, nodes, start, end) {
    for (const n of nodes) n.remove();
    nodes.length = 0;
    const segs = grid.segmentsOf(start, end);
    for (const seg of segs) {
      const node = ui.el("div", { class: "tt-ghost", style: segStyle(seg) });
      nodes.push(node);
      cells.appendChild(node);
    }
    const w = grid.widestIndex(segs);
    if (nodes[w]) {
      nodes[w].appendChild(ui.el("span", {
        class: "tt-ghost-label", text: dt.minutesToLabel(start) + " ~ " + dt.minutesToLabel(end),
      }));
    }
  }

  function attachCreateDrag(cells, dateKey, onChange) {
    let active = false;
    let decided = false;
    let anchor = 0;
    let startX = 0;
    let startY = 0;
    let pointerId = null;
    let tapPlus = null;
    const ghost = [];

    function cleanup() {
      for (const n of ghost) n.remove();
      ghost.length = 0;
      if (active && pointerId != null && cells.hasPointerCapture(pointerId)) {
        cells.releasePointerCapture(pointerId);
      }
      // 드래그 중에만 스크롤을 막는다. 평소에는 세로 스크롤이 되어야 한다.
      cells.style.touchAction = "";
      active = false; decided = false; pointerId = null; tapPlus = null;
    }

    function begin() {
      active = true; decided = true;
      cells.style.touchAction = "none";
      cells.setPointerCapture(pointerId);
    }

    function rangeAt(cursorMin) {
      const args = grid.selectionArgs(anchor, cursorMin);
      const limited = storeApi.limitRange(blocksOf(dateKey), args.anchor, args.cursor);
      return { start: limited.start, end: Math.max(limited.start + dt.SLOT, limited.end) };
    }

    cells.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".tt-seg")) return;
      pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      anchor = pointToMinutes(e.clientX, e.clientY, cells);
      decided = false;
      // ⊕ 위에서 눌렀어도 드래그를 막지 않는다. 그 칸만 드래그 사각지대가 되면
      // 안 되기 때문이다. 탭이었는지 드래그였는지는 손을 뗄 때 가른다.
      tapPlus = e.target.closest(".tt-plus");
    });

    cells.addEventListener("pointermove", (e) => {
      if (!active) {
        if (decided || pointerId === null) return;
        const dx = Math.abs(e.clientX - startX);
        const dy = Math.abs(e.clientY - startY);
        if (dx <= MOVE_TOLERANCE && dy <= MOVE_TOLERANCE) return;
        // 대각선으로 끌 때는 더 많이 움직인 축이 이긴다. 가로면 선택, 세로면
        // 페이지 스크롤에 넘긴다. 한 번 정하면 번복하지 않는다.
        decided = true;
        if (dx <= dy) return;
        begin();
      }
      e.preventDefault();
      const r = rangeAt(pointToMinutes(e.clientX, e.clientY, cells));
      drawGhost(cells, ghost, r.start, r.end);
    });

    function finish(e) {
      // 드래그가 성립하지 않은 제스처는 탭이다. ⊕ 를 여기서 처리해야 드래그와
      // 탭을 시간창이 아니라 같은 제스처 안의 인과로 가를 수 있다. 시간으로
      // 가르면 직전 드래그 직후의 관계없는 탭까지 삼킨다.
      if (!active) {
        const plus = decided ? null : tapPlus;
        decided = false; tapPlus = null; pointerId = null;
        if (plus) createBlock(dateKey, Number(plus.dataset.start), Number(plus.dataset.end), onChange);
        return;
      }
      const r = rangeAt(pointToMinutes(e.clientX, e.clientY, cells));
      let start = r.start;
      let end = r.end;
      if (end > dt.DAY_END) { end = dt.DAY_END; start = Math.min(start, end - dt.SLOT); }
      cleanup();
      createBlock(dateKey, start, end, onChange);
    }

    cells.addEventListener("pointerup", finish);
    cells.addEventListener("pointercancel", cleanup);
  }

  // 끄는 동안 조각을 직접 재배치하지 않는다. 조각이 여러 개면 고스트 한 벌을
  // 다시 그리는 쪽이 단순하고, 생성 드래그와 미리보기 경로가 하나로 합쳐진다.
  function attachResize(handle, dateKey, blockId, edge, onChange) {
    handle.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      const cells = handle.closest(".tt-cells");
      const block = blocksOf(dateKey).find((b) => b.id === blockId);
      if (!cells || !block) return;

      handle.setPointerCapture(e.pointerId);
      cells.style.touchAction = "none";
      const owned = [].slice.call(cells.querySelectorAll('.tt-seg[data-id="' + blockId + '"]'));
      for (const n of owned) n.classList.add("tt-seg-dragging");

      const ghost = [];
      let next = null;
      let moved = false;

      function onMove(ev) {
        ev.preventDefault();
        moved = true;
        const cursor = pointToMinutes(ev.clientX, ev.clientY, cells);
        // 고정된 쪽 모서리가 anchor 다. 끝을 끌 때만 커서 칸을 포함시킨다.
        const anchor = edge === "start" ? block.end : block.start;
        const c = edge === "start" ? cursor : cursor + dt.SLOT;
        const limited = storeApi.limitRange(blocksOf(dateKey), anchor, c, blockId);
        const start = Math.min(limited.start, limited.end);
        const end = Math.max(limited.start, limited.end);
        if (end - start < dt.SLOT) return;
        next = { start, end };
        drawGhost(cells, ghost, start, end);
      }

      function onUp() {
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
        handle.removeEventListener("pointercancel", onUp);
        for (const n of ghost) n.remove();
        // 흐리게 한 것은 여기서 되돌린다. 아래 분기 중 하나는 다시 그리지 않고
        // 빠져나가므로, onChange 에 맡기면 블록이 흐린 채로 남는다.
        for (const n of owned) n.classList.remove("tt-seg-dragging");
        cells.style.touchAction = "";
        // 손잡이를 그냥 톡 누른 것도 블록을 누른 것이다. 좁은 조각에서는 손잡이가
        // 조각 폭의 대부분을 덮으므로, 여기서 안 받으면 그 블록을 열 방법이 없다.
        if (!moved) { openBlockEditor(dateKey, blockId, onChange); return; }
        if (!next || (next.start === block.start && next.end === block.end)) { onChange(); return; }
        const updated = { ...block, start: next.start, end: next.end };
        if (!storeApi.validateBlock(updated).ok || storeApi.findOverlap(blocksOf(dateKey), updated, blockId)) {
          ui.toast("여기에는 놓을 수 없습니다."); onChange(); return;
        }
        saveBlocks(dateKey, blocksOf(dateKey).map((b) => (b.id === blockId ? updated : b)));
        onChange();
      }

      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
      handle.addEventListener("pointercancel", onUp);
    });
  }

  // 블록을 잡아 옮긴다. 길이는 그대로 두고 시작 시각만 바꾼다.
  //
  // 진입 조건은 빈 칸 드래그와 같다 — 가로로 끌면 시작하고, 세로로 끌면 페이지
  // 스크롤에 넘긴다. 끌지 않고 떼면 탭이므로 편집 시트를 연다. 드래그와 탭을
  // 시간창이 아니라 같은 제스처 안에서 가른다.
  //
  // 포인터 캡처는 조각(node)에 건다. 조상인 .tt-cells 에 걸면 이벤트가 그쪽으로
  // 재타깃되어 자손인 조각에는 오지 않는다.
  function attachMove(node, dateKey, block, onChange) {
    let active = false;
    let decided = false;
    let startX = 0;
    let startY = 0;
    let offset = 0;
    let pointerId = null;
    let cells = null;
    let placed = null;
    let tapCheck = false;
    const ghost = [];
    const duration = block.end - block.start;

    function owned() {
      return [].slice.call(cells.querySelectorAll('.tt-seg[data-id="' + block.id + '"]'));
    }

    function cleanup() {
      for (const n of ghost) n.remove();
      ghost.length = 0;
      if (cells) {
        for (const n of owned()) n.classList.remove("tt-seg-dragging");
        cells.style.touchAction = "";
      }
      if (active && pointerId != null && node.hasPointerCapture(pointerId)) {
        node.releasePointerCapture(pointerId);
      }
      active = false; decided = false; pointerId = null; placed = null;
    }

    function begin() {
      active = true; decided = true;
      cells.style.touchAction = "none";
      node.setPointerCapture(pointerId);
      for (const n of owned()) n.classList.add("tt-seg-dragging");
    }

    function moveTo(cursorMin) {
      const start = Math.max(dt.DAY_START, Math.min(cursorMin - offset, dt.DAY_END - duration));
      const candidate = { id: block.id, start, end: start + duration };
      // 겹치면 옮기지 않는다. 마지막으로 유효했던 자리를 그대로 둔다.
      if (storeApi.findOverlap(blocksOf(dateKey), candidate, block.id)) return;
      placed = candidate;
      drawGhost(cells, ghost, candidate.start, candidate.end);
    }

    node.addEventListener("pointerdown", (e) => {
      // 손잡이만 뺀다. ✓ 위에서 눌러도 끌 수 있어야 블록 전체가 잡히는 느낌이 난다.
      // 끌었는지 톡 눌렀는지는 손을 뗄 때 가른다.
      if (e.target.closest(".tt-handle")) return;
      cells = node.closest(".tt-cells");
      if (!cells) return;
      pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      offset = pointToMinutes(e.clientX, e.clientY, cells) - block.start;
      decided = false; placed = null;
      tapCheck = !!e.target.closest(".tt-check");
    });

    node.addEventListener("pointermove", (e) => {
      if (!active) {
        if (decided || pointerId === null) return;
        const dx = Math.abs(e.clientX - startX);
        const dy = Math.abs(e.clientY - startY);
        if (dx <= MOVE_TOLERANCE && dy <= MOVE_TOLERANCE) return;
        decided = true;
        if (dx <= dy) return;
        begin();
      }
      e.preventDefault();
      moveTo(pointToMinutes(e.clientX, e.clientY, cells));
    });

    node.addEventListener("pointerup", () => {
      if (!active) {
        // 허용치를 넘긴 적이 없으면 탭이다. 세로로 끌어 스크롤한 경우는
        // decided 가 서 있으므로 아무것도 열지 않는다.
        const tap = !decided && pointerId !== null;
        const onCheck = tapCheck;
        decided = false; pointerId = null; tapCheck = false;
        if (!tap) return;
        if (onCheck) toggleDone(dateKey, block, onChange);
        else openBlockEditor(dateKey, block.id, onChange);
        return;
      }
      const next = placed;
      cleanup();
      if (!next || next.start === block.start) { onChange(); return; }
      saveBlocks(dateKey, blocksOf(dateKey).map((b) =>
        (b.id === block.id ? { ...b, start: next.start, end: next.end } : b)));
      onChange();
    });

    node.addEventListener("pointercancel", cleanup);
  }

  function blockSegments(dateKey, block, subjects, onChange) {
    const color = subjectsApi.colorOf(subjects, block.subjectId);
    const label = [subjectsApi.nameOf(subjects, block.subjectId), block.text].filter(Boolean).join(" · ") || "이름 없음";
    const segs = grid.segmentsOf(block.start, block.end);
    const last = segs.length - 1;

    return segs.map((seg, i) => {
      const parts = [];
      // ✓ 와 이름은 블록이 시작하는 조각에 붙인다. 가장 넓은 조각에 붙이면
      // 05:25~12:35 같은 블록에서 ✓ 가 06시 행으로 내려가, 정작 블록이 시작하는
      // 줄에는 아무 표시가 없다.
      if (i === 0) {
        // 과목이 없으면 완료를 매기지 않는다. 공부 시간에도 달성률에도 안 들어가는
        // 시간이라 체크할 대상이 없다. 자리도 비워둔다 — 안 눌리는 ✓ 를 두면
        // 고장난 것처럼 보인다.
        //
        // 포인터로 누른 click 은 무시한다. 그 경로는 attachMove 가 같은 제스처
        // 안에서 처리한다. e.detail === 0 은 키보드(Enter/Space)라는 뜻이다.
        if (storeApi.isStudy(block)) {
          parts.push(ui.el("button", {
            class: "tt-check", type: "button", "aria-label": "완료 토글", text: block.done ? "✓" : "",
            onclick: (e) => { if (e.detail === 0) toggleDone(dateKey, block, onChange); },
          }));
        }
        parts.push(ui.el("button", {
          class: "tt-body", type: "button",
          onclick: (e) => { if (e.detail === 0) openBlockEditor(dateKey, block.id, onChange); },
        }, [
          ui.el("span", { class: "tt-label", text: label }),
          ui.el("span", { class: "tt-time", text: dt.minutesToLabel(block.start) + "~" + dt.minutesToLabel(block.end) }),
        ]));
        parts.push(ui.el("div", { class: "tt-handle tt-handle-start", "aria-hidden": "true" }));
      }
      if (i === last) parts.push(ui.el("div", { class: "tt-handle tt-handle-end", "aria-hidden": "true" }));

      // position 은 인라인으로 준다. .tt-handle 이 absolute 라 기준 상자가 필요하다.
      const node = ui.el("div", {
        class: "tt-seg" + (block.done ? " tt-seg-done" : "") +
          (i === 0 ? " tt-seg-first" : "") + (i === last ? " tt-seg-last" : ""),
        dataset: { id: block.id },
        style: Object.assign(segStyle(seg), { background: color, position: "relative" }),
      }, parts);

      const startHandle = node.querySelector(".tt-handle-start");
      const endHandle = node.querySelector(".tt-handle-end");
      if (startHandle) attachResize(startHandle, dateKey, block.id, "start", onChange);
      if (endHandle) attachResize(endHandle, dateKey, block.id, "end", onChange);
      attachMove(node, dateKey, block, onChange);
      return node;
    });
  }

  // 블록이 끝나는 지점이 곧 틈의 첫 칸이다. ⊕ 를 블록 위가 아니라 틈의 첫 칸에
  // 놓아야 읽는 순서대로 "여기부터 이어서"가 된다.
  function plusNodes(dateKey, blocks, onChange) {
    const nodes = [];
    for (const block of blocks) {
      const slot = grid.plusSlotFor(blocks, block);
      if (!slot) continue;
      const rc = grid.rowColOf(slot.start);
      nodes.push(ui.el("button", {
        class: "tt-plus", type: "button", text: "+",
        "aria-label": dt.minutesToLabel(slot.start) + "부터 이어서 만들기",
        dataset: { start: String(slot.start), end: String(slot.end) },
        style: { gridRow: String(rc.row + 1), gridColumn: String(rc.col + 1) },
        // 포인터로 누른 click 은 무시한다. 그 경로는 attachCreateDrag 의 finish 가
        // 같은 제스처 안에서 처리한다. e.detail === 0 은 키보드(Enter/Space)로
        // 눌렀다는 뜻이고, 그때는 pointer 이벤트가 없으므로 여기서 처리해야 한다.
        onclick: (e) => {
          if (e.detail !== 0) return;
          createBlock(dateKey, slot.start, slot.end, onChange);
        },
      }));
    }
    return nodes;
  }

  function nowMarker(dateKey) {
    if (dateKey !== SP.app.today()) return null;
    const now = new Date();
    let minutes = now.getHours() * 60 + now.getMinutes();
    if (now.getHours() < dt.DAY_BOUNDARY_HOUR) minutes += 1440;
    if (minutes < dt.DAY_START || minutes >= dt.DAY_END) return null;
    const rc = grid.rowColOf(minutes);
    return ui.el("div", { class: "tt-now-row", style: { gridRow: String(rc.row + 1) } }, [
      ui.el("div", { class: "tt-now", style: { left: ((minutes - dt.DAY_START) % 60) / 60 * 100 + "%" } }),
    ]);
  }

  function render(host, dateKey, onChange) {
    const subjects = SP.app.state().settings.subjects;
    const blocks = blocksOf(dateKey);

    const labels = [];
    for (let r = 0; r < grid.ROWS; r++) {
      labels.push(ui.el("div", { class: "tt-label-cell", text: dt.minutesToLabel(dt.DAY_START + r * 60) }));
    }

    const cells = ui.el("div", { class: "tt-cells" });
    for (let r = 0; r < grid.ROWS; r++) {
      cells.appendChild(ui.el("div", { class: "tt-row", style: { gridRow: String(r + 1) } }));
    }
    for (const b of blocks) {
      for (const node of blockSegments(dateKey, b, subjects, onChange)) cells.appendChild(node);
    }
    for (const node of plusNodes(dateKey, blocks, onChange)) cells.appendChild(node);
    const marker = nowMarker(dateKey);
    if (marker) cells.appendChild(marker);

    attachCreateDrag(cells, dateKey, onChange);

    // 합치기는 자동으로 하지 않는다. ⊕ 로 이어 만든 블록이 앞 블록에 흡수되면
    // 나눠 잡은 의도가 사라진다. 합칠 게 있을 때만 버튼을 보여준다.
    const preview = SP.link.mergeAdjacent(SP.app.store().getDay(dateKey));
    const mergeBtn = preview.merged > 0
      ? ui.el("button", {
          class: "btn merge-btn", type: "button",
          text: "같은 내용 합치기 · " + preview.merged + "곳",
          onclick: () => {
            SP.app.saveDay(dateKey, SP.link.mergeAdjacent(SP.app.store().getDay(dateKey)));
            ui.toast(preview.merged + "곳을 합쳤습니다.");
            onChange();
          },
        })
      : null;

    ui.clear(host).appendChild(
      ui.el("section", { class: "card" }, [
        ui.el("h2", { class: "card-title", text: "Timetable" }),
        mergeBtn,
        ui.el("div", { class: "tt-wrap" }, [ui.el("div", { class: "tt-labels" }, labels), cells]),
      ])
    );
  }

  const api = { render, pointToMinutes, openBlockEditor };
  SP.timetable = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>
  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const eventsApi = SP.events;
  const ui = SP.ui;

  let currentHost = null;
  let currentKey = null;

  function ddayChip(dateKey) {
    const state = SP.app.state();
    const result = eventsApi.dday(state.events, dateKey);
    if (!result) return ui.el("span", { class: "dday dday-none", text: "일정 없음" });
    return ui.el("span", { class: "dday", title: result.event.title, text: eventsApi.formatDday(result.days) });
  }

  function header(dateKey) {
    const view = SP.app.viewDate();
    return ui.el("header", { class: "day-head" }, [
      ui.el("button", { class: "icon-btn", text: "←", "aria-label": "달력으로", onclick: () => SP.app.showCalendar(view.year, view.month) }),
      ddayChip(dateKey),
      ui.el("div", { class: "day-nav" }, [
        ui.el("button", { class: "icon-btn", text: "‹", "aria-label": "전날", onclick: () => SP.app.showDay(dt.addDays(dateKey, -1)) }),
        ui.el("span", { class: "day-date", text: dt.formatDateKorean(dateKey) }),
        ui.el("button", { class: "icon-btn", text: "›", "aria-label": "다음날", onclick: () => SP.app.showDay(dt.addDays(dateKey, 1)) }),
      ]),
      ui.el("button", { class: "icon-btn", text: "⋯", "aria-label": "메뉴", onclick: () => SP.day.openMenu(dateKey) }),
    ]);
  }

  // 달성률은 손으로 매기지 않는다. 계획한 시간 중 실제로 끝낸 비율이므로
  // 블록의 완료 체크에서 그대로 나온다.
  function rateCard(dateKey) {
    const day = SP.app.store().getDay(dateKey);
    const ratio = storeApi.doneRatio(day.blocks);
    return ui.el("section", { class: "card" }, [
      ui.el("div", { class: "achieve-head" }, [
        ui.el("h2", { class: "card-title", text: "달성률" }),
        ui.el("span", { class: "achieve-value", text: ratio + "%" }),
      ]),
      ui.el("div", { class: "totals-bar" }, [
        ui.el("div", { class: "totals-fill", style: { width: ratio + "%" } }),
      ]),
    ]);
  }

  function eventsCard(dateKey) {
    const list = eventsApi.onDate(SP.app.state().events, dateKey);
    if (list.length === 0) return null;
    return ui.el("section", { class: "card" }, [
      ui.el("h2", { class: "card-title", text: "오늘의 일정" }),
      ui.el("ul", { class: "event-list" }, list.map((e) =>
        ui.el("li", { class: "event-item", onclick: () => SP.day.openEventEditor(dateKey, e.id) }, [
          ui.el("span", { class: "event-dot", style: { background: e.color } }),
          ui.el("span", { class: "event-title", text: e.title }),
          ui.el("span", { class: "event-type", text: eventsApi.typeOf(e.type).label }),
        ])
      )),
    ]);
  }

  // 달성률은 맨 위 카드가 맡는다. 여기서는 시간만 보여준다.
  function totalsCard(dateKey) {
    const day = SP.app.store().getDay(dateKey);
    const uncounted = storeApi.sumUncounted(day.blocks);
    return ui.el("section", { class: "card totals" }, [
      ui.el("div", { class: "totals-row" }, [
        ui.el("span", { class: "totals-label", text: "목표시간" }),
        ui.el("strong", { text: dt.formatDuration(storeApi.sumPlanned(day.blocks)) }),
      ]),
      ui.el("div", { class: "totals-row" }, [
        ui.el("span", { class: "totals-label", text: "실제시간" }),
        ui.el("strong", { text: dt.formatDuration(storeApi.sumDone(day.blocks)) }),
      ]),
      // 없으면 아무 말도 하지 않는다. 시간표에 있는 시간이 합계에서 빠졌을 때만,
      // 왜 숫자가 다른지 여기서 밝힌다.
      uncounted > 0
        ? ui.el("p", {
            class: "totals-note",
            text: "과목 없음 " + dt.formatDuration(uncounted) + "은 공부 시간에 넣지 않습니다.",
          })
        : null,
    ]);
  }

  function memoCard(dateKey) {
    const day = SP.app.store().getDay(dateKey);
    return ui.el("section", { class: "card" }, [
      ui.el("h2", { class: "card-title", text: "메모" }),
      ui.el("textarea", {
        class: "memo", placeholder: "자유롭게 적으세요", maxlength: "1000",
        // change(블러)만 듣지 말 것. 메모에는 저장 버튼이 없어서, 타이핑하다 바로
        // 앱을 내리면 포커스가 빠지지 않아 flush에 담길 내용 자체가 없다.
        // persist()의 300ms 디바운스가 타이핑 연타를 흡수한다.
        oninput: (e) => { SP.app.store().setDay(dateKey, { memo: e.target.value }); SP.app.persist(); },
      }),
    ]);
  }

  function render(host, dateKey) {
    currentHost = host;
    currentKey = dateKey;

    const rateHost = ui.el("div", {});
    const todoHost = ui.el("div", {});
    const timetableHost = ui.el("div", {});
    const totalsHost = ui.el("div", {});

    // 할 일과 블록이 한 쌍으로 움직이므로 둘을 따로 그리면 화면이 어긋난다.
    // 할 일 하나를 체크하면 연결된 블록도 같이 바뀐다. 달성률도 완료 체크에서
    // 파생되므로 같이 다시 그려야 한다.
    const refresh = () => {
      ui.clear(rateHost).appendChild(rateCard(dateKey));
      SP.todos.render(todoHost, dateKey, refresh);
      SP.timetable.render(timetableHost, dateKey, refresh);
      ui.clear(totalsHost).appendChild(totalsCard(dateKey));
    };

    ui.clear(host).appendChild(
      ui.el("div", { class: "day" }, [
        header(dateKey),
        rateHost,
        eventsCard(dateKey),
        todoHost,
        timetableHost,
        totalsHost,
        memoCard(dateKey),
      ])
    );

    const memo = host.querySelector(".memo");
    if (memo) memo.value = SP.app.store().getDay(dateKey).memo;

    refresh();
  }

  function refresh() {
    if (currentHost && currentKey) render(currentHost, currentKey);
  }

  const api = {
    render, refresh, currentKey: () => currentKey,
    openMenu: (dateKey) => SP.sheets.dayMenu(dateKey, refresh),
    openEventEditor: (dateKey, eventId) => SP.sheets.eventEditor(dateKey, eventId, refresh),
  };
  SP.day = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);
