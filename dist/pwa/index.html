<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3E8E5A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>스터디 플래너</title>
  <style>
/* 베이지 바탕에 녹색. 회색은 쓰지 않는다 - 차가운 회색을 따뜻한 베이지 위에
   얹으면 때가 탄 것처럼 보인다. 막대 바탕과 눌린 자리까지 모두 바탕색 쪽으로
   기울여 둔다. */
:root {
  --bg: #F4EEE0;
  --surface: #FFFCF5;
  --line: #E2D9C6;
  --text: #2B2A23;
  --muted: #7C7362;
  --accent: #3E8E5A;
  --accent-weak: rgba(62,142,90,.22);
  --track: #E6DDC9;
  --soft: #EDF3E9;
  --danger: #C0483C;
  --radius: 12px;
  --tt-hour: 180px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* 체크박스·라디오·진행바는 브라우저가 자기 파란색으로 그린다. 테마 색으로 맞춘다. */
:root { accent-color: var(--accent); }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "맑은 고딕", sans-serif;
  font-size: 15px;
  line-height: 1.5;
  /* 화면 왼쪽 끝에서 오른쪽으로 미는 것을 브라우저가 "뒤로 가기"로 가져간다.
     그러면 달력에서 이전 달로 넘기려던 손짓이 앱을 떠나 버린다. */
  overscroll-behavior-x: contain;
}
body.sheet-open { overflow: hidden; }

.screen { max-width: 560px; margin: 0 auto; padding: 12px 12px calc(24px + var(--safe-b)); }

.banner {
  position: sticky; top: 0; z-index: 40;
  background: #F6E7C0; color: #6E5518;
  padding: 10px 14px; font-size: 13px; border-bottom: 1px solid #E7D296;
}

button { font: inherit; color: inherit; }
.btn {
  min-height: 44px; padding: 0 16px; border-radius: var(--radius);
  border: 1px solid var(--line); background: var(--surface); cursor: pointer;
}
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn-ghost { background: transparent; }
.icon-btn {
  min-width: 44px; min-height: 44px; border: 0; background: transparent;
  border-radius: var(--radius); cursor: pointer; font-size: 18px;
}

.scrim { position: fixed; inset: 0; background: rgba(43,42,35,.38); z-index: 50; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 51;
  max-width: 560px; margin: 0 auto;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  max-height: 86vh; display: flex; flex-direction: column;
  padding-bottom: var(--safe-b);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); }
.sheet-title { margin: 0; font-size: 16px; }
.sheet-body { padding: 16px; overflow-y: auto; }
.sheet-actions { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
.sheet-actions .btn { flex: 1; }
.confirm-msg { margin: 0; white-space: pre-line; }

#toast-root { position: fixed; left: 0; right: 0; bottom: calc(24px + var(--safe-b)); z-index: 60; pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.toast { background: rgba(43,42,35,.93); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; transition: opacity .3s; }
.toast-out { opacity: 0; }

.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.field input[type="text"], .field input[type="date"], .field textarea, .field select {
  width: 100%; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); font: inherit;
}
.field textarea { min-height: 88px; resize: vertical; }

/* ---------- 달력 ---------- */
.cal-head { display: grid; grid-template-columns: 44px 1fr 44px auto auto; align-items: center; gap: 4px; margin-bottom: 8px; }
.cal-title { margin: 0; font-size: 18px; text-align: center; }
/* .btn과 특이도가 같고 뒤에 오므로 이 값이 이긴다. 44px 아래로 내리면 안 된다. */
.cal-today-btn { min-height: 44px; padding: 0 10px; font-size: 13px; }

.cal-weekdays, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-weekday { text-align: center; font-size: 12px; color: var(--muted); padding: 4px 0; }
.cal-sun { color: var(--danger); }
.cal-sat { color: #35709F; }

.cal-cell {
  min-height: 74px; padding: 4px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; gap: 2px;
  cursor: pointer; touch-action: pan-y; user-select: none;
}
.cal-cell-out { background: transparent; border: 0; min-height: 74px; cursor: default; }
.cal-today { border-color: var(--accent); box-shadow: 0 0 0 1.5px var(--accent) inset; }
.cal-num { font-size: 13px; font-weight: 600; }

.cal-badges { display: flex; flex-direction: column; gap: 1px; min-height: 0; }
.cal-badge { display: flex; align-items: center; gap: 3px; font-size: 10px; line-height: 1.2; }
.cal-dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto; }
.cal-badge-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-more { font-size: 10px; color: var(--muted); }

.cal-bar { margin-top: auto; height: 4px; background: var(--track); border-radius: 2px; overflow: hidden; }
.cal-bar-fill { height: 100%; background: var(--accent); }
.cal-achieve { font-size: 10px; color: var(--muted); text-align: right; }

.cal-summary { display: flex; justify-content: space-between; margin-top: 14px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13px; color: var(--muted); }

.menu { display: flex; flex-direction: column; }
.menu-item { min-height: 48px; text-align: left; padding: 0 4px; border: 0; background: transparent; border-bottom: 1px solid var(--line); cursor: pointer; }
.menu-item:last-child { border-bottom: 0; }

/* ---------- 하루 화면 ---------- */
.day-head { display: grid; grid-template-columns: 44px auto 1fr 44px; align-items: center; gap: 6px; margin-bottom: 10px; }
.day-nav { display: flex; align-items: center; justify-content: center; gap: 2px; }
.day-date { font-size: 15px; font-weight: 600; white-space: nowrap; }
.dday { background: var(--accent); color: #fff; font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; }
.dday-none { background: var(--track); color: var(--muted); font-weight: 500; }

/* 하루 화면에서는 위쪽 칸들이 늘 붙어 있다. 여백 한 겹이 그대로 시간표가 볼
   자리를 깎으므로 넉넉하지 않게 잡는다. */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; }
.card-title { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 600; }
.empty { margin: 0 0 10px; color: var(--muted); font-size: 13px; }
.add-btn { width: 100%; }

.achieve-head { display: flex; align-items: baseline; gap: 8px; }
.achieve-value { font-size: 18px; font-weight: 700; }

.events-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.events-head .card-title { margin: 0; }
.event-add { min-height: 36px; padding: 0 12px; font-size: 13px; color: var(--accent); border-color: var(--accent); }
.events-empty { margin: 8px 0 0; }
/* 일정이 많은 날에도 위쪽 붙박이가 화면을 다 먹지 않게 막는다. 넘치면 이 안에서 굴린다. */
.event-list { list-style: none; margin: 8px 0 0; padding: 0; max-height: 124px; overflow-y: auto; }
.event-item { display: grid; grid-template-columns: 1fr 44px; align-items: center; border-bottom: 1px solid var(--line); }
.event-item:last-child { border-bottom: 0; }
.event-main {
  display: flex; align-items: center; gap: 8px; min-height: 44px; min-width: 0;
  border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer;
}
.event-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.event-title { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.event-type { font-size: 11px; color: var(--muted); flex: 0 0 auto; }
.event-del { color: var(--danger); font-size: 14px; }

.todo-list { list-style: none; margin: 0 0 10px; padding: 0; }
/* 마지막 줄 아래에는 선을 두지 않는다. 목록의 끝은 칸의 테두리가 맡는다. */
.todo-row:last-child { border-bottom: 0; }
/* 길게 누르면 삭제다. user-select를 끄지 않으면 그동안 iOS가 텍스트를 잡아
   복사 메뉴를 띄운다. touch-action은 pan-y로 둬야 목록을 그대로 스크롤할 수 있다. */
.todo-row {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px;
  padding: 6px 0; border-bottom: 1px solid var(--line);
  touch-action: pan-y; user-select: none; -webkit-user-select: none;
}
.todo-tag { flex: 0 0 auto; font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
/* 할 일 텍스트를 누르면 편집 시트가 열린다. 주 터치 타깃이므로 44px이어야 한다.
   행은 이미 체크박스(44px) 때문에 56px 이상이라 레이아웃은 바뀌지 않는다. */
.todo-text {
  text-align: left; border: 0; background: transparent; padding: 6px 0; cursor: pointer;
  min-height: 44px; min-width: 0;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
}
.todo-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.todo-when { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.todo-when-none { opacity: .6; }
.todo-done .todo-title { text-decoration: line-through; color: var(--muted); }
/* 한 할 일을 나눠 잡았을 때만 회차가 붙는다. 이름과 붙어 다녀야 어느 이름의
   몇 번째인지 읽힌다. */
.todo-head { display: flex; align-items: baseline; gap: 6px; max-width: 100%; min-width: 0; }
.todo-nth {
  flex: 0 0 auto; font-size: 10px; font-weight: 700; color: var(--muted);
  background: var(--track); border-radius: 999px; padding: 1px 6px; font-variant-numeric: tabular-nums;
}
/* 체크박스는 이 앱의 핵심 동작이다. 보이는 상자는 24px이지만 탭 영역은 44px로 넓힌다.
   input에는 가상요소가 안 먹으므로 label로 감싼다. */
.todo-check-hit {
  display: flex; align-items: center; justify-content: center;
  min-width: 44px; min-height: 44px; cursor: pointer;
}
.todo-check { width: 24px; height: 24px; }
/* 할 일 시트의 배정된 시간 목록. 0개·1개·여러 개가 같은 모양이다. */
.slot-list { margin-bottom: 4px; }
.slot { display: grid; grid-template-columns: 1fr 44px; align-items: center; border-bottom: 1px solid var(--line); }
.slot-on { background: var(--soft); }
.slot-head {
  display: flex; align-items: baseline; gap: 8px;
  min-height: 44px; padding: 0 8px; border: 0; background: transparent;
  cursor: pointer; text-align: left;
}
.slot-range { font-weight: 600; font-variant-numeric: tabular-nums; }
.slot-dur { font-size: 12px; color: var(--muted); }
/* .icon-btn의 44px을 그대로 물려받고 색만 바꾼다. 크기를 다시 쓰면 안 된다. */
.slot-del { color: var(--danger); }
.slot-step { padding: 0 8px; margin: 8px 0; }

.subject-select { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); font: inherit; }

/* 목표와 실제가 한 줄에 나란히 선다. 두 줄이면 늘 붙어 있는 이 칸이 그만큼
   두꺼워지고, 시간표가 볼 자리를 잃는다. */
/* 달성률과 목표·실제가 한 줄을 나눠 쓴다. */
.sum-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sum-row .card-title { margin: 0; }
.totals { display: flex; gap: 14px; }
.totals-note { margin: 6px 0 0; font-size: 11px; color: var(--muted); }
.totals-row { display: flex; align-items: baseline; gap: 6px; }
.totals-label { color: var(--muted); font-size: 12px; }
.totals-bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-top: 10px; }
.totals-fill { height: 100%; background: var(--accent); }

/* 메모는 이제 늘 화면에 붙어 있다. 비어 있을 때까지 88px 을 차지하면 정작
   시간표가 볼 자리를 잃는다. 필요하면 오른쪽 아래를 끌어 늘릴 수 있다. */
.memo { width: 100%; min-height: 46px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; resize: vertical; }

/* ---------- 타임테이블 (시간이 위에서 아래로 곧게 흐른다) ---------- */
.tt-wrap { display: flex; user-select: none; }
/* 시각 눈금은 바탕을 달리해 격자와 갈라 둔다. */
.tt-labels { flex: 0 0 40px; background: var(--bg); }
.tt-label-cell {
  height: var(--tt-hour); display: flex; align-items: flex-start; justify-content: flex-end;
  padding: 0 6px 0 0; font-size: 10px; color: var(--muted); line-height: 1;
  transform: translateY(-4px);
}
/* 블록은 이 상자 안에 퍼센트로 얹힌다. 높이는 안쪽 눈금줄이 정한다 - 시간 수를
   CSS 에 박아두지 않기 위해서다. */
.tt-cells {
  flex: 1; min-width: 0; position: relative;
  border-left: 1px solid var(--line);
  background: var(--surface);
  touch-action: pan-y;
}
.tt-line {
  height: var(--tt-hour); border-top: 1px solid var(--line);
  /* 30분 자리의 옅은 눈금. */
  background-image: linear-gradient(to bottom, transparent calc(50% - 1px), #E9E1D0 calc(50% - 1px) 50%, transparent 50%);
}
.tt-line:last-child { border-bottom: 1px solid var(--line); }

/* overflow 를 열어둔다 - ✓ 가 얇은 블록 밖으로 삐져나와야 하기 때문이다.
   글자가 새는 것은 안쪽 .tt-main 이 막는다. */
/* 블록은 늘 제 시간만큼만 차지한다. 최소 높이를 줬더니 5분짜리가 32px 로
   그려져 바로 뒤 블록을 덮어 버렸다 - 이웃을 침범하느니 얇은 편이 낫다.
   대신 한 시간 칸을 180px 로 넓혀, 5분이어도 16px 은 되게 했다. */
.tt-seg {
  position: absolute; left: 2px; right: 2px;
  display: flex; flex-direction: column; overflow: hidden;
  border-radius: 6px;
  filter: saturate(.75); box-shadow: 0 1px 2px rgba(0,0,0,.08);
}
.tt-seg-done { filter: saturate(1.35); box-shadow: 0 1px 3px rgba(0,0,0,.18); }
/* 들린 블록. 원래 자리는 흐려지고 그림자가 손가락을 따라간다. */
.tt-seg-lifted { opacity: .35; }
.merge-btn { width: 100%; min-height: 44px; margin-bottom: 8px; font-size: 13px; color: var(--accent); border-color: var(--accent); }

/* 손잡이 사이에 남는 자리. 여기에 ✓ 와 이름이 가로로 나란히 들어간다. */
.tt-main {
  flex: 1 1 auto; min-height: 0; overflow: hidden;
  display: flex; align-items: center; gap: 4px; padding-left: 3px;
}
/* ✓ 는 블록 높이를 따라가지 않는다. 늘 같은 크기로 세로 가운데에 앉는다. */
.tt-check {
  flex: 0 0 22px; width: 22px; height: 22px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  border: 1.5px solid rgba(31,42,34,.28); border-radius: 7px;
  background: rgba(255,255,255,.88); box-shadow: 0 1px 2px rgba(0,0,0,.12);
  font-size: 13px; font-weight: 800; line-height: 1; cursor: pointer;
}
.tt-check-on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tt-body {
  flex: 1 1 auto; min-width: 0; border: 0; background: transparent; cursor: pointer;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
  padding: 0 6px 0 3px; overflow: hidden; text-align: left;
}
.tt-label { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tt-time { font-size: 10px; opacity: .65; white-space: nowrap; }

/* 짧은 블록(35분 미만). 두 줄로 쌓을 자리가 없으니 이름과 시각을 한 줄로
   붙인다. 손잡이는 얇아지되 모양은 그대로다. */
.tt-seg-tight .tt-handle { flex-basis: 6px; }
.tt-seg-tight .tt-main { gap: 3px; }
.tt-seg-tight .tt-check { flex: 0 0 19px; width: 19px; height: 19px; font-size: 12px; border-radius: 6px; }
.tt-seg-tight .tt-body { flex-direction: row; align-items: baseline; justify-content: flex-start; gap: 5px; }
.tt-seg-tight .tt-label { font-size: 11px; }
.tt-seg-tight .tt-time { font-size: 10px; flex: 0 0 auto; }

/* 아주 짧은 블록(15분 미만). 시각까지 넣을 자리가 없으므로 이름만 남긴다 -
   시각은 눈금이 이미 말해주고, 눌러서 열면 정확히 나온다. */
/* 손잡이의 눈금(::before)은 건드리지 않는다 - 어디서나 같은 모양이어야 한다.
   잡는 자리만 얇아진다. */
.tt-seg-micro .tt-handle { flex-basis: 2px; min-height: 2px; }
.tt-seg-micro .tt-main { gap: 3px; padding-left: 2px; }
.tt-seg-micro .tt-check { flex: 0 0 13px; width: 13px; height: 13px; font-size: 9px; border-radius: 4px; border-width: 1px; }
/* line-height 를 1 로 죈다. 본문에서 물려받은 1.5 로는 9.5px 글자가 14px 을
   차지해, 5분짜리(15px) 안에 손잡이까지 넣으면 자리가 모자란다. */
.tt-seg-micro .tt-label { font-size: 9.5px; line-height: 1; }
.tt-seg-micro .tt-time { display: none; }
.tt-seg-micro .tt-body { padding: 0 4px 0 2px; }

/* 손잡이는 블록의 위아래 끝에 가로로 눕는다. 세로 시간표에서 경계는 가로줄이니
   잡는 것도 가로줄이어야 한다.
   flex-shrink 를 열어둔다 - 아주 짧은 블록에서는 위아래가 절반씩 나눠 갖는다.
   touch-action: none 이라 잡으면 곧바로 우리 제스처가 되고, 얇아서 화면
   스크롤을 가로막지도 않는다.

   평소에는 바탕 없이 가는 눈금만 둔다. 시간표에서 읽어야 하는 것은 과목과
   내용이지 손잡이가 아니다. */
/* 잡는 자리는 눈금이 그려진 가운데뿐이다. 예전에는 블록 위아래 모서리 전체가
   손잡이여서, 시간표를 굴리려고 손가락을 얹은 곳이 하필 경계이면 그대로 길이가
   늘어났다. touch-action: none 이라 한 번 잡히면 굴러가지도 않는다.
   이제 좌우 남는 자리는 블록의 몫이라 그냥 굴러간다. */
.tt-handle {
  flex: 0 1 11px; min-height: 4px;
  align-self: center; width: 72px; max-width: 60%;
  border: 0; background: transparent; padding: 0;
  cursor: ns-resize; touch-action: none;
  display: flex; align-items: center; justify-content: center;
}
/* 손잡이는 어디서나 같은 모양이다. 맞닿은 경계의 것만 눈금을 셋으로 나눠
   뒀었는데, 같은 일을 하는 버튼이 두 모양이면 무엇이 다른지 먼저 궁금해진다.
   맞닿은 곳에서 양쪽이 함께 움직인다는 것은 끌어 보면 바로 보인다. */
.tt-handle::before {
  content: ""; height: 2px; width: 26px; border-radius: 1px; background: rgba(43,42,35,.28);
}
/* 잡고 있는 동안에만 또렷해진다. */
.tt-handle-on { background: rgba(255,255,255,.75); }
.tt-handle-on::before { background: var(--accent); height: 3px; }

/* 미리보기. 손을 떼면 이렇게 된다는 그림이다. 원래 블록은 흐려지므로(.tt-seg-lifted)
   이쪽이 결과로 읽힌다. 과목 색을 깔아 어느 블록인지 알아본다.
   z-index 를 줘야 블록 위로 올라온다 - 자리만 겹쳐 놓으면 블록의 글자가 미리보기를
   뚫고 나온다(CSS 는 인라인 내용을 블록 배경보다 나중에 그린다). */
.tt-ghost {
  position: absolute; left: 2px; right: 2px; z-index: 4;
  background: var(--accent-weak); border: 1.5px dashed var(--accent);
  border-radius: 6px; pointer-events: none; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
}
.tt-ghost-label { font-size: 10px; font-weight: 700; color: var(--accent); background: rgba(255,255,255,.9); padding: 0 4px; border-radius: 4px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tt-ghost-sub { font-size: 9px; font-weight: 700; color: var(--text); background: rgba(255,255,255,.9); padding: 0 4px; border-radius: 4px; white-space: nowrap; }

/* ---------- 탭과 좌우 넘김 ---------- */
/* 시간표/To-Do 가 위, 달성률·일정·메모가 아래다. 하루 화면은 화면 높이를
   통째로 잡고 그 안에서 나눈다 - 그래야 위아래가 제자리에 붙어 있고 가운데만
   굴러간다. dvh 는 주소창이 접히고 펴져도 맞는다 - 옛 브라우저는 앞줄의 vh 로
   떨어진다. */
#screen-day { height: 100vh; height: 100dvh; padding-bottom: 0; overflow: hidden; }
.day { display: flex; flex-direction: column; height: 100%; min-height: 0; }
/* 남는 높이는 이 사슬을 따라 .pager 까지 내려간다. 중간에 한 칸이라도 flex 가
   아니면 거기서 끊겨, 안쪽이 내용만큼 늘어나 화면 전체가 길어진다. */
.pager-host, .pager-wrap { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.tabs { display: flex; gap: 6px; padding: 0 2px 8px; }
.tab {
  flex: 1; min-height: 40px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--surface); color: var(--muted); font: inherit; font-size: 14px; cursor: pointer;
}
.tab-on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
/* 화면에는 보고 있는 쪽 하나만 들어간다. 여기만 굴러간다.
   overscroll-behavior 는 끝까지 굴렸을 때 그 힘이 바깥으로 새지 않게 한다 -
   폰에서 화면 전체가 딸려 움직이거나 새로고침이 당겨지는 것을 막는다. */
/* 보고 있는 칸이 사방으로 닫힌 상자다. 안쪽 내용은 3000px 이 넘으므로 거기에
   테두리를 둘러 봐야 위아래 끝은 영영 화면 밖이다. 테두리는 "지금 보이는
   자리" 에 있어야 시간표가 어디서 시작하고 끝나는지 눈에 걸린다. */
.pager {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  touch-action: pan-y;
  border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface);
}
/* 칸이 이미 테두리를 가졌으므로 안쪽 카드는 테두리를 벗는다. 두 겹이 되면
   모서리마다 선이 어긋나 보인다. */
.pager-page .card {
  border: 0; border-radius: 0; background: transparent;
  margin-bottom: 0; padding: 10px;
}
.pager-page { min-width: 0; }

/* 아래 서랍. 접혀 있으면 손잡이와 한 줄짜리 요약만 내밀고, 펼치면 달성률·
   일정·메모가 올라온다. 늘 펼쳐 두었더니 화면의 40% 를 먹어, 정작 자주 보는
   시간표가 좁았다. */
.day-sheet {
  flex: 0 0 auto; display: flex; flex-direction: column;
  background: var(--surface);
  border-top: 1px solid var(--line);
  border-radius: 14px 14px 0 0;
  box-shadow: 0 -2px 10px rgba(43,42,35,.07);
  padding-bottom: var(--safe-b);
  transition: max-height .26s ease;
  max-height: 88px;                 /* 접힌 높이: 손잡이 + 한 줄 */
  overflow: hidden;
}
.day-sheet-open { max-height: 62%; }

/* 손잡이. 눌러도 열리고 잡아당겨도 열린다. */
.day-grip {
  flex: 0 0 auto; width: 100%; min-height: 26px;
  border: 0; background: transparent; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  touch-action: none;
}
.day-grip-bar {
  width: 40px; height: 4px; border-radius: 2px; background: var(--track);
  transition: background .2s ease;
}
.day-grip:hover .day-grip-bar { background: var(--muted); }
.day-sheet-open .day-grip-bar { background: var(--muted); }

/* 접혔을 때 보이는 한 줄. */
.peek-host { flex: 0 0 auto; touch-action: none; }
.peek { padding: 0 14px 8px; }
.peek-bar { height: 5px; border-radius: 3px; background: var(--track); overflow: hidden; }
.peek-fill { height: 100%; background: var(--accent); transition: width .3s ease; }
.peek-row { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; min-width: 0; }
.peek-rate { flex: 0 0 auto; font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.peek-events { display: flex; gap: 10px; min-width: 0; overflow: hidden; }
.peek-event { display: flex; align-items: center; gap: 4px; min-width: 0; }
.peek-dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 50%; }
.peek-title { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.peek-none { font-size: 12px; color: var(--muted); }
/* 펼치면 요약 줄은 물러난다 - 같은 값이 바로 아래에 크게 다시 나온다. */
.day-sheet-open .peek { display: none; }

/* 펼쳤을 때의 속. 접혀 있는 동안에는 자리를 차지하지 않는다. */
.day-sheet-body {
  flex: 1 1 auto; min-height: 0; overflow-y: auto;
  overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 0 2px 8px;
}
.day-sheet:not(.day-sheet-open) .day-sheet-body { display: none; }
.day-sheet-body .card:last-child { margin-bottom: 0; }
@media (prefers-reduced-motion: reduce) {
  .day-sheet, .peek-fill { transition: none; }
}
.page-in-left { animation: page-in-left .18s ease-out; }
.page-in-right { animation: page-in-right .18s ease-out; }
@keyframes page-in-left { from { transform: translateX(26%); opacity: .35; } to { transform: none; opacity: 1; } }
@keyframes page-in-right { from { transform: translateX(-26%); opacity: .35; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .page-in-left, .page-in-right { animation: none; } }

/* 지금 시각. 세로 시간표에서는 가로줄이다. */
.tt-now { position: absolute; left: 0; right: 0; height: 2px; background: var(--danger); z-index: 5; pointer-events: none; }
.tt-now::before { content: ""; position: absolute; left: -3px; top: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }

.editor-range { display: flex; justify-content: space-between; align-items: baseline; font-size: 18px; margin-bottom: 12px; }
.editor-duration { font-size: 13px; color: var(--muted); }
.stepper { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; margin-bottom: 10px; }
.stepper-label { font-size: 13px; color: var(--muted); }
/* .btn과 특이도가 같고 뒤에 오므로 이 값이 이긴다(cal-today-btn과 동일 패턴). 44px 아래로 내리면 안 된다. */
.stepper-btn { min-height: 44px; padding: 0 12px; }

/* 짧은 블록은 트랙 위 ✓가 작아 누르기 어렵다. 시트에서도 완료를 바꿀 수 있어야 한다. */
.editor-done { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 14px; cursor: pointer; }
.editor-done input { width: 24px; height: 24px; }

/* ---------- 시트 내부 ---------- */
.sheet-sub { margin: 16px 0 8px; font-size: 13px; color: var(--muted); }
.sheet-sub:first-child { margin-top: 0; }

.chip-group { display: flex; flex-wrap: wrap; gap: 6px; }
/* 브리프 원안은 38px였다. 범위/요일/모드 선택 칩은 주 탭 타깃이므로 44px로 올린다. */
.chip { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-size: 13px; cursor: pointer; }
.chip-on { background: var(--accent); border-color: var(--accent); color: #fff; }

.custom-range { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.custom-range .field { margin-bottom: 0; }

.wd-row { display: flex; gap: 4px; margin-top: 10px; }
/* label 전체가 탭 영역이다(내부 checkbox를 감쌈). 내용만으로는 44px에 못 미쳐 직접 지정한다. */
.wd-chip { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12px; flex: 1; min-height: 44px; }
.wd-chip input { width: 20px; height: 20px; }

.paste-source { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
.paste-preview { margin: 16px 0 0; padding: 10px; background: var(--soft); border-radius: var(--radius); font-size: 13px; font-weight: 600; text-align: center; }

.menu-danger { color: var(--danger); }

/* 자동으로 짜기. 넣기 전에 무엇이 어디로 가는지 보여주는 칸이다. */
.plan-fields { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
.field-inline { flex: 1 1 30%; min-width: 96px; }
.plan-preview { max-height: 210px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 10px; }
.plan-list { list-style: none; margin: 0; padding: 0; }
.plan-row { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--line); }
.plan-row:last-child { border-bottom: 0; }
.plan-when { flex: 0 0 auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.plan-what { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.subject-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.subject-row { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; align-items: center; }
.subject-row input[type="color"] { width: 44px; height: 44px; padding: 2px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.subject-row input[type="text"] { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); font: inherit; }

.backup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.hidden-file { display: none; }

/* ---------- 사전 ---------- */
.sheet-sub { margin: 14px 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; }
.sheet-body > .sheet-sub:first-child { margin-top: 0; }

/* 칩은 무엇을 보고 있는지와 각 분류에 몇 개가 들었는지를 한 줄로 보여준다. */
.dict-chip-new { color: var(--accent); border-style: dashed; }
/* 분류 만들기·이름 바꾸기·없애기는 모두 칩 바로 아래 이 자리에서 끝난다. */
.dict-tools { display: flex; gap: 14px; padding: 8px 2px 0; }
.link-btn {
  border: 0; background: transparent; padding: 4px 0; min-height: 32px;
  font: inherit; font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline;
}
.link-danger { color: var(--danger); }
.dict-confirm { padding: 10px 0 0; }
.dict-confirm-msg { display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.dict-confirm-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.dict-search-row { margin-top: 10px; }
.dict-search {
  width: 100%; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: var(--radius); font: inherit;
}

.dict-list { list-style: none; margin: 10px 0 0; padding: 0; }
/* 이름 · 분류 고르개 · 계획에 넣기. 셋 다 한 줄에서 보이고 바로 눌린다. */
.dict-row { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); }
.dict-row:last-child { border-bottom: 0; }
.dict-main {
  min-height: 48px; min-width: 0; padding: 6px 0;
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
}
.dict-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dict-meta { font-size: 11px; color: var(--muted); }
/* 좁은 화면에서 이름 자리를 다 먹지 않게 묶어둔다. 폰에서는 눌렀을 때 운영체제의
   고르개가 뜨므로 좁아도 읽는 데 지장이 없다. */
.dict-group {
  max-width: 104px; min-height: 40px; padding: 4px 6px;
  border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--surface); font: inherit; font-size: 12px;
}
.dict-add { color: var(--accent); font-size: 18px; }
.dict-hint { margin: 12px 0 0; font-size: 11px; color: var(--muted); }
.row-add { display: flex; gap: 8px; padding-top: 8px; }
.row-add input {
  flex: 1; min-width: 0; min-height: 44px; padding: 8px 12px;
  border: 1px solid var(--line); border-radius: var(--radius); font: inherit;
}

/* 인쇄. 화면을 그대로 뽑으면 탭·손잡이·버튼까지 찍힌다. 캔버스로 다시 그린
   그림 한 장만 남기고 나머지는 종이에서 지운다. */
.print-sheet { display: none; }
@media print {
  body { background: #fff; }
  body > *:not(.print-sheet) { display: none !important; }
  .print-sheet { display: block; }
  .print-sheet img { width: 100%; height: auto; }
  @page { margin: 12mm; }
}

/* 일정 예시와 주고받는 코드. */
.tpl-list { display: flex; flex-direction: column; margin-bottom: 4px; }
.tpl-item {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: baseline;
  text-align: left; min-height: 56px; padding: 8px 4px; cursor: pointer;
  border: 0; border-bottom: 1px solid var(--line); background: transparent;
}
.tpl-item:last-child { border-bottom: 0; }
.tpl-name { font-weight: 600; }
.tpl-note { font-size: 12px; color: var(--muted); }
.tpl-when { grid-column: 1 / -1; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.code-box {
  width: 100%; padding: 8px 10px; margin-bottom: 6px;
  border: 1px solid var(--line); border-radius: var(--radius);
  font: inherit; font-size: 12px; resize: vertical;
  word-break: break-all; background: var(--surface); color: var(--text);
}

/* 알림 설정. 큰 스위치 하나 아래에 항목별 스위치가 딸린다. */
.notify-box { margin-bottom: 4px; }
.notify-row {
  display: flex; align-items: flex-start; gap: 10px;
  min-height: 48px; padding: 8px 4px; cursor: pointer;
  border-bottom: 1px solid var(--line);
}
.notify-row:last-of-type { border-bottom: 0; }
.notify-row input { width: 22px; height: 22px; margin-top: 2px; flex: 0 0 auto; }
.notify-main { font-weight: 600; }
.notify-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.notify-label { line-height: 1.3; }
.notify-note { font-size: 12px; color: var(--muted); }
/* 큰 스위치가 꺼져 있으면 아래 항목은 흐려진다. */
.notify-row input:disabled + .notify-text { opacity: .45; }

/* 집중 화면. 지금 할 것과 다음 할 것만 크게 띄운다.
   폰 잠금화면에 그리는 것은 웹이 할 수 없다. 대신 화면을 이 한 장으로 덮고
   화면 꺼짐을 막아, 책상에 세워두면 같은 자리에서 같은 일을 한다. */
body.focus-open { overflow: hidden; }
.focus {
  position: fixed; inset: 0; z-index: 60;
  background: var(--bg); color: var(--text);
  display: flex; align-items: center; justify-content: center;
  padding: calc(20px + var(--safe-b)) 20px;
}
.focus-inner { width: 100%; max-width: 520px; }
.focus-close { position: absolute; top: 8px; right: 8px; font-size: 20px; color: var(--muted); }
.focus-date { margin: 0 0 24px; font-size: 14px; color: var(--muted); }
.focus-tag {
  margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .12em;
  color: var(--muted); text-transform: uppercase;
}
.focus-now { margin-bottom: 36px; }
.focus-title { margin: 0 0 8px; font-size: 34px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.focus-time { margin: 0; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.focus-left { margin: 4px 0 12px; font-size: 20px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.focus-idle { color: var(--muted); font-weight: 500; }
.focus-bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.focus-fill { height: 100%; transition: width .5s linear; }
.focus-done { width: 100%; min-height: 52px; font-size: 16px; }
.focus-done-on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.focus-next { border-top: 1px solid var(--line); padding-top: 20px; }
.focus-next-title { margin: 0 0 4px; font-size: 22px; font-weight: 600; line-height: 1.25; }
@media (prefers-reduced-motion: reduce) { .focus-fill { transition: none; } }

/* 고르는 자리에서 바로 과목을 만든다. 목록이 비어서 시작하니, 설정까지
   들어가야만 만들 수 있으면 아무도 안 만든다. */

(function (root) {
  const DAY_START = 300;   // 05:00
  const DAY_END = 1560;    // 익일 02:00
  const SLOT = 5;
  const DAY_BOUNDARY_HOUR = 4;
  const WEEKDAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

  function pad2(n) {
    return String(n).padStart(2, "0");
  }

  function snapToSlot(minutes) {
    return Math.round(minutes / SLOT) * SLOT;
  }

  function clampToDay(minutes) {
    return Math.min(DAY_END, Math.max(DAY_START, minutes));
  }

  function minutesToLabel(minutes) {
    const wrapped = ((minutes % 1440) + 1440) % 1440;
    return pad2(Math.floor(wrapped / 60)) + ":" + pad2(wrapped % 60);
  }

  function formatDuration(minutes) {
    const h = Math.floor(minutes / 60);
    const m = minutes % 60;
    if (h === 0) return m + "분";
    if (m === 0) return h + "시간";
    return h + "시간 " + m + "분";
  }

  function dateKey(date) {
    return (
      date.getFullYear() + "-" + pad2(date.getMonth() + 1) + "-" + pad2(date.getDate())
    );
  }

  function parseDateKey(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  // 모양만 보면 안 된다. "2026-02-30"은 정규식을 통과하지만 파싱하면 3월 2일이 되어
  // 화면에 뜨는 날짜와 D-day 계산이 어긋난다. 왕복시켜 같은 문자열이 나오는지 본다.
  function isValidDateKey(key) {
    if (typeof key !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(key)) return false;
    return dateKey(parseDateKey(key)) === key;
  }

  function addDays(key, n) {
    const d = parseDateKey(key);
    d.setDate(d.getDate() + n);
    return dateKey(d);
  }

  function toUTCms(key) {
    const [y, m, d] = key.split("-").map(Number);
    return Date.UTC(y, m - 1, d);
  }

  function daysBetween(fromKey, toKey) {
    return Math.round((toUTCms(toKey) - toUTCms(fromKey)) / 86400000);
  }

  function weekdayOf(key) {
    return parseDateKey(key).getDay();
  }

  function plannerDateKey(now) {
    const shifted = new Date(now.getTime());
    shifted.setHours(shifted.getHours() - DAY_BOUNDARY_HOUR);
    return dateKey(shifted);
  }

  function formatDateKorean(key) {
    const d = parseDateKey(key);
    return (
      d.getFullYear() + ". " + (d.getMonth() + 1) + ". " + d.getDate() +
      ". (" + WEEKDAY_NAMES[d.getDay()] + ")"
    );
  }

  const datetime = {
    DAY_START, DAY_END, SLOT, DAY_BOUNDARY_HOUR, WEEKDAY_NAMES,
    snapToSlot, clampToDay, minutesToLabel, formatDuration,
    dateKey, parseDateKey, isValidDateKey, addDays, daysBetween, weekdayOf,
    plannerDateKey, formatDateKorean,
  };

  root.SP = root.SP || {};
  root.SP.datetime = datetime;
  if (typeof module !== "undefined") module.exports = datetime;

  <script>
(function (root) {
  const dt = typeof require !== "undefined" ? require("./datetime.js") : root.SP.datetime;

  const STORAGE_KEY = "studyPlanner.v1";
  const SCHEMA_VERSION = 1;

  // 없애기로 한 옛 기본 과목. 이 id 는 예전 DEFAULT_SUBJECTS 에만 있었다.
  const LEGACY_ETC_ID = "etc";

  function newId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function emptyDay() {
    return { achievement: 0, memo: "", todos: [], blocks: [], updatedAt: 0 };
  }

  function isDayEmpty(day) {
    return (
      !day ||
      ((day.todos || []).length === 0 &&
        (day.blocks || []).length === 0 &&
        !day.memo &&
        !day.achievement)
    );
  }

  function validateBlock(b) {
    if (!b || typeof b.start !== "number" || typeof b.end !== "number")
      return { ok: false, error: "시간이 올바르지 않습니다." };
    if (b.start % dt.SLOT !== 0 || b.end % dt.SLOT !== 0)
      return { ok: false, error: "시간은 5분 단위여야 합니다." };
    if (b.end - b.start < dt.SLOT)
      return { ok: false, error: "블록은 최소 5분이어야 합니다." };
    if (b.start < dt.DAY_START || b.end > dt.DAY_END)
      return { ok: false, error: "05:00 ~ 익일 02:00 범위 안에만 만들 수 있습니다." };
    return { ok: true, error: null };
  }

  function overlaps(a, b) {
    return a.start < b.end && b.start < a.end;
  }

  function findOverlap(blocks, candidate, ignoreId) {
    for (const b of blocks) {
      if (ignoreId && b.id === ignoreId) continue;
      if (b.id === candidate.id) continue;
      if (overlaps(b, candidate)) return b;
    }
    return null;
  }

  // anchor = 손가락을 처음 댄 지점, cursor = 지금 위치. 둘 다 클램프해서 쓴다.
  //
  // 계약:
  //   1. anchor가 빈 구간에 있으면 (호출부가 항상 보장하는 조건) 결과는 anchor를
  //      품고, 드래그 방향으로 가장 가까운 블록 경계에서 멈춘다.
  //   2. anchor가 블록 안에 있으면 (UI에서는 도달 불가한 방어적 경로) 결과를
  //      그 블록 밖으로, 드래그 방향 쪽으로 밀어낸다. 이때는 anchor를 품지 않는다.
  //   3. 남는 자리가 없으면 빈 구간(start === end)을 돌려준다. 호출부가 최소 5분
  //      검사로 걸러낸다.
  //
  // 방향을 구간의 중점으로 판정하면 안 된다 — 멀리 드래그할 때 선택이 기존
  // 블록을 통째로 건너뛴다.
  function limitRange(blocks, anchor, cursor, ignoreId) {
    const a = dt.clampToDay(anchor);
    const c = dt.clampToDay(cursor);
    let lo = Math.min(a, c);
    let hi = Math.max(a, c);
    for (const b of blocks) {
      if (ignoreId && b.id === ignoreId) continue;
      if (b.end <= lo || b.start >= hi) continue;
      if (b.end <= a) lo = Math.max(lo, b.end);          // 블록이 anchor 위쪽
      else if (b.start >= a) hi = Math.min(hi, b.start); // 블록이 anchor 아래쪽
      else if (c >= a) lo = Math.max(lo, b.end);         // anchor가 블록 안 + 아래로 끄는 중
      else hi = Math.min(hi, b.start);                   // anchor가 블록 안 + 위로 끄는 중
    }
    if (hi < lo) hi = lo;
    return { start: lo, end: hi };
  }

  // 과목을 안 고른 블록은 공부로 세지 않는다. 씻기·이동·쉬는 시간처럼 시간표에
  // 두고 싶지만 공부는 아닌 것이 여기 들어온다. 이것까지 세면 목표 시간이
  // 하루 종일이 되어, 숫자가 아무것도 말해주지 않는다.
  //
  // 거르는 자리는 합계 함수 안이다. 목표시간·실제시간·달성률·달력이 모두 이
  // 함수들을 거치므로, 화면마다 따로 거르면 어느 하나가 빠졌을 때 값이 어긋난다.
  function isStudy(b) {
    return !!(b && b.subjectId);
  }

  function sumPlanned(blocks) {
    return (blocks || []).reduce((sum, b) => (isStudy(b) ? sum + (b.end - b.start) : sum), 0);
  }

  function sumDone(blocks) {
    return (blocks || []).reduce((sum, b) => (isStudy(b) && b.done ? sum + (b.end - b.start) : sum), 0);
  }

  // 시간표에는 있는데 합계에서 빠진 시간. 왜 목표시간이 시간표보다 적은지
  // 화면에서 설명하려면 이 값이 필요하다.
  function sumUncounted(blocks) {
    return (blocks || []).reduce((sum, b) => (isStudy(b) ? sum : sum + (b.end - b.start)), 0);
  }

  // 달성률은 계획 대비 실제다. 하루 화면과 달력이 같은 값을 보여야 하므로
  // 여기 한 곳에서만 계산한다. 계획이 없으면 나눌 수 없으니 0이다.
  function doneRatio(blocks) {
    const planned = sumPlanned(blocks);

    // 켠 사용자에게 매번 데이터 손상 경고 배너가 뜬다. fresh일 때는 기본값을 몇 개
    // 채워 넣든 recovered를 올리지 않는다.
    const fresh = raw == null;
    let recovered = false;
    const mark = () => { if (!fresh) recovered = true; };

    if (fresh || typeof raw !== "object" || Array.isArray(raw)) {
      mark();

    const version = typeof raw.version === "number" ? raw.version : SCHEMA_VERSION;
    const readOnly = version > SCHEMA_VERSION;

    // 과목이 하나도 없는 것은 이제 정상이다 - 처음 켠 상태가 그렇다. 그러니
    // 빈 목록을 고쳤다고 표시하지 않는다. 표시하면 열 때마다 "고쳤습니다" 띠가
    // 뜬다. 목록 자체가 없거나 모양이 틀린 것만 고친 것으로 센다.
    let subjects = raw.settings && Array.isArray(raw.settings.subjects) ? raw.settings.subjects : null;
    if (!subjects) mark();
    let kept = (subjects || []).filter((s) => s && typeof s.id === "string" && typeof s.name === "string");
    if (subjects && kept.length !== subjects.length) mark();

    // 예전에는 앱이 과목 일곱 개를 미리 깔았고 그중 하나가 '기타' 였다. 무엇을
    // 공부했는지 말해주지 않는 이름이라 없앴는데, 그때 이미 쓰던 사람의 저장에는
    // 그대로 남는다. 그 하나만 걷어낸다 - 옛 기본값의 id 로만 알아본다.
    // 손으로 만든 '기타' 는 id 가 다르므로 건드리지 않는다.
    const legacy = kept.find((x) => x.id === LEGACY_ETC_ID && x.name === "기타");
    if (legacy) kept = kept.filter((x) => x !== legacy);
    subjects = kept;
    const drop = legacy ? legacy.id : null;

    // 알림 설정. settings 는 여기서 통째로 다시 지어지므로, 걸러 담지 않으면
    // 켜 둔 알림이 앱을 열 때마다 꺼진다. 참/거짓만 통과시킨다.
    const rawNotify = raw.settings && raw.settings.notify;
    const notify = {};
    if (rawNotify && typeof rawNotify === "object") {
      for (const [k, v] of Object.entries(rawNotify)) {
        if (typeof v === "boolean") notify[k] = v;
      }
    }

    const days = {};
    const rawDays = raw.days && typeof raw.days === "object" && !Array.isArray(raw.days) ? raw.days : (mark(), {});
    for (const [key, value] of Object.entries(rawDays)) {
      if (!dt.isValidDateKey(key)) { mark(); continue; }
      if (!value || typeof value !== "object") { mark(); continue; }
      const day = emptyDay();
      day.achievement = typeof value.achievement === "number" ? Math.min(100, Math.max(0, value.achievement)) : 0;
      day.memo = typeof value.memo === "string" ? value.memo : "";
      day.updatedAt = typeof value.updatedAt === "number" ? value.updatedAt : 0;
      // 과목이 없으면 완료도 없다. 화면에 체크가 없으므로, 켜져 있던 표시가
      // 남으면 끌 방법이 사라진다. 손상이 아니라 정리이므로 mark() 하지 않는다.
      // drop 은 걷어낸 옛 과목의 id 다. 그것을 가리키던 것은 '과목 없음' 이 된다.
      const subjectOf = (id) => (id && id !== drop ? id : null);
      day.todos = (Array.isArray(value.todos) ? value.todos : []).filter((t) => t && typeof t.text === "string")
        .map((t) => {
          const subjectId = subjectOf(t.subjectId);
          return { id: t.id || newId(), subjectId, text: t.text, done: !!(subjectId && t.done) };
        });
      const accepted = [];
      for (const b of Array.isArray(value.blocks) ? value.blocks : []) {
        const subjectId = subjectOf(b && b.subjectId);
        const block = { id: (b && b.id) || newId(), subjectId,
          text: b && typeof b.text === "string" ? b.text : "", start: b && b.start, end: b && b.end,
          done: !!(subjectId && b && b.done), todoId: b && typeof b.todoId === "string" ? b.todoId : null };
        if (!validateBlock(block).ok) { mark(); continue; }
        if (findOverlap(accepted, block)) { mark(); continue; }
        accepted.push(block);
      }
      day.blocks = accepted.sort((a, b) => a.start - b.start);

      // 가리키는 할 일이 없는 링크는 끊는다. 블록은 살린다 — 시각 정보가 더 아깝다.
      // JSON 가져오기로 얼마든지 들어올 수 있는 모양이다.
      const todoIds = new Set(day.todos.map((t) => t.id));
      for (const b of day.blocks) {
        if (b.todoId && !todoIds.has(b.todoId)) { mark(); b.todoId = null; }
      }
      if (isDayEmpty(day)) continue;
      days[key] = day;
    }

    const events = (Array.isArray(raw.events) ? raw.events : (mark(), []))
      .filter((e) => e && typeof e.title === "string" && dt.isValidDateKey(e.startDate))
      .map((e) => ({
        id: e.id || newId(), title: e.title, type: e.type || "etc", color: e.color || "#FFA94D",
        startDate: e.startDate, endDate: dt.isValidDateKey(e.endDate) ? e.endDate : e.startDate,
        memo: typeof e.memo === "string" ? e.memo : "",
      }));

    // clipboard는 describeClip이 ⋯ 메뉴를 그릴 때마다 읽는다. 모양이 깨진 값을
    // 통과시키면 메뉴가 통째로 안 열리고, 앱 안에서 복구할 방법이 없어진다.
    let clipboard = null;
    const rawClip = raw.clipboard;
    if (rawClip && typeof rawClip === "object" && rawClip.payload && typeof rawClip.payload === "object") {
      if (rawClip.kind === "day" &&
          Array.isArray(rawClip.payload.todos) && Array.isArray(rawClip.payload.blocks)) {
        clipboard = rawClip;
      } else if (rawClip.kind === "week" &&
                 rawClip.payload.byWeekday && typeof rawClip.payload.byWeekday === "object") {
        clipboard = rawClip;
      }
    }
    if (raw.clipboard && !clipboard) mark();

    // 사전의 분류. 항목 자체는 날짜 데이터에서 뽑으므로 여기서 지킬 것은
    // 사용자가 만든 분류와 배정뿐이다. 없는 것은 손상이 아니다 — 이 기능이
    // 생기기 전에 저장된 데이터에는 당연히 없다.
    const dictionary = { groups: [], assign: {} };
    const rawDict = raw.dictionary;
    if (rawDict && typeof rawDict === "object" && !Array.isArray(rawDict)) {
      dictionary.groups = (Array.isArray(rawDict.groups) ? rawDict.groups : [])
        .filter((g) => g && typeof g.id === "string" && typeof g.name === "string")
        .map((g) => ({ id: g.id, name: g.name }));
      const ids = new Set(dictionary.groups.map((g) => g.id));
      const rawAssign = rawDict.assign && typeof rawDict.assign === "object" && !Array.isArray(rawDict.assign)
        ? rawDict.assign : {};
      for (const [text, gid] of Object.entries(rawAssign)) {
        // 없어진 분류를 가리키는 배정은 버린다. 남겨두면 어느 묶음에도 안 잡힌다.
        if (typeof gid === "string" && ids.has(gid)) dictionary.assign[text] = gid;
      }
    } else if (rawDict != null) {
      mark();
    }

    return {
      state: { version, settings: { subjects, notify, dayBoundaryHour: dt.DAY_BOUNDARY_HOUR }, days, events, clipboard, dictionary },
      recovered,
      readOnly,
    };
  }

  function createStore(storage) {
    let state = sanitizeState(null).state;
    let error = null;
    let readOnly = false;

    function load() {
      let parsed = null;
      let corrupt = false;
      try {
        const text = storage.getItem(STORAGE_KEY);
        if (text) parsed = JSON.parse(text);
      } catch (e) {
        corrupt = true;
        try { storage.setItem(STORAGE_KEY + ".corrupt." + Date.now(), storage.getItem(STORAGE_KEY) || ""); } catch (_) {}
        try { storage.removeItem(STORAGE_KEY); } catch (_) {}
      }
      const result = sanitizeState(parsed);
      state = result.state;
      readOnly = result.readOnly;
      return { recovered: corrupt || result.recovered, readOnly };
    }

    function save() {
      if (readOnly) return false;
      try {
        storage.setItem(STORAGE_KEY, JSON.stringify(state));
        error = null;
        return true;
      } catch (e) {
        error = e;
        return false;
      }
    }

    function getState() { return state; }

    function getDay(key) {
      return state.days[key] || emptyDay();
    }

    function setDay(key, patch) {
      const next = Object.assign(emptyDay(), state.days[key], patch);
      next.updatedAt = Date.now();
      if (isDayEmpty(next)) delete state.days[key];
      else state.days[key] = next;
      return next;
    }

    return { getState, getDay, setDay, save, load, lastError: () => error, isReadOnly: () => readOnly };
  }

  const api = {
    STORAGE_KEY, SCHEMA_VERSION,
    newId, emptyDay, isDayEmpty, validateBlock, overlaps, findOverlap,
    limitRange, isStudy, sumPlanned, sumDone, sumUncounted, doneRatio, sanitizeState, createStore,
  };

  root.SP = root.SP || {};
  root.SP.store = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

  // 사전은 따로 쌓아두지 않고 날짜 데이터에서 그때그때 뽑는다. 별도로 저장하면
  // 할 일을 지웠을 때 사전에만 남아 어긋나고, 두 곳을 맞추는 코드가 계속 는다.

  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const subjectsApi = SP.subjects;
  const ui = SP.ui;

  // 일정표를 그림으로 내보내고 종이로 뽑는다.
  //
  // 화면을 그대로 찍지 않고 캔버스에 다시 그린다. 화면 것은 폰 너비에 맞춰
  // 글자가 잘리고 손잡이 같은 것이 함께 찍힌다. 여기서 그리는 것은 "읽을
  // 사람"을 위한 그림이라, 만질 것은 빼고 읽을 것만 넣는다.

  const W = 900;          // 그림 너비
  const PAD = 40;
  const HEAD = 130;
  const HOUR = 62;        // 한 시간의 높이
  const LABEL_W = 74;

  const INK = "#2B2A23";
  const MUTED = "#7C7362";
  const LINE = "#E2D9C6";
  const PAPER = "#FFFCF5";
  const ACCENT = "#3E8E5A";

  // 시간표에 블록이 있으면 그 범위만, 없으면 아침부터 밤까지.
  function rangeOf(blocks) {
    if (!blocks || blocks.length === 0) return { from: 540, to: 1380 };
    let from = Math.floor(Math.min.apply(null, blocks.map((b) => b.start)) / 60) * 60;
    let to = Math.ceil(Math.max.apply(null, blocks.map((b) => b.end)) / 60) * 60;
    // 너무 얇으면 읽기 어렵다. 최소 여섯 시간은 보여준다.
    if (to - from < 360) to = Math.min(dt.DAY_END, from + 360);
    return { from, to };
  }

  function roundRect(ctx, x, y, w, h, r) {
    const radius = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  // 한 줄이 칸을 넘으면 잘라내고 말줄임을 붙인다. 캔버스에는 줄바꿈이 없다.
  function fit(ctx, text, max) {
    if (ctx.measureText(text).width <= max) return text;
    let cut = text;
    while (cut.length > 1 && ctx.measureText(cut + "…").width > max) cut = cut.slice(0, -1);
    return cut + "…";
  }

  function draw(dateKey) {
    const state = SP.app.state();
    const day = SP.app.store().getDay(dateKey);
    const subjects = state.settings.subjects;
    const blocks = (day.blocks || []).slice().sort((a, b) => a.start - b.start);
    const range = rangeOf(blocks);
    const from = range.from;
    const to = range.to;
    const rows = (to - from) / 60;

    const canvas = document.createElement("canvas");
    const scale = 2; // 폰에서 봐도 흐리지 않게 두 배로 그린다
    const height = HEAD + rows * HOUR + PAD;
    canvas.width = W * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext("2d");
    ctx.scale(scale, scale);
    ctx.textBaseline = "middle";

    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, W, height);

    // ---- 머리말 ----
    ctx.fillStyle = INK;
    ctx.font = "700 32px 'Malgun Gothic', sans-serif";
    ctx.fillText(dt.formatDateKorean(dateKey), PAD, 46);

    const ratio = storeApi.doneRatio(day.blocks);
    ctx.font = "16px 'Malgun Gothic', sans-serif";
    ctx.fillStyle = MUTED;
    ctx.fillText("목표 " + dt.formatDuration(storeApi.sumPlanned(day.blocks)) +
      "   실제 " + dt.formatDuration(storeApi.sumDone(day.blocks)), PAD, 78);

    ctx.font = "700 30px 'Malgun Gothic', sans-serif";
    ctx.fillStyle = ACCENT;
    ctx.textAlign = "right";
    ctx.fillText(ratio + "%", W - PAD, 52);
    ctx.textAlign = "left";

    // 달성률 막대
    const barY = 96;
    ctx.fillStyle = "#E6DDC9";
    roundRect(ctx, PAD, barY, W - PAD * 2, 8, 4);
    ctx.fill();
    if (ratio > 0) {
      ctx.fillStyle = ACCENT;
      roundRect(ctx, PAD, barY, (W - PAD * 2) * (ratio / 100), 8, 4);
      ctx.fill();
    }

    // ---- 시간 눈금 ----
    const gridX = PAD + LABEL_W;
    const gridW = W - PAD - gridX;
    const yOf = (m) => HEAD + ((m - from) / 60) * HOUR;

    ctx.strokeStyle = LINE;
    ctx.lineWidth = 1;
    ctx.font = "14px 'Malgun Gothic', sans-serif";
    for (let i = 0; i <= rows; i++) {
      const y = HEAD + i * HOUR;
      ctx.beginPath();
      ctx.moveTo(gridX, y + 0.5);
      ctx.lineTo(W - PAD, y + 0.5);
      ctx.stroke();
      if (i < rows) {
        ctx.fillStyle = MUTED;
        ctx.fillText(dt.minutesToLabel(from + i * 60), PAD, y + 12);
      }
    }

    // ---- 블록 ----
    for (const b of blocks) {
      if (b.end <= from || b.start >= to) continue;
      const y = yOf(Math.max(b.start, from));
      const h = Math.max(6, yOf(Math.min(b.end, to)) - y);
      ctx.fillStyle = subjectsApi.colorOf(subjects, b.subjectId);
      roundRect(ctx, gridX + 3, y + 1, gridW - 6, h - 2, 6);
      ctx.fill();

      const name = subjectsApi.nameOf(subjects, b.subjectId);
      const label = [name, b.text].filter(Boolean).join(" · ") || "이름 없음";
      const time = dt.minutesToLabel(b.start) + "~" + dt.minutesToLabel(b.end);

      // 다 한 것에만 체크를 그린다. 종이에서는 누를 수 없으니 표시로만 둔다.
      let textX = gridX + 14;
      if (b.done) {
        ctx.fillStyle = ACCENT;
        roundRect(ctx, gridX + 12, y + h / 2 - 9, 18, 18, 5);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "700 13px 'Malgun Gothic', sans-serif";
        ctx.fillText("✓", gridX + 17, y + h / 2 + 1);
        textX = gridX + 38;
      }

      // 30분보다 짧으면 두 줄이 안 들어간다. 시각과 이름을 한 줄로 붙인다.
      ctx.fillStyle = INK;
      if (h >= 30) {
        ctx.font = "600 16px 'Malgun Gothic', sans-serif";
        ctx.fillText(fit(ctx, label, gridW - (textX - gridX) - 120), textX, y + h / 2 - 8);
        ctx.font = "13px 'Malgun Gothic', sans-serif";
        ctx.fillStyle = MUTED;
        ctx.fillText(time, textX, y + h / 2 + 10);
      } else {
        ctx.font = "600 12px 'Malgun Gothic', sans-serif";
        ctx.fillText(fit(ctx, time + "  " + label, gridW - (textX - gridX) - 20), textX, y + h / 2);
      }
    }

    // ---- 메모 ----
    if (day.memo) {
      ctx.fillStyle = MUTED;
      ctx.font = "14px 'Malgun Gothic', sans-serif";
      const flat = day.memo.split(/\s+/).join(" ");
      ctx.fillText(fit(ctx, "메모  " + flat, W - PAD * 2), PAD, height - PAD + 6);
    }

    return canvas;
  }

  function fileName(dateKey) {
    return "일정표-" + dateKey + ".png";
  }

  // 폰에서는 내려받기보다 공유 창이 낫다. 사진첩·메신저로 바로 보낼 수 있다.
  // 공유를 못 하는 곳에서는 내려받기로 떨어진다.
  async function saveImage(dateKey) {
    const canvas = draw(dateKey);
    const blob = await new Promise((r) => canvas.toBlob(r, "image/png"));
    if (!blob) { ui.toast("그림을 만들지 못했습니다."); return; }
    const name = fileName(dateKey);
    if (typeof File === "function" && navigator.canShare) {
      const file = new File([blob], name, { type: "image/png" });
      if (navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: name });
          return;
        } catch (e) {
          // 공유 창을 그냥 닫은 것이면 내려받기까지 할 이유가 없다.
          if (e && e.name === "AbortError") return;
        }
      }
    }
    const url = URL.createObjectURL(blob);
    const a = ui.el("a", { href: url, download: name });
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    ui.toast("그림으로 저장했습니다.");
  }

  // 인쇄도 같은 그림을 쓴다. 화면을 그대로 뽑으면 손잡이와 탭까지 찍힌다.
  function print(dateKey) {
    const canvas = draw(dateKey);
    const img = ui.el("img", { src: canvas.toDataURL("image/png"), alt: "일정표" });
    const host = ui.el("div", { class: "print-sheet" }, [img]);
    document.body.appendChild(host);

    let cleaned = false;
    function cleanup() {
      if (cleaned) return;
      cleaned = true;
      host.remove();
      window.removeEventListener("afterprint", cleanup);
    }
    window.addEventListener("afterprint", cleanup);
    // 그림이 붙기 전에 인쇄창이 뜨면 빈 종이가 나온다.
    if (img.complete) setTimeout(() => window.print(), 0);
    else img.onload = () => window.print();
    // afterprint 를 안 보내는 브라우저가 있다. 남은 그림을 뒤에서 치운다.
    setTimeout(cleanup, 60000);
  }

  const api = { draw, rangeOf, fit, fileName, saveImage, print };
  SP.export = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const subjectsApi = SP.subjects;
  const ui = SP.ui;

  // 알림.
  //
  // 솔직하게 말해 둘 것이 있다. 서버가 없으므로 앱을 완전히 닫으면 알림이
  // 울리지 않는다. 정해진 시각에 브라우저를 깨우는 일은 푸시 서버만 할 수
  // 있고, 이 앱은 기기 안에서만 산다. 그래서 여기서 하는 것은 "앱이 열려
  // 있거나 뒤에 내려가 있는 동안" 울리는 것까지다. 그 사실은 설정 화면에
  // 적어 둔다 - 안 울린다고 고장으로 오해하는 편이 더 나쁘다.

  const KINDS = [
    { id: "blockStart", label: "일정 시작할 때", note: "블록이 시작하는 시각에" },
    { id: "blockEnd", label: "일정 끝날 때", note: "다음으로 넘어갈 때" },
    { id: "dayStart", label: "아침에 오늘 계획", note: "하루의 첫 블록 10분 전" },
    { id: "dday", label: "시험·수행평가 전날", note: "저녁 8시에" },
  ];

  const TICK_MS = 30000;      // 30초마다 살핀다. 5분 단위 계획에는 넉넉하다.
  const AHEAD = 10;           // 하루 시작 알림을 몇 분 전에 낼지
  const DDAY_HOUR = 20;

  let timer = null;
  // 같은 것을 두 번 울리지 않는다. 새로고침하면 비므로 그때 한 번은 다시
  // 울릴 수 있는데, 놓치는 것보다는 낫다.
  const fired = new Set();

  function settings() {
    const s = SP.app.state().settings;
    if (!s.notify || typeof s.notify !== "object") s.notify = {};
    return s.notify;
  }

  function enabled(kind) {
    const n = settings();
    if (!n.on) return false;
    return n[kind] !== false; // 켜 두는 것이 기본이다
  }

  function supported() {
    return typeof Notification !== "undefined" && "serviceWorker" in navigator;
  }

  function permission() {
    return supported() ? Notification.permission : "unsupported";
  }

  async function ask() {
    if (!supported()) return "unsupported";
    if (Notification.permission === "granted") return "granted";
    try { return await Notification.requestPermission(); }
    catch (e) { return Notification.permission; }
  }

  // 서비스워커로 띄운다. new Notification 은 앱이 뒤로 내려가면 안 뜨는
  // 브라우저가 있다.
  async function show(title, body, tag) {
    if (permission() !== "granted") return false;
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg && reg.showNotification) {
        await reg.showNotification(title, { body, tag, icon: "./icon-192.png", badge: "./icon-192.png" });
        return true;
      }
      new Notification(title, { body, tag });
      return true;
    } catch (e) { return false; }
  }

  function nowMinutes() {
    const now = new Date();
    let m = now.getHours() * 60 + now.getMinutes();
    if (now.getHours() < dt.DAY_BOUNDARY_HOUR) m += 1440;
    return m;
  }

  function labelOf(block) {
    const subjects = SP.app.state().settings.subjects;
    return [subjectsApi.nameOf(subjects, block.subjectId), block.text].filter(Boolean).join(" · ") || "이름 없음";
  }

  // 지금 이 순간에 울려야 할 것들을 고른다. 화면과 떨어져 있어 시험하기 쉽다.
  //
  // window 는 몇 분 이내를 "지금"으로 볼지다. 30초마다 살피므로 1분이면
  // 놓치지 않는다.
  function due(day, events, todayKey, minutes, window) {
    const w = window === undefined ? 1 : window;
    const out = [];
    const blocks = (day.blocks || []).slice().sort((a, b) => a.start - b.start);

    if (blocks.length && enabled("dayStart")) {
      const first = blocks[0];
      const at = first.start - AHEAD;
      if (minutes >= at && minutes < at + w) {
        out.push({ kind: "dayStart", tag: "dayStart:" + todayKey,
          title: "오늘 계획을 시작할 시간입니다",
          body: dt.minutesToLabel(first.start) + " " + labelOf(first) + " 부터" });
      }
    }

    for (const b of blocks) {
      if (enabled("blockStart") && minutes >= b.start && minutes < b.start + w) {
        out.push({ kind: "blockStart", tag: "start:" + b.id,
          title: labelOf(b),
          body: dt.minutesToLabel(b.start) + "~" + dt.minutesToLabel(b.end) + " 시작" });
      }
      if (enabled("blockEnd") && minutes >= b.end && minutes < b.end + w) {
        const next = blocks.find((x) => x.start >= b.end);
        out.push({ kind: "blockEnd", tag: "end:" + b.id,
          title: labelOf(b) + " 끝",
          body: next ? "다음은 " + dt.minutesToLabel(next.start) + " " + labelOf(next) : "오늘 계획을 다 했습니다" });
      }
    }

    if (enabled("dday") && minutes >= DDAY_HOUR * 60 && minutes < DDAY_HOUR * 60 + w) {
      const tomorrow = dt.addDays(todayKey, 1);
      for (const e of events || []) {
        if (e.startDate !== tomorrow) continue;
        out.push({ kind: "dday", tag: "dday:" + e.id,
          title: "내일 " + e.title, body: "오늘 준비할 것이 남았는지 확인하세요" });
      }
    }
    return out;
  }

  async function tick() {
    if (!settings().on || permission() !== "granted") return;
    const key = SP.app.today();
    const day = SP.app.store().getDay(key);
    for (const item of due(day, SP.app.state().events, key, nowMinutes())) {
      if (fired.has(item.tag)) continue;
      fired.add(item.tag);
      await show(item.title, item.body, item.tag);
    }
  }

  function start() {
    stop();
    if (!settings().on) return;
    timer = setInterval(tick, TICK_MS);
    tick();
  }

  function stop() {
    if (timer) clearInterval(timer);
    timer = null;
  }

  // 설정에서 켜고 끄는 곳. 켤 때만 권한을 묻는다 - 앱을 처음 켜자마자 묻는
  // 것은 대부분 거절당하고, 한 번 거절하면 다시 묻지도 못한다.
  async function setOn(on) {
    const n = settings();
    if (on) {
      const result = await ask();
      if (result !== "granted") {
        n.on = false;
        SP.app.persist();
        ui.toast(result === "denied"
          ? "브라우저에서 알림이 막혀 있습니다. 주소창 옆 자물쇠에서 켜 주세요."
          : "이 브라우저는 알림을 지원하지 않습니다.");
        return false;
      }
    }
    n.on = !!on;
    SP.app.persist();
    if (n.on) start(); else stop();
    return n.on;
  }

  function setKind(kind, on) {
    settings()[kind] = !!on;
    SP.app.persist();
    fired.clear();
  }

  const api = { KINDS, AHEAD, DDAY_HOUR, settings, enabled, supported, permission, ask, show, due, tick, start, stop, setOn, setKind, fired };
  SP.notify = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>

(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;

  //
  // 원래 바라던 것은 폰 잠금화면에 이것이 뜨는 것이었다. 웹페이지는 잠금화면에

  // 세워 두면 잠금화면과 같은 자리에서 같은 일을 한다. 강제력은 없다 -
  // 나가려면 언제든 나갈 수 있고, 그건 웹에서 바꿀 수 없는 사실이다.

  let node = null;
  let timer = null;
  let wakeLock = null;

  function nowMinutes() {
    const now = new Date();
    let m = now.getHours() * 60 + now.getMinutes();
    if (now.getHours() < dt.DAY_BOUNDARY_HOUR) m += 1440;
    return m + now.getSeconds() / 60;
  }

  function labelOf(block) {
    const subjects = SP.app.state().settings.subjects;
    return [subjectsApi.nameOf(subjects, block.subjectId), block.text].filter(Boolean).join(" · ") || "이름 없음";
  }

  // 지금 하는 것과 다음 것. 지금 아무것도 없으면 다음 것만 나온다.
  function pick(blocks, minutes) {
    const sorted = (blocks || []).slice().sort((a, b) => a.start - b.start);
    const current = sorted.find((b) => minutes >= b.start && minutes < b.end) || null;
    const next = sorted.find((b) => b.start > minutes) || null;
    return { current, next };
  }

  function remainText(block, minutes) {
    const left = Math.max(0, Math.ceil(block.end - minutes));
    return dt.formatDuration(left) + " 남음";
  }

  async function keepAwake() {
    // 화면 꺼짐 막기는 되는 곳에서만 한다. 안 되는 브라우저에서 터지면 안 된다.
    if (!navigator.wakeLock) return;
    try { wakeLock = await navigator.wakeLock.request("screen"); }
    catch (e) { wakeLock = null; }
  }

  function releaseAwake() {
    if (wakeLock) { try { wakeLock.release(); } catch (e) { /* 이미 풀렸다 */ } }
    wakeLock = null;
