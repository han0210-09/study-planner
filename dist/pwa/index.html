  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const subjectsApi = SP.subjects;
  const ui = SP.ui;

  const LONG_PRESS_MS = 450;
  const MOVE_TOLERANCE = 8;

  function openEditor(dateKey, todoId, onDone) {
    const state = SP.app.state();
    const day = SP.app.store().getDay(dateKey);
    const existing = todoId ? day.todos.find((t) => t.id === todoId) : null;

    // 과목은 안 골라도 된다. 비워두면 이름표 없는 할 일이 되고, 그래도 체크는
    // 할 수 있다. 여기서 바로 새 과목을 만들 수도 있다.
    const subject = subjectsApi.subjectField(state, existing ? existing.subjectId : null);
    const input = ui.el("input", { type: "text", value: existing ? existing.text : "", placeholder: "할 일을 입력하세요", maxlength: "80" });

    // 배정된 시간을 목록으로 다룬다. 저장 전까지는 여기서만 사는 사본이다.
    const own = SP.link.blocksOfTodo(day, todoId);
    const slots = own.map((b) => ({ id: b.id, start: b.start, end: b.end }));
    let active = slots.length ? 0 : -1;
    let labels = [];

    const listHost = ui.el("div", { class: "slot-list" });

    // 겹침을 볼 때는 다른 할 일의 블록에 더해, 아직 저장 안 된 이 목록의 다른
    // 줄도 함께 봐야 한다. 안 그러면 한 할 일 안에서 시간이 겹친 채 저장된다.
    function others(exceptIndex) {
      const list = day.blocks.filter((b) => b.todoId !== todoId);
      slots.forEach((s, i) => {
        if (i !== exceptIndex) list.push({ id: "slot" + i, start: s.start, end: s.end });
      });
      return list;
    }

    function paint(i) {
      const s = slots[i];
      labels[i].range.textContent = dt.minutesToLabel(s.start) + " ~ " + dt.minutesToLabel(s.end);
      labels[i].dur.textContent = dt.formatDuration(s.end - s.start);
    }

    function nudge(i, which, delta) {
      const s = slots[i];
      const nextStart = which === "start" ? dt.clampToDay(s.start + delta) : s.start;
      const nextEnd = which === "end" ? dt.clampToDay(s.end + delta) : s.end;
      if (nextEnd - nextStart < dt.SLOT) { ui.toast("시간은 최소 5분이어야 합니다."); return; }
      if (storeApi.findOverlap(others(i), { id: "__probe__", start: nextStart, end: nextEnd })) {
        ui.toast("다른 블록과 겹칩니다."); return;
      }
      s.start = nextStart; s.end = nextEnd;
      // 목록 전체를 다시 그리지 않는다. ±5분을 연타하는 동안 버튼이 갈리면
      // 탭이 떨어져 나간다.
      paint(i);
    }

    const stepper = (label, i, which) =>
      ui.el("div", { class: "stepper slot-step" }, [
        ui.el("span", { class: "stepper-label", text: label }),
        ui.el("button", { class: "btn stepper-btn", type: "button", text: "−5분", onclick: () => nudge(i, which, -dt.SLOT) }),
        ui.el("button", { class: "btn stepper-btn", type: "button", text: "+5분", onclick: () => nudge(i, which, dt.SLOT) }),
      ]);

    function addSlot() {
      const found = SP.link.firstFreeSlot(others(-1), 60);
      if (!found) { ui.toast("빈 시간이 없습니다."); return; }
      slots.push({ start: found.start, end: found.end });
      active = slots.length - 1;
      renderSlots();
    }

    function renderSlots() {
      ui.clear(listHost);
      labels = [];
      if (slots.length === 0) {
        listHost.appendChild(ui.el("p", { class: "empty", text: "배정된 시간이 없습니다." }));
      }
      slots.forEach((slot, i) => {
        const range = ui.el("span", { class: "slot-range" });
        const dur = ui.el("span", { class: "slot-dur" });
        labels[i] = { range, dur };
        listHost.appendChild(ui.el("div", { class: "slot" + (i === active ? " slot-on" : "") }, [
          ui.el("button", {
            class: "slot-head", type: "button",
            onclick: () => { active = active === i ? -1 : i; renderSlots(); },
          }, [range, dur]),
          ui.el("button", {
            class: "icon-btn slot-del", type: "button", text: "✕", "aria-label": "이 시간 빼기",
            onclick: () => {
              slots.splice(i, 1);
              if (active >= slots.length) active = slots.length - 1;
              renderSlots();
            },
          }),
        ]));
        paint(i);
        if (i === active) {
          listHost.appendChild(stepper("시작", i, "start"));
          listHost.appendChild(stepper("종료", i, "end"));
        }
      });
      listHost.appendChild(ui.el("button", { class: "btn add-btn", type: "button", text: "+ 시간 추가", onclick: addSlot }));
    }

    renderSlots();

    const save = () => {
      const text = input.value.trim();
      if (!text) { ui.toast("할 일을 입력하세요."); return; }
      const todo = existing
        ? { ...existing, subjectId: subject.value || null, text }
        : { id: storeApi.newId(), subjectId: subject.value || null, text, done: false };
      SP.app.saveDay(dateKey, SP.link.commitTodo(SP.app.store().getDay(dateKey), todo, slots));
      ui.closeSheet();
      onDone();
    };

    const remove = async () => {
      if (own.length > 0) {
        const ok = await ui.confirmDialog(
          "타임테이블에 배정된 " + own.length + "개 블록도 함께 지워집니다."
        );
        if (!ok) return;
      }
      SP.app.saveDay(dateKey, SP.link.removeTodo(SP.app.store().getDay(dateKey), todoId));
      ui.closeSheet();
      onDone();
    };

    ui.openSheet({
      title: existing ? "할 일 수정" : "할 일 추가",
      body: [
        ui.el("div", { class: "field" }, [ui.el("span", { text: "과목 (선택)" }), subject.node]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "할 일" }), input]),
        ui.el("p", { class: "sheet-sub", text: "배정된 시간" }),
        listHost,
      ],
      actions: [
        existing
          ? ui.el("button", { class: "btn btn-danger", text: "삭제", onclick: remove })
          : ui.el("button", { class: "btn btn-ghost", text: "취소", onclick: ui.closeSheet }),
        ui.el("button", { class: "btn btn-primary", text: "저장", onclick: save }),
      ],
    });
    setTimeout(() => input.focus(), 50);
  }

  // 목록의 한 줄은 블록 하나다. 한 할 일을 아침·저녁으로 나눠 잡았으면 두 줄이
  // 되고, 각자 자기 시각 자리에 놓인다. 예전처럼 "2개 배정"으로 뭉치면 언제
  // 하는 일인지 목록만 봐서는 알 수 없다.
  //
  // 아직 시간을 안 잡은 할 일은 비교할 시각이 없으므로 맨 아래로 모은다.
  function rowsOf(day) {
    const rows = [];
    for (const block of day.blocks) {
      const todo = day.todos.find((t) => t.id === block.todoId);
      if (!todo) continue;
      const own = day.blocks.filter((b) => b.todoId === todo.id).sort((a, b) => a.start - b.start);
      rows.push({
        key: block.id, todo, block,
        nth: own.findIndex((b) => b.id === block.id) + 1,
        of: own.length,
      });
    }
    rows.sort((a, b) => a.block.start - b.block.start);
    for (const todo of day.todos) {
      if (!day.blocks.some((b) => b.todoId === todo.id)) {
        rows.push({ key: todo.id, todo, block: null, nth: 1, of: 1 });
      }
    }
    return rows;
  }

  // 길게 눌러 지우는 길은 실수로 눌리기 쉽다. 그래서 한 번 묻는다.
  //
  // 줄이 블록 하나이므로 지우는 것도 그 블록 하나다. 그 할 일의 마지막 블록일
  // 때만 할 일까지 사라진다 - removeBlock 이 이미 그렇게 한다.
  async function confirmRemove(dateKey, row, onChange) {
    const what = row.of > 1
      ? "'" + row.todo.text + "' 의 " + dt.minutesToLabel(row.block.start) + " 시간만 지웁니다."
      : "'" + row.todo.text + "' 을(를) 지웁니다." + (row.block ? "\n타임테이블에서도 사라집니다." : "");
    if (!(await ui.confirmDialog(what))) return;
    const day = SP.app.store().getDay(dateKey);
    SP.app.saveDay(dateKey, row.block
      ? SP.link.removeBlock(day, row.block.id)
      : SP.link.removeTodo(day, row.todo.id));
    onChange();
  }

  function openRow(dateKey, row, onChange) {
    // 줄이 블록이면 그 블록을 연다. 시간이 없는 할 일만 할 일 시트로 간다.
    if (row.block) SP.timetable.openBlockEditor(dateKey, row.block.id, onChange);
    else openEditor(dateKey, row.todo.id, onChange);
  }

  // 체크박스와 순서 열은 제스처에서 뺀다. 체크는 이 화면에서 가장 자주 누르는
  // 곳이라, 손이 잠깐 머무는 것만으로 삭제를 묻는 창이 뜨면 쓰기 어려워진다.
  function inControls(target) {
    return !!target.closest(".todo-check-hit");
  }

  // 짧게 누르면 편집, 길게 누르면 삭제. touch-action 은 건드리지 않는다 — 세로
  // 스크롤을 막을 이유가 없고, 손가락이 움직이면 브라우저가 스크롤을 가져가면서
  // pointercancel 을 보내 타이머가 접힌다.
  function attachRowGestures(node, dateKey, row, onChange) {
    let timer = null;
    let startX = 0;
    let startY = 0;
    let fired = false;
    let moved = false;
    let armed = false;

    const cancel = () => { clearTimeout(timer); timer = null; };

    node.addEventListener("pointerdown", (e) => {
      fired = false;
      moved = false;
      armed = !inControls(e.target);
      if (!armed) return;
      startX = e.clientX;
      startY = e.clientY;
      timer = setTimeout(() => { fired = true; confirmRemove(dateKey, row, onChange); }, LONG_PRESS_MS);
    });
    node.addEventListener("pointermove", (e) => {
      if (moved || !armed) return;
      if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE) {
        moved = true;
        cancel();
      }
    });
    node.addEventListener("pointerup", () => {
      cancel();
      if (!armed || fired || moved) return;
      openRow(dateKey, row, onChange);
    });
    node.addEventListener("pointercancel", cancel);
    node.addEventListener("pointerleave", cancel);
    // 길게 누를 때 뜨는 운영체제의 텍스트 선택 메뉴를 막는다.
    node.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  function toggle(dateKey, row, checked, onChange) {
    const day = SP.app.store().getDay(dateKey);
    SP.app.saveDay(dateKey, row.block
      ? SP.link.setBlockDone(day, row.block.id, checked)
      : SP.link.setTodoDone(day, row.todo.id, checked));
    onChange();
  }

  function rowNode(dateKey, row, subjects, onChange) {
    const done = row.block ? row.block.done : row.todo.done;
    const when = row.block
      ? dt.minutesToLabel(row.block.start) + "~" + dt.minutesToLabel(row.block.end)
      : "미배정";

    const title = ui.el("span", { class: "todo-title", text: row.todo.text });
    // 같은 할 일이 여러 번 나뉘어 있을 때만 회차를 붙인다. 한 번뿐인데 1/1 이
    // 붙으면 읽을 것만 늘어난다.
    const nth = row.of > 1
      ? ui.el("span", { class: "todo-nth", text: row.nth + "/" + row.of })
      : null;

    // 과목을 안 고른 할 일이 흔해졌으므로, 없을 때는 이름표 자체를 뺀다.
    // "-" 만 든 색 딱지가 줄마다 붙으면 읽을 것만 늘어난다.
    //
    // 이름표는 제목과 한 줄에 둔다. 예전처럼 자기 열을 차지하면, 이름표가 없는
    // 줄에서 그 열이 비어 체크 열이 8px 씩 어긋난다.
    const tag = row.todo.subjectId
      ? ui.el("span", {
          class: "todo-tag",
          text: subjectsApi.nameOf(subjects, row.todo.subjectId),
          style: { background: subjectsApi.colorOf(subjects, row.todo.subjectId) },
        })
      : null;

    const node = ui.el("li", { class: "todo-row" + (done ? " todo-done" : "") }, [
      ui.el("button", { class: "todo-text", type: "button",
        // 손가락으로 누르는 건 줄 전체의 제스처가 처리한다(짧게 편집, 길게 삭제).
        // 여기 click 은 키보드로 Enter 를 눌렀을 때만 남는다 — 그때는 detail 이 0 이다.
        onclick: (e) => { if (e.detail === 0) openRow(dateKey, row, onChange); } }, [
        ui.el("span", { class: "todo-head" }, [tag, title, nth]),
        ui.el("span", { class: "todo-when" + (row.block ? "" : " todo-when-none"), text: when }),
      ]),
      // 과목이 없으면 완료를 매기지 않는다. 공부 시간에도 달성률에도 안 들어가는
      // 시간이라 체크할 대상이 없다. 할 일 자체는 과목 없이도 목록에 남는다 -
      // 안 보이는 것과 못 체크하는 것은 다르다.
      //
      // 빈 칸은 남겨 열이 어긋나지 않게 한다.
      storeApi.isStudy(row.todo)
        ? ui.el("label", { class: "todo-check-hit" }, [
            ui.el("input", {
              type: "checkbox", class: "todo-check", "aria-label": "완료", checked: done,
              onchange: (e) => toggle(dateKey, row, e.target.checked, onChange),
            }),
          ])
        : ui.el("div", { class: "todo-check-hit", "aria-hidden": "true" }),
    ]);
    attachRowGestures(node, dateKey, row, onChange);
    return node;
  }

  function render(host, dateKey, onChange) {
    const subjects = SP.app.state().settings.subjects;
    const day = SP.app.store().getDay(dateKey);
    const rows = rowsOf(day);

    ui.clear(host).appendChild(
      // 제목은 탭이 대신한다(타임테이블 쪽과 같은 이유).
      ui.el("section", { class: "card" }, [
        rows.length
          ? ui.el("ul", { class: "todo-list" }, rows.map((r) => rowNode(dateKey, r, subjects, onChange)))
          : ui.el("p", { class: "empty", text: "할 일이 없습니다." }),
        ui.el("button", { class: "btn add-btn", text: "+ 할 일 추가", onclick: () => openEditor(dateKey, null, onChange) }),
      ])
    );
  }

  const api = { render, openEditor, rowsOf };
  SP.todos = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>
  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const subjectsApi = SP.subjects;
  const grid = SP.grid;
  const ui = SP.ui;

  // 손가락이 이만큼 움직이면 "가만히 누르고 있는 것"이 아니다.
  const MOVE_TOLERANCE = 8;
  // 이름과 시각을 어떻게 앉힐지 가르는 경계. 한 시간이 --tt-hour 이므로 이
  // 값이 곧 "몇 px 인가" 이다. 180px/시간 기준으로 35분≈105px, 15분≈45px.
  const TIGHT_MINUTES = 35;
  // 이보다 짧으면 시각을 떼고 이름만 남긴다. 두 줄은커녕 한 줄도 빠듯하다.
  const MICRO_MINUTES = 15;
  // 꾹 누르는 시간. 달력·To-Do 의 길게 누르기와 같은 값이라 앱 전체에서
  // "꾹 누르기"의 느낌이 하나로 맞는다.
  const LIFT_MS = 450;
  // 꾹 눌러 만들기 시작할 때의 기본 길이. 그대로 끌면 바뀐다.
  const NEW_MINUTES = 60;
  // 이보다 짧은 블록에는 ✓ 를 넣지 않는다. 손잡이 둘과 ✓ 를 다 넣으면 서로
  // 밀려 아무것도 제대로 눌리지 않는다. 완료는 편집 시트에서도 바꿀 수 있지만,
  // 손잡이는 이 블록을 늘리는 유일한 길이다.

  // .tt-cells 의 세로 길이가 곧 하루다. 시각 라벨을 같은 상자에 넣지 않고 옆에
  // 따로 둔 이유가 이것 — 라벨 높이를 빼는 보정이 필요 없어진다.
  function pointToMinutes(clientY, cellsEl) {
    const r = cellsEl.getBoundingClientRect();
    return grid.minutesAt((clientY - r.top) / r.height);
  }

  function placeStyle(start, end) {
    return { top: grid.offsetPercent(start) + "%", height: grid.spanPercent(start, end) + "%" };
  }

  function blocksOf(dateKey) {
    return SP.app.store().getDay(dateKey).blocks;
  }

  function saveBlocks(dateKey, blocks) {
    SP.app.store().setDay(dateKey, { blocks: blocks.slice().sort((a, b) => a.start - b.start) });
    SP.app.persist();
  }

  function openBlockEditor(dateKey, blockId, onChange, isNew) {
    const state = SP.app.state();
    const day = SP.app.store().getDay(dateKey);
    const blocks = day.blocks;
    const block = blocks.find((b) => b.id === blockId);
    if (!block) return;

    let start = block.start;
    let end = block.end;

    const rangeLabel = ui.el("strong", { text: dt.minutesToLabel(start) + " ~ " + dt.minutesToLabel(end) });
    const durationLabel = ui.el("span", { class: "editor-duration", text: dt.formatDuration(end - start) });

    function redraw() {
      rangeLabel.textContent = dt.minutesToLabel(start) + " ~ " + dt.minutesToLabel(end);
      durationLabel.textContent = dt.formatDuration(end - start);
    }

    function nudge(which, delta) {
      const next = { ...block, start, end };
      if (which === "start") next.start = dt.clampToDay(start + delta);
      else next.end = dt.clampToDay(end + delta);
      if (next.end - next.start < dt.SLOT) { ui.toast("블록은 최소 5분이어야 합니다."); return; }
      if (storeApi.findOverlap(blocks, next, blockId)) { ui.toast("다른 블록과 겹칩니다."); return; }
      start = next.start; end = next.end;
      redraw();
    }

    const stepper = (label, which) =>
      ui.el("div", { class: "stepper" }, [
        ui.el("span", { class: "stepper-label", text: label }),
        ui.el("button", { class: "btn stepper-btn", text: "−5분", onclick: () => nudge(which, -dt.SLOT) }),
        ui.el("button", { class: "btn stepper-btn", text: "+5분", onclick: () => nudge(which, dt.SLOT) }),
      ]);

    const subject = subjectsApi.subjectField(state, block.subjectId);
    const textInput = ui.el("input", { type: "text", value: block.text, placeholder: "무엇을 공부하나요?", maxlength: "40" });
    // 트랙 위의 ✓ 와 같은 것을 여기서도 바꿀 수 있게 둔다.
    const doneInput = ui.el("input", { type: "checkbox", checked: block.done });

    // 이 날짜에 등록된 할 일만 보여준다. 다른 날 것까지 섞이면 목록이 끝없이
    // 길어지고, 오늘 계획에 없는 것을 잘못 고르기 쉽다. 예전 것은 아래 사전에서 꺼낸다.
    //
    // 이름이 같으면 하나로 친다. 같은 이름이 두 줄로 나오면 어느 쪽을 골라도
    // 결과가 같은데 고민만 하게 된다.
    const dayTodos = [];
    const seenText = new Set();
    for (const t of day.todos) {
      const key = SP.dict.normalize(t.text);
      if (!key || seenText.has(key)) continue;
      seenText.add(key);
      dayTodos.push(t);
    }

    // 이 블록이 가리키던 할 일이 같은 이름 때문에 접혔으면 남은 쪽을 고른다.
    // 그러지 않으면 아무것도 선택 안 된 채로 열려서, 저장할 때 연결이 끊긴다.
    const linked = day.todos.find((t) => t.id === block.todoId);
    const canonical = linked
      ? (dayTodos.find((t) => SP.dict.normalize(t.text) === SP.dict.normalize(linked.text)) || linked)
      : null;
    // 새 블록은 할 일을 함께 만드는 게 기본이다. 이미 있는 블록은 지금 상태가 기본.
    const initialChoice = (canonical && canonical.id) || (isNew ? "new" : "none");

    // 사전은 맨 끝에 붙인다. 오늘 계획에 없는 것을 여기서 꺼내 쓴다. 이미 오늘
    // 목록에 있는 이름은 사전 쪽에서 뺀다 — 같은 것이 위아래로 두 번 나온다.
    const DICT_PREFIX = "␀dict:";
    const dictOptions = [];
    for (const bucket of SP.dict.grouped(state)) {
      const items = bucket.items.filter((e) => !seenText.has(e.text));
      if (items.length === 0) continue;
      dictOptions.push(ui.el("optgroup", { label: "사전 · " + (bucket.group ? bucket.group.name : "분류 없음") },
        items.map((e) => ui.el("option", {
          value: DICT_PREFIX + e.text,
          text: e.text + " (" + (subjectsApi.nameOf(state.settings.subjects, e.subjectId) || "과목 없음") + " · " + e.count + "회)",
        }))));
    }

    const todoSelect = ui.el("select", { class: "subject-select" }, [
      ui.el("optgroup", { label: "오늘 계획" }, [
        ui.el("option", { value: "new", text: "＋ 새 할 일로 추가", selected: initialChoice === "new" }),
        ...dayTodos.map((t) =>
          ui.el("option", { value: t.id, text: t.text, selected: initialChoice === t.id })),
        ui.el("option", { value: "none", text: "할 일과 연결 안 함", selected: initialChoice === "none" }),
      ]),
      ...dictOptions,
    ]);

    // 고른 순간 과목·내용을 그 값으로 맞춘다. 저장할 때는 화면에 보이는 값이
    // 양쪽에 쓰이므로, 고른 즉시 보여줘야 무엇이 저장될지 알 수 있다.
    todoSelect.addEventListener("change", () => {
      const value = todoSelect.value;
      if (value.indexOf(DICT_PREFIX) === 0) {
        // 사전에서 꺼낸 것은 오늘 계획에 없던 할 일이다. 이름과 과목만 채우고
        // 새 할 일로 되돌린다 — 저장하면 오늘 계획에 새로 생긴다.
        const text = value.slice(DICT_PREFIX.length);
        const entry = SP.dict.findEntry(state, text);
        textInput.value = text;
        if (entry && entry.subjectId) subject.value = entry.subjectId;
        todoSelect.value = "new";
        return;
      }
      const picked = dayTodos.find((t) => t.id === value);
      if (!picked) return;
      textInput.value = picked.text;
      subject.value = picked.subjectId || "";
    });

    ui.openSheet({
      title: "시간 블록",
      body: [
        ui.el("div", { class: "editor-range" }, [rangeLabel, durationLabel]),
        stepper("시작", "start"),
        stepper("종료", "end"),
        ui.el("div", { class: "field" }, [ui.el("span", { text: "과목 (선택)" }), subject.node]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "내용" }), textInput]),
        ui.el("label", { class: "field" }, [ui.el("span", { text: "할 일" }), todoSelect]),
        ui.el("label", { class: "editor-done" }, [doneInput, ui.el("span", { text: "이 시간 공부 완료" })]),
      ],
      actions: [
        ui.el("button", { class: "btn btn-danger", text: "삭제", onclick: () => {
          // 연결된 할 일도 함께 사라진다(그 할 일의 마지막 블록일 때만).
          SP.app.saveDay(dateKey, SP.link.removeBlock(SP.app.store().getDay(dateKey), blockId));
          ui.closeSheet(); onChange();
        } }),
        ui.el("button", { class: "btn btn-primary", text: "저장", onclick: () => {
          const next = { ...block, start, end, subjectId: subject.value || null,
            text: textInput.value.trim(), done: doneInput.checked };
          const check = storeApi.validateBlock(next);
          if (!check.ok) { ui.toast(check.error); return; }
          if (storeApi.findOverlap(blocks, next, blockId)) { ui.toast("다른 블록과 겹칩니다."); return; }
          // 빈 할 일이 생기지 않게 하되 새 검증 규칙은 만들지 않는다.
          const todoText = next.text || subjectsApi.nameOf(state.settings.subjects, next.subjectId) || "이름 없음";
          SP.app.saveDay(dateKey,
            SP.link.commitBlock(SP.app.store().getDay(dateKey), next, todoSelect.value, todoText));
          ui.closeSheet(); onChange();
        } }),
      ],
    });
  }

  // 새로 만든 블록의 편집 시트를 취소로 닫으면 그 빈 블록을 되돌린다.
  function openBlockEditorOrRollback(dateKey, blockId, onChange) {
    const before = blocksOf(dateKey).find((b) => b.id === blockId);
    let committed = false;
    openBlockEditor(dateKey, blockId, () => { committed = true; onChange(); }, true);
    const host = document.getElementById("sheet-root");
    const observer = new MutationObserver(() => {
      if (host.childElementCount === 0) {
        observer.disconnect();
        if (!committed && before && !before.text && !before.subjectId) {
          saveBlocks(dateKey, blocksOf(dateKey).filter((b) => b.id !== blockId));
          onChange();
        }
      }
    });
    observer.observe(host, { childList: true });
  }

  function toggleDone(dateKey, block, onChange) {
    SP.app.saveDay(dateKey, SP.link.setBlockDone(SP.app.store().getDay(dateKey), block.id, !block.done));
    onChange();
  }

  function createBlock(dateKey, start, end, onChange) {
    const candidate = { id: storeApi.newId(), subjectId: null, text: "", start, end, done: false, todoId: null };
    const check = storeApi.validateBlock(candidate);
    if (!check.ok) { ui.toast(check.error); return; }
    if (storeApi.findOverlap(blocksOf(dateKey), candidate)) { ui.toast("다른 블록과 겹칩니다."); return; }
    saveBlocks(dateKey, blocksOf(dateKey).concat([candidate]));
    onChange();
    openBlockEditorOrRollback(dateKey, candidate.id, onChange);
  }

  /* ---------- 미리보기 ---------- */

  // 손을 떼면 어떻게 되는지 그대로 그린다. 맞닿은 두 블록을 함께 움직일 때는
  // 둘 다 나와야 결과를 알 수 있다 - 늘어난 쪽만 보이면 옆이 얼마나 줄었는지
  // 모른다.
  //
  // range 는 { start, end, color, was } 다. was 는 원래 길이로, 있으면 얼마나
  // 늘고 줄었는지를 함께 적는다.
  function drawGhosts(cells, nodes, ranges) {
    for (const n of nodes) n.remove();
    nodes.length = 0;
    for (const r of ranges) {
      const node = ui.el("div", {
        class: "tt-ghost",
        style: Object.assign(placeStyle(r.start, r.end), r.color ? { background: r.color } : {}),
      }, [
        ui.el("span", { class: "tt-ghost-label", text: dt.minutesToLabel(r.start) + " ~ " + dt.minutesToLabel(r.end) }),
        ui.el("span", { class: "tt-ghost-sub", text: durationNote(r) }),
      ]);
      nodes.push(node);
      cells.appendChild(node);
    }
  }

  function durationNote(r) {
    const length = dt.formatDuration(r.end - r.start);
    if (r.was == null || r.was === r.end - r.start) return length;
    const delta = r.end - r.start - r.was;
    return length + " (" + (delta > 0 ? "+" : "−") + dt.formatDuration(Math.abs(delta)) + ")";
  }

  function drawGhost(cells, nodes, start, end, extra) {
    drawGhosts(cells, nodes, [Object.assign({ start, end }, extra || {})]);
  }

  // 바뀌는 블록은 흐려 둔다. 원래 자리가 그대로 진하면 미리보기와 겹쳐 보여서
  // 어느 쪽이 결과인지 알 수 없다.
  function dim(cells, ids, on) {
    for (const id of ids) {
      const node = cells.querySelector('.tt-seg[data-id="' + id + '"]');
      if (node) node.classList.toggle("tt-seg-lifted", on);
    }
  }

  /* ---------- 빈 칸을 꾹 눌러 만들기 ---------- */

  // 세로 시간표에서는 아래로 끄는 것이 곧 화면 스크롤이다. 그래서 곧바로 끌어
  // 만들 수 없다 - 꾹 눌러 "이건 스크롤이 아니다"를 먼저 밝힌다.
  //
  // 손가락을 대고 가만히 있는 동안 브라우저는 아직 스크롤을 시작하지 않는다.
  // 그 사이에 touchmove 를 preventDefault 하면 스크롤을 넘겨주지 않고 우리가
  // 끌 수 있다. touch-action: none 으로 막는 방법도 있지만, 그러면 시간표 위에
  // 손가락을 얹은 채 화면을 굴리는 것 자체가 안 된다.
  function attachCreate(cells, dateKey, onChange) {
    let timer = null;
    let armed = false;
    let live = false;
    let anchor = 0;
    let startX = 0;
    let startY = 0;
    let pointerId = null;
    let range = null;
    const ghost = [];

    const cancelTimer = () => { clearTimeout(timer); timer = null; };

    function rangeAt(cursorMin) {
      const args = grid.selectionArgs(anchor, cursorMin);
      const limited = storeApi.limitRange(blocksOf(dateKey), args.anchor, args.cursor);
      return { start: limited.start, end: Math.max(limited.start + dt.SLOT, limited.end) };
    }

    function begin() {
      live = true;
      cells.style.touchAction = "none";
      try { cells.setPointerCapture(pointerId); } catch (err) { /* 이미 놓친 포인터 */ }
      // 꾹 누른 자리에서 한 시간짜리로 시작한다. 아무 반응이 없으면 잡혔는지 알 수 없다.
      range = rangeAt(Math.min(anchor + NEW_MINUTES - dt.SLOT, dt.DAY_END - dt.SLOT));
      drawGhost(cells, ghost, range.start, range.end);
    }

    function cleanup() {
      cancelTimer();
      for (const n of ghost) n.remove();
      ghost.length = 0;
      if (live && pointerId != null && cells.hasPointerCapture(pointerId)) {
        cells.releasePointerCapture(pointerId);
      }
      cells.style.touchAction = "";
      armed = false; live = false; pointerId = null; range = null;
    }

    cells.addEventListener("pointerdown", (e) => {
      if (e.target.closest(".tt-seg")) return;
      pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      anchor = pointToMinutes(e.clientY, cells);
      armed = true; live = false;
      timer = setTimeout(begin, LIFT_MS);
    });

    cells.addEventListener("pointermove", (e) => {
      if (!live) {
        // 아직 안 잡혔는데 손가락이 움직였다면 스크롤이나 화면 넘기기다.
        if (!armed) return;
        if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE) {
          armed = false;
          cancelTimer();
        }
        return;
      }
      e.preventDefault();
      range = rangeAt(pointToMinutes(e.clientY, cells));
      drawGhost(cells, ghost, range.start, range.end);
    });

    // 잡고 있는 동안 브라우저가 화면을 굴리지 못하게 막는다. passive: false
    // 여야 preventDefault 가 먹는다.
    cells.addEventListener("touchmove", (e) => { if (live) e.preventDefault(); }, { passive: false });

    cells.addEventListener("pointerup", () => {
      if (!live) { cleanup(); return; }
      const made = range;
      cleanup();
      if (made) createBlock(dateKey, made.start, made.end, onChange);
    });

    cells.addEventListener("pointercancel", cleanup);
    cells.addEventListener("contextmenu", (e) => { if (armed || live) e.preventDefault(); });
  }

  /* ---------- 손잡이로 길이 바꾸기 ---------- */

  // 맞닿은 블록이 있으면 그 경계를 함께 움직인다 — 한쪽이 늘면 다른 쪽이 그만큼
  // 줄어든다. 그 경계에는 손잡이도 하나뿐이다(blockNode 참고).
  //
  // 끄는 동안 바뀌는 블록은 흐려지고 그 위에 결과가 그려진다. 손을 떼기 전에
  // 무엇이 어떻게 되는지 다 보인다.
  //
  // 손잡이에는 touch-action: none 을 준다. 얇아서 화면 스크롤을 가로막지
  // 않으면서, 잡으면 곧바로 우리 제스처가 된다.
  function attachResize(handle, dateKey, blockId, edge, onChange) {
    handle.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
      const cells = handle.closest(".tt-cells");
      const subjects = SP.app.state().settings.subjects;
      const block = blocksOf(dateKey).find((b) => b.id === blockId);
      if (!cells || !block) return;

      handle.setPointerCapture(e.pointerId);
      handle.classList.add("tt-handle-on");
      const ghost = [];
      const dimmed = [];
      let next = null;
      let moved = false;

      function onMove(ev) {
        ev.preventDefault();
        moved = true;
        // 끝 쪽은 커서가 놓인 칸까지 포함해야 한다. 시작 쪽은 그 칸의 앞이 경계다.
        const t = pointToMinutes(ev.clientY, cells) + (edge === "end" ? dt.SLOT : 0);
        const before = blocksOf(dateKey);
        const r = grid.resizeAt(before, block, edge, t);
        if (!r) return;
        next = r;
        dim(cells, dimmed, false);
        dimmed.length = 0;
        for (const b of r.blocks) dimmed.push(b.id);
        dim(cells, dimmed, true);
        drawGhosts(cells, ghost, r.blocks.map((b) => {
          const was = before.find((x) => x.id === b.id);
          return {
            start: b.start, end: b.end,
            color: subjectsApi.colorOf(subjects, b.subjectId),
            was: was ? was.end - was.start : null,
          };
        }));
      }

      function onUp() {
        handle.removeEventListener("pointermove", onMove);
        handle.removeEventListener("pointerup", onUp);
        handle.removeEventListener("pointercancel", onUp);
        for (const n of ghost) n.remove();
        dim(cells, dimmed, false);
        handle.classList.remove("tt-handle-on");
        // 손잡이를 그냥 톡 누른 것도 그 블록을 누른 것이다.
        if (!moved) { openBlockEditor(dateKey, blockId, onChange); return; }
        if (!next) { onChange(); return; }
        const bad = next.blocks.some((b) => !storeApi.validateBlock(b).ok);
        if (bad) { ui.toast("여기까지는 줄일 수 없습니다."); onChange(); return; }
        const byId = new Map(next.blocks.map((b) => [b.id, b]));
        saveBlocks(dateKey, blocksOf(dateKey).map((b) => {
          const hit = byId.get(b.id);
          return hit ? { ...b, start: hit.start, end: hit.end } : b;
        }));
        onChange();
      }

      handle.addEventListener("pointermove", onMove);
      handle.addEventListener("pointerup", onUp);
      handle.addEventListener("pointercancel", onUp);
    });
  }

  /* ---------- 꾹 눌러 블록 옮기기 ---------- */

  // 곧바로 끌 수 있게 하면 "옮기려는 것"과 "화면을 굴리려는 것"을 가를 수가
  // 없다. 꾹 누르는 것은 다른 동작과 겹치지 않는다. 빈 칸에서 새로 만드는 것과
  // 같은 방식이다.
  function attachMove(node, dateKey, block, onChange) {
    let lifted = false;
    let timer = null;
    let moved = false;
    let pointerId = null;
    let cells = null;
    let offset = 0;
    let startX = 0;
    let startY = 0;
    let placed = null;
    let tapCheck = false;
    const ghost = [];
    const duration = block.end - block.start;

    const cancelTimer = () => { clearTimeout(timer); timer = null; };

    function moveTo(cursorMin) {
      const start = Math.max(dt.DAY_START, Math.min(cursorMin - offset, dt.DAY_END - duration));
      const candidate = { id: block.id, start, end: start + duration };
      // 겹치면 옮기지 않는다. 마지막으로 유효했던 자리를 그대로 둔다.
      if (storeApi.findOverlap(blocksOf(dateKey), candidate, block.id)) return;
      placed = candidate;
      drawGhost(cells, ghost, candidate.start, candidate.end, {
        color: subjectsApi.colorOf(SP.app.state().settings.subjects, block.subjectId),
      });
    }

    function lift(atMin) {
      lifted = true;
      cells.style.touchAction = "none";
      try { node.setPointerCapture(pointerId); } catch (err) { /* 이미 놓친 포인터 */ }
      node.classList.add("tt-seg-lifted");
      // 든 순간 바로 그림자를 보여준다. 아무 반응이 없으면 들렸는지 알 수 없다.
      moveTo(atMin);
    }

    function cleanup() {
      cancelTimer();
      for (const n of ghost) n.remove();
      ghost.length = 0;
      node.classList.remove("tt-seg-lifted");
      if (cells) cells.style.touchAction = "";
      if (lifted && pointerId != null && node.hasPointerCapture(pointerId)) {
        node.releasePointerCapture(pointerId);
      }
      lifted = false; moved = false; pointerId = null; placed = null;
    }

    node.addEventListener("pointerdown", (e) => {
      // 손잡이는 길이 조절이 맡는다.
      if (e.target.closest(".tt-handle")) return;
      cells = node.closest(".tt-cells");
      if (!cells) return;
      pointerId = e.pointerId;
      startX = e.clientX; startY = e.clientY;
      const at = pointToMinutes(e.clientY, cells);
      offset = at - block.start;
      lifted = false; moved = false; placed = null;
      tapCheck = !!e.target.closest(".tt-check");
      timer = setTimeout(() => lift(at), LIFT_MS);
    });

    node.addEventListener("pointermove", (e) => {
      if (!lifted) {
        // 아직 안 들었는데 손가락이 움직였다면 스크롤이나 화면 넘기기다.
        if (pointerId === null || moved) return;
        if (Math.abs(e.clientX - startX) > MOVE_TOLERANCE || Math.abs(e.clientY - startY) > MOVE_TOLERANCE) {
          moved = true;
          cancelTimer();
        }
        return;
      }
      e.preventDefault();
      moveTo(pointToMinutes(e.clientY, cells));
    });

    // 들고 있는 동안 브라우저가 화면을 굴리지 못하게 막는다.
    node.addEventListener("touchmove", (e) => { if (lifted) e.preventDefault(); }, { passive: false });

    node.addEventListener("pointerup", () => {
      cancelTimer();
      if (!lifted) {
        const tap = !moved && pointerId !== null;
        const onCheck = tapCheck;
        pointerId = null; moved = false; tapCheck = false;
        if (!tap) return;
        if (onCheck) toggleDone(dateKey, block, onChange);
        else openBlockEditor(dateKey, block.id, onChange);
        return;
      }
      const next = placed;
      cleanup();
      if (!next || next.start === block.start) { onChange(); return; }
      saveBlocks(dateKey, blocksOf(dateKey).map((b) =>
        (b.id === block.id ? { ...b, start: next.start, end: next.end } : b)));
      onChange();
    });

    node.addEventListener("pointercancel", cleanup);
    // 꾹 누를 때 뜨는 운영체제의 선택 메뉴를 막는다.
    node.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  /* ---------- 그리기 ---------- */

  function blockNode(dateKey, block, blocks, subjects, onChange) {
    const color = subjectsApi.colorOf(subjects, block.subjectId);
    const label = [subjectsApi.nameOf(subjects, block.subjectId), block.text].filter(Boolean).join(" · ") || "이름 없음";
    const minutes = block.end - block.start;

    // 맞닿은 두 블록 사이의 경계는 손잡이 하나가 맡는다. 양쪽이 각자 손잡이를
    // 두면 같은 자리에 둘이 겹쳐서, 어느 쪽을 잡았느냐로 결과가 갈리는 것처럼
    // 보인다. 실제로는 어느 쪽을 잡아도 둘이 함께 움직이므로 하나면 된다.
    // 위 블록의 아래 손잡이가 그 경계를 갖는다.
    //
    // 세로로 펴면서 예외가 없어졌다. 예전 가로 격자에서는 정각 경계가 줄이
    // 바뀌는 자리라 손잡이를 하나만 두면 한 방향으로밖에 못 끌었다.
    const sharedStart = !!grid.neighborAt(blocks, block, "start");
    const sharedEnd = !!grid.neighborAt(blocks, block, "end");

    // 키보드로 누르면 ±5분 조절이 있는 시트를 연다. 포인터로 누른 click 은
    // attachResize 가 같은 제스처 안에서 처리하므로 여기서 무시한다.
    const handle = (edge, shared) => ui.el("button", {
      class: "tt-handle tt-handle-" + edge + (shared ? " tt-handle-shared" : ""),
      type: "button",
      "aria-label": (edge === "start" ? "시작" : "종료") + " 시각 조절" + (shared ? " (맞닿은 블록과 함께)" : ""),
      onclick: (e) => { if (e.detail === 0) openBlockEditor(dateKey, block.id, onChange); },
    });

    const parts = [];
    if (!sharedStart) parts.push(handle("start", false));

    // ✓ 와 이름은 블록 안에 가로로 나란히 앉는다. 블록에 최소 높이가 있어
    // (styles.css 의 .tt-seg min-height) 아무리 짧아도 둘 다 들어간다.
    //
    // 과목이 없으면 완료를 매기지 않는다. 공부 시간에도 달성률에도 안 들어가는
    // 시간이라 체크할 대상이 없다.
    const main = [];
    if (storeApi.isStudy(block)) {
      main.push(ui.el("button", {
        class: "tt-check" + (block.done ? " tt-check-on" : ""), type: "button",
        "aria-label": "완료 토글", text: block.done ? "✓" : "",
        onclick: (e) => { if (e.detail === 0) toggleDone(dateKey, block, onChange); },
      }));
    }
    // 포인터로 누른 click 은 무시한다. 그 경로는 attachMove 가 같은 제스처
    // 안에서 처리한다. e.detail === 0 은 키보드(Enter/Space)라는 뜻이다.
    main.push(ui.el("button", {
      class: "tt-body", type: "button",
      onclick: (e) => { if (e.detail === 0) openBlockEditor(dateKey, block.id, onChange); },
    }, [
      ui.el("span", { class: "tt-label", text: label }),
      ui.el("span", { class: "tt-time", text: dt.minutesToLabel(block.start) + "~" + dt.minutesToLabel(block.end) }),
    ]));
    parts.push(ui.el("div", { class: "tt-main" }, main));

    if (!sharedEnd) parts.push(handle("end", false));
    else parts.push(handle("end", true));

    // 짧은 블록은 이름과 시각을 한 줄로 붙이고, 더 짧으면 시각까지 뗀다.
    // 두 줄로 쌓으면 들어갈 자리가 없어 아래쪽이 잘려 나간다.
    //
    // 높이는 늘 제 시간 그대로다. 예전에는 짧은 블록에 최소 높이를 줬는데,
    // 그러면 5분짜리가 32px 로 그려져 바로 뒤 블록을 덮어 버렸다. 침범하느니
    // 얇은 편이 낫다 - 대신 한 시간 칸 자체를 넓혀 얇아도 읽히게 했다.
    const tight = minutes < TIGHT_MINUTES;
    const micro = minutes < MICRO_MINUTES;

    const node = ui.el("div", {
      class: "tt-seg" + (block.done ? " tt-seg-done" : "") +
        (tight ? " tt-seg-tight" : "") + (micro ? " tt-seg-micro" : ""),
      dataset: { id: block.id },
      style: Object.assign(placeStyle(block.start, block.end), { background: color }),
    }, parts);

    const startHandle = node.querySelector(".tt-handle-start");
    const endHandle = node.querySelector(".tt-handle-end");
    if (startHandle) attachResize(startHandle, dateKey, block.id, "start", onChange);
    if (endHandle) attachResize(endHandle, dateKey, block.id, "end", onChange);
    attachMove(node, dateKey, block, onChange);
    return node;
  }

  function nowMinutes() {
    const now = new Date();
    let minutes = now.getHours() * 60 + now.getMinutes();
    if (now.getHours() < dt.DAY_BOUNDARY_HOUR) minutes += 1440;
    return minutes;
  }

  function nowMarker(dateKey) {
    if (dateKey !== SP.app.today()) return null;
    const minutes = nowMinutes();
    if (minutes < dt.DAY_START || minutes >= dt.DAY_END) return null;
    return ui.el("div", { class: "tt-now", style: { top: grid.offsetPercent(minutes) + "%" } });
  }

  // 오늘 계획을 열면 지금 시각이 보이는 자리로 옮긴다. 05:00 부터 보여주면
  // 저녁에 앱을 열 때마다 한참을 굴려 내려와야 한다.
  //
  // 화면에 붙은 뒤에 불러야 한다 — 떨어져 있는 동안에는 높이가 0 이라
  // scrollTop 을 넣어도 그대로 0 이 된다.
  function scrollToNow(pane, dateKey) {
    const cells = pane.querySelector(".tt-cells");
    if (!cells || dateKey !== SP.app.today()) return false;
    const minutes = nowMinutes();
    if (minutes < dt.DAY_START || minutes >= dt.DAY_END) return false;
    // offsetTop 은 쓰지 않는다. 어느 조상이 positioned 냐에 따라 기준이 달라져
    // 엉뚱한 값이 나온다. 두 사각형의 차이는 언제나 맞다.
    const paneBox = pane.getBoundingClientRect();
    const cellsBox = cells.getBoundingClientRect();
    const top = cellsBox.top - paneBox.top + pane.scrollTop;
    // 지금 시각을 화면 위쪽 1/4 에 둔다. 지나온 것도 조금 보이고 앞으로 할
    // 것이 넉넉히 보인다.
    const y = top + (grid.offsetPercent(minutes) / 100) * cellsBox.height;
    pane.scrollTop = Math.max(0, y - pane.clientHeight / 4);
    return true;
  }

  function render(host, dateKey, onChange) {
    const subjects = SP.app.state().settings.subjects;
    const blocks = blocksOf(dateKey);

    const labels = [];
    const lines = [];
    for (let r = 0; r < grid.ROWS; r++) {
      labels.push(ui.el("div", { class: "tt-label-cell", text: dt.minutesToLabel(dt.DAY_START + r * 60) }));
      lines.push(ui.el("div", { class: "tt-line" }));
    }

    const cells = ui.el("div", { class: "tt-cells" }, [ui.el("div", { class: "tt-lines" }, lines)]);
    for (const b of blocks) cells.appendChild(blockNode(dateKey, b, blocks, subjects, onChange));
    const marker = nowMarker(dateKey);
    if (marker) cells.appendChild(marker);

    attachCreate(cells, dateKey, onChange);

    // 합치기는 자동으로 하지 않는다. 나눠 잡은 것이 앞 블록에 흡수되면 나눈
    // 의도가 사라진다. 합칠 게 있을 때만 버튼을 보여준다.
    const preview = SP.link.mergeAdjacent(SP.app.store().getDay(dateKey));
    const mergeBtn = preview.merged > 0
      ? ui.el("button", {
          class: "btn merge-btn", type: "button",
          text: "같은 내용 합치기 · " + preview.merged + "곳",
          onclick: () => {
            SP.app.saveDay(dateKey, SP.link.mergeAdjacent(SP.app.store().getDay(dateKey)));
            ui.toast(preview.merged + "곳을 합쳤습니다.");
            onChange();
          },
        })
      : null;

    ui.clear(host).appendChild(
      // 카드 제목을 두지 않는다. 바로 위 탭이 이미 "타임테이블"이라고 적혀 있어,
      // 같은 말이 두 번 나온다.
      ui.el("section", { class: "card tt-card" }, [
        mergeBtn,
        ui.el("div", { class: "tt-wrap" }, [ui.el("div", { class: "tt-labels" }, labels), cells]),
      ])
    );
  }

  const api = { render, pointToMinutes, openBlockEditor, scrollToNow };
  SP.timetable = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>
  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const eventsApi = SP.events;
  const ui = SP.ui;

  const PAGES = ["타임테이블", "To-Do"];
  const SWIPE_MIN = 40;

  let currentHost = null;
  let currentKey = null;
  // 화면을 다시 그려도 보고 있던 쪽에 남아야 한다. 체크 하나 할 때마다
  // 타임테이블로 튕겨 나가면 목록을 훑을 수가 없다.
  let activePage = 0;
  // 하루를 새로 열거나 탭을 바꿀 때만 지금 시각으로 옮긴다. 체크 하나 눌렀다고
  // 05:00 으로 튕겨 올라가면 밤 계획을 볼 수가 없다.
  let wantNow = false;
  // 아래 서랍이 열려 있는지. 다시 그려도 열어둔 채로 남아야 한다 - 체크 한 번에
  // 서랍이 닫히면 메모를 쓰다 말고 매번 다시 열어야 한다.
  let sheetOpen = false;

  function ddayChip(dateKey) {
    const state = SP.app.state();
    const result = eventsApi.dday(state.events, dateKey);
    if (!result) return ui.el("span", { class: "dday dday-none", text: "일정 없음" });
    return ui.el("span", { class: "dday", title: result.event.title, text: eventsApi.formatDday(result.days) });
  }

  function header(dateKey) {
    const view = SP.app.viewDate();
    return ui.el("header", { class: "day-head" }, [
      ui.el("button", { class: "icon-btn", text: "←", "aria-label": "달력으로", onclick: () => SP.app.showCalendar(view.year, view.month) }),
      ddayChip(dateKey),
      ui.el("div", { class: "day-nav" }, [
        ui.el("button", { class: "icon-btn", text: "‹", "aria-label": "전날", onclick: () => SP.app.showDay(dt.addDays(dateKey, -1)) }),
        ui.el("span", { class: "day-date", text: dt.formatDateKorean(dateKey) }),
        ui.el("button", { class: "icon-btn", text: "›", "aria-label": "다음날", onclick: () => SP.app.showDay(dt.addDays(dateKey, 1)) }),
      ]),
      ui.el("button", { class: "icon-btn", text: "⋯", "aria-label": "메뉴", onclick: () => SP.day.openMenu(dateKey) }),
    ]);
  }

  // 하루를 한눈에 보는 카드. 달성률은 손으로 매기지 않고 블록의 완료에서 나온다.
  function summaryCard(dateKey) {
    const day = SP.app.store().getDay(dateKey);
    const ratio = storeApi.doneRatio(day.blocks);
    const uncounted = storeApi.sumUncounted(day.blocks);
    // 달성률과 목표·실제를 한 줄에 나란히 둔다. 세 줄로 쌓아 두었더니 아래 칸이
    // 화면을 넘쳐, 조금만 굴려도 이 카드가 머리 없이 반토막 난 채로 보였다.
    return ui.el("section", { class: "card" }, [
      ui.el("div", { class: "sum-row" }, [
        ui.el("div", { class: "achieve-head" }, [
          ui.el("h2", { class: "card-title", text: "달성률" }),
          ui.el("span", { class: "achieve-value", text: ratio + "%" }),
        ]),
        ui.el("div", { class: "totals" }, [
          ui.el("div", { class: "totals-row" }, [
            ui.el("span", { class: "totals-label", text: "목표" }),
            ui.el("strong", { text: dt.formatDuration(storeApi.sumPlanned(day.blocks)) }),
          ]),
          ui.el("div", { class: "totals-row" }, [
            ui.el("span", { class: "totals-label", text: "실제" }),
            ui.el("strong", { text: dt.formatDuration(storeApi.sumDone(day.blocks)) }),
          ]),
        ]),
      ]),
      ui.el("div", { class: "totals-bar" }, [
        ui.el("div", { class: "totals-fill", style: { width: ratio + "%" } }),
      ]),
      // 시간표에 있는 시간이 합계에서 빠졌을 때만, 왜 숫자가 다른지 밝힌다.
      // 이것이 없으면 시간표가 꽉 찼는데 목표가 1시간인 이유를 알 수 없다.
      uncounted > 0
        ? ui.el("p", { class: "totals-note",
            text: "과목 없음 " + dt.formatDuration(uncounted) + "은 공부 시간에 넣지 않습니다." })
        : null,
    ]);
  }

  // 일정을 여기서 바로 만들고 없앤다. 예전에는 ⋯ 메뉴로 들어가야 만들 수 있었고,
  // 일정이 하나도 없으면 칸 자체가 안 나와서 만들 길이 보이지 않았다.
  function eventsCard(dateKey, onChange) {
    const list = eventsApi.onDate(SP.app.state().events, dateKey);

    async function remove(event) {
      const ok = await ui.confirmDialog("'" + event.title + "' 일정을 지웁니다.");
      if (!ok) return;
      eventsApi.removeEvent(SP.app.state(), event.id);
      SP.app.persist();
      onChange();
    }

    return ui.el("section", { class: "card" }, [
      ui.el("div", { class: "events-head" }, [
        ui.el("h2", { class: "card-title", text: "오늘의 일정" }),
        ui.el("button", {
          class: "btn event-add", type: "button", text: "＋ 일정",
          onclick: () => SP.day.openEventEditor(dateKey, null),
        }),
      ]),
      // 일정이 없는 날에는 목록 자리를 아예 비운다. 제목 줄에 ＋ 가 이미 있어
      // "없습니다" 한 줄이 더 있을 이유가 없다.
      list.length
        ? ui.el("ul", { class: "event-list" }, list.map((e) =>
            ui.el("li", { class: "event-item" }, [
              ui.el("button", { class: "event-main", type: "button",
                onclick: () => SP.day.openEventEditor(dateKey, e.id) }, [
                ui.el("span", { class: "event-dot", style: { background: e.color } }),
                ui.el("span", { class: "event-title", text: e.title }),
                ui.el("span", { class: "event-type", text: eventsApi.typeOf(e.type).label }),
              ]),
              ui.el("button", {
                class: "icon-btn event-del", type: "button", text: "✕",
                "aria-label": e.title + " 지우기", onclick: () => remove(e),
              }),
            ])
          ))
        : null,
    ]);
  }

  function memoCard(dateKey) {
    return ui.el("section", { class: "card" }, [
      ui.el("h2", { class: "card-title", text: "메모" }),
      ui.el("textarea", {
        class: "memo", placeholder: "자유롭게 적으세요", maxlength: "1000",
        // change(블러)만 듣지 말 것. 메모에는 저장 버튼이 없어서, 타이핑하다 바로
        // 앱을 내리면 포커스가 빠지지 않아 flush에 담길 내용 자체가 없다.
        // persist()의 300ms 디바운스가 타이핑 연타를 흡수한다.
        oninput: (e) => { SP.app.store().setDay(dateKey, { memo: e.target.value }); SP.app.persist(); },
      }),
    ]);
  }

  // 타임테이블과 To-Do 를 한 장에 다 담으면 화면이 끝없이 길어진다. 좌우로 넘겨
  // 바꾼다.
  //
  // 두 쪽을 나란히 놓고 한쪽을 overflow 로 가리지 않는다. 가려둔 타임테이블이
  // To-Do 위로 비어져 나오는 일이 있었다 - 트랙이 합성 레이어(transform +
  // will-change)가 되면 부모의 잘라내기를 지키지 않는 브라우저가 있다. 아예
  // 화면에 없으면 새어 나올 수도 없으므로, 보고 있는 쪽만 만든다.
  //
  // 높이를 재서 넣던 것도 함께 없앴다. 한 쪽뿐이니 내용만큼 자라면 된다.
  function pager(dateKey, onChange) {
    const view = ui.el("div", { class: "pager" });

    const tabs = PAGES.map((name, i) =>
      ui.el("button", {
        class: "tab", type: "button", text: name, role: "tab",
        onclick: () => go(i),
      }));

    // dir 은 넘어온 방향이다. 0 이면 애니메이션 없이 그린다 - 체크 하나 누를
    // 때마다 화면이 밀려 들어오면 눈이 아프다.
    function paint(dir) {
      const page = ui.el("div", {
        class: "pager-page" + (dir > 0 ? " page-in-left" : dir < 0 ? " page-in-right" : ""),
      });
      ui.clear(view).appendChild(page);
      if (activePage === 0) SP.timetable.render(page, dateKey, onChange);
      else SP.todos.render(page, dateKey, onChange);
      tabs.forEach((t, i) => {
        t.classList.toggle("tab-on", i === activePage);
        t.setAttribute("aria-selected", i === activePage ? "true" : "false");
      });
    }

    // 굴린 자리는 화면에 붙은 뒤에야 잡을 수 있다. 떨어져 있는 동안에는 높이가
    // 0 이라 scrollTop 을 넣어도 그대로 0 이 된다.
    function settle(keep) {
      if (wantNow) {
        wantNow = false;
        if (SP.timetable.scrollToNow(view, dateKey)) return;
        view.scrollTop = 0;
        return;
      }
      view.scrollTop = keep;
    }

    function go(i) {
      const next = Math.max(0, Math.min(i, PAGES.length - 1));
      if (next === activePage) return;
      const dir = next > activePage ? 1 : -1;
      activePage = next;
      wantNow = true;
      paint(dir);
      settle(0);
    }

    // 시간표 격자 위에서도 넘길 수 있다. 세로로 펴면서 가로로 끄는 동작이 비었다
    // — 예전 가로 격자에서는 그것이 "시간 잡기"라 여기서만 넘김을 막아야 했다.
    ui.attachSwipe(view, (dir) => go(activePage + dir), { min: SWIPE_MIN });

    paint(0);
    return {
      node: ui.el("div", { class: "pager-wrap" }, [
        ui.el("div", { class: "tabs", role: "tablist" }, tabs), view,
      ]),
      settle,
    };
  }

  // 접혀 있을 때 보이는 한 줄. 달성률은 선 하나로, 오늘 일정은 작게.
  // 여기 있는 것만으로도 "오늘 얼마나 했고 뭐가 있는지" 는 알 수 있어야 한다.
  function peek(dateKey) {
    const day = SP.app.store().getDay(dateKey);
    const ratio = storeApi.doneRatio(day.blocks);
    const list = eventsApi.onDate(SP.app.state().events, dateKey);
    return ui.el("div", { class: "peek" }, [
      ui.el("div", { class: "peek-bar" }, [
        ui.el("div", { class: "peek-fill", style: { width: ratio + "%" } }),
      ]),
      ui.el("div", { class: "peek-row" }, [
        ui.el("span", { class: "peek-rate", text: ratio + "%" }),
        list.length
          ? ui.el("div", { class: "peek-events" }, list.slice(0, 3).map((e) =>
              ui.el("span", { class: "peek-event" }, [
                ui.el("span", { class: "peek-dot", style: { background: e.color } }),
                ui.el("span", { class: "peek-title", text: e.title }),
              ])))
          : ui.el("span", { class: "peek-none", text: "오늘 일정 없음" }),
      ]),
    ]);
  }

  function render(host, dateKey) {
    // 이 하루를 새로 여는 것인지, 이미 보고 있던 것을 다시 그리는 것인지.
    // 지우기 전에 봐야 알 수 있다.
    const prevPane = host.querySelector(".pager");
    const fresh = currentHost !== host || currentKey !== dateKey || !prevPane;
    const keepAt = prevPane ? prevPane.scrollTop : 0;

    currentHost = host;
    currentKey = dateKey;

    const summaryHost = ui.el("div", {});
    const eventsHost = ui.el("div", {});
    const peekHost = ui.el("div", { class: "peek-host" });
    // 남는 높이를 다 가져가는 칸이다. 클래스를 줘야 한다 - 이름 없는 div 로 두면
    // 여기서 flex 사슬이 끊겨, 안쪽 .pager 가 내용만큼 늘어나 버린다.
    const pagerHost = ui.el("div", { class: "pager-host" });

    // 할 일과 블록은 한 쌍으로 움직인다. 둘을 따로 그리면 화면이 어긋난다.
    // 달성률도 완료 체크에서 파생되므로 같이 다시 그린다.
    const refresh = () => {
      ui.clear(summaryHost).appendChild(summaryCard(dateKey));
      ui.clear(eventsHost).appendChild(eventsCard(dateKey, refresh));
      ui.clear(peekHost).appendChild(peek(dateKey));
      // 굴린 자리를 넘겨 받아, 다시 그린 뒤 그대로 되돌려 놓는다.
      const pane = pagerHost.querySelector(".pager");
      const at = pane ? pane.scrollTop : keepAt;
      const made = pager(dateKey, refresh);
      ui.clear(pagerHost).appendChild(made.node);
      made.settle(at);
    };

    // 시간표와 To-Do 가 화면을 다 쓴다. 달성률·일정·메모는 아래 서랍에 넣고,
    // 접혀 있을 때는 달성률 선과 오늘 일정만 한 줄로 내민다. 늘 펼쳐 두었더니
    // 화면의 40% 를 먹어, 정작 자주 보는 시간표가 좁았다.
    const grip = ui.el("button", {
      class: "day-grip", type: "button",
      "aria-expanded": sheetOpen ? "true" : "false",
      "aria-label": sheetOpen ? "달성률·일정·메모 접기" : "달성률·일정·메모 펼치기",
      onclick: () => setSheet(!sheetOpen),
    }, [ui.el("span", { class: "day-grip-bar" })]);

    const sheet = ui.el("div", { class: "day-sheet" }, [
      grip,
      peekHost,
      ui.el("div", { class: "day-sheet-body" }, [summaryHost, eventsHost, memoCard(dateKey)]),
    ]);

    function setSheet(open) {
      sheetOpen = open;
      sheet.classList.toggle("day-sheet-open", open);
      grip.setAttribute("aria-expanded", open ? "true" : "false");
      grip.setAttribute("aria-label", open ? "달성률·일정·메모 접기" : "달성률·일정·메모 펼치기");
    }

    // 손잡이와 접힌 줄 어디를 잡아당겨도 열린다. 작은 손잡이만 노려서 눌러야
    // 하면 한 번에 안 걸린다.
    ui.attachPull(grip, (dir) => setSheet(dir < 0));
    ui.attachPull(peekHost, (dir) => setSheet(dir < 0));
    setSheet(sheetOpen);

    ui.clear(host).appendChild(
      ui.el("div", { class: "day" }, [header(dateKey), pagerHost, sheet])
    );

    const memo = host.querySelector(".memo");
    if (memo) memo.value = SP.app.store().getDay(dateKey).memo;

    // 하루를 새로 열 때만 지금 시각으로 옮긴다. 이미 보고 있던 하루를 다시
    // 그리는 것이라면 굴려 둔 자리에 남아야 한다.
    wantNow = fresh;
    refresh();
  }

  function refresh() {
    if (currentHost && currentKey) render(currentHost, currentKey);
  }

  const api = {
    render, refresh, currentKey: () => currentKey,
    openMenu: (dateKey) => SP.sheets.dayMenu(dateKey, refresh),
    openEventEditor: (dateKey, eventId) => SP.sheets.eventEditor(dateKey, eventId, refresh),
  };
  SP.day = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>
  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const eventsApi = SP.events;
  const ui = SP.ui;

  const LONG_PRESS_MS = 450;
  const MOVE_TOLERANCE = 8;
  // 달을 넘기는 데 필요한 가로 거리. 하루 칸 폭(약 50px)보다 넉넉히 커야
  // 날짜를 누르려다 손이 미끄러진 것과 갈린다.
  const SWIPE_MIN = 60;
  // 이만큼만 가로로 가도 "옆으로 미는 중"으로 보고 브라우저에게서 제스처를
  // 가져온다. SWIPE_MIN 까지 기다리면 그 전에 브라우저가 먼저 채간다.
  const CLAIM_PX = 12;

  function monthDays(year, month) {
    return new Date(year, month, 0).getDate();
  }

  function studyMinutesByDay(state, year, month) {
    const map = {};
    let max = 0;
    const first = year + "-" + String(month).padStart(2, "0") + "-01";
    for (let i = 0; i < monthDays(year, month); i++) {
      const key = dt.addDays(first, i);
      const day = state.days[key];
      if (!day) continue;
      const minutes = storeApi.sumDone(day.blocks);
      if (minutes > 0) map[key] = minutes;
      if (minutes > max) max = minutes;
    }
    return { map, max };
  }

  function monthSummary(state, year, month) {
    const first = year + "-" + String(month).padStart(2, "0") + "-01";
    let total = 0;
    let ratioSum = 0;
    let plannedDays = 0;
    for (let i = 0; i < monthDays(year, month); i++) {
      const day = state.days[dt.addDays(first, i)];
      if (!day) continue;
      total += storeApi.sumDone(day.blocks);
      // 계획을 세운 날만 평균에 넣는다. 아무것도 안 적은 날까지 0%로 세면
      // 평균이 실제 공부량과 무관하게 낮아진다.
      if (storeApi.sumPlanned(day.blocks) > 0) { ratioSum += storeApi.doneRatio(day.blocks); plannedDays++; }
    }
    const avg = plannedDays ? Math.round(ratioSum / plannedDays) : 0;
    return { total, avg };
  }

  function attachLongPress(node, dateKey) {
    let timer = null;
    let startX = 0;
    let startY = 0;
    let fired = false;
    let moved = false;

    const cancel = () => { clearTimeout(timer); timer = null; };

    node.addEventListener("pointerdown", (e) => {
      fired = false;
      moved = false;
      startX = e.clientX;
      startY = e.clientY;
      timer = setTimeout(() => { fired = true; api.onLongPress(dateKey); }, LONG_PRESS_MS);
    });
    node.addEventListener("pointermove", (e) => {
      if (moved) return;
      if (Math.abs(e.clientY - startY) > MOVE_TOLERANCE ||
          Math.abs(e.clientX - startX) > MOVE_TOLERANCE) {
        moved = true;
        cancel();
      }
    });
    node.addEventListener("pointerup", () => {
      cancel();
      // 드래그로 끝났으면 날짜를 열지 않는다. touch-action: pan-y는 터치에만 걸리므로
      // 마우스로 끌었다 놓으면 pointercancel이 오지 않는다. moved가 유일한 방어선이다.
      if (!fired && !moved) SP.app.showDay(dateKey);
    });
    node.addEventListener("pointercancel", cancel);
    node.addEventListener("pointerleave", cancel);
    node.addEventListener("contextmenu", (e) => e.preventDefault());
  }

  function dayCell(key, inMonthFlag, ctx) {
    if (!inMonthFlag) return ui.el("div", { class: "cal-cell cal-cell-out" });

    const weekday = dt.weekdayOf(key);
    const classes = ["cal-cell"];
    if (weekday === 0) classes.push("cal-sun");
    if (weekday === 6) classes.push("cal-sat");
    if (key === SP.app.today()) classes.push("cal-today");

    const dayEvents = ctx.eventMap[key] || [];
    const badges = dayEvents.slice(0, 2).map((e) =>
      ui.el("div", { class: "cal-badge", title: e.title }, [
        ui.el("span", { class: "cal-dot", style: { background: e.color } }),
        ui.el("span", { class: "cal-badge-text", text: e.title }),
      ])
    );
    if (dayEvents.length > 2) badges.push(ui.el("div", { class: "cal-more", text: "+" + (dayEvents.length - 2) }));

    const minutes = ctx.study.map[key] || 0;
    const ratio = ctx.study.max > 0 ? minutes / ctx.study.max : 0;
    const bar = ctx.study.max > 0 && minutes > 0
      ? ui.el("div", { class: "cal-bar" }, [
          ui.el("div", { class: "cal-bar-fill", style: { width: Math.round(ratio * 100) + "%" } }),
        ])
      : null;

    const day = ctx.state.days[key];
    const rate = day && storeApi.sumPlanned(day.blocks) > 0
      ? ui.el("div", { class: "cal-achieve", text: storeApi.doneRatio(day.blocks) + "%" })
      : null;

    const cell = ui.el("div", { class: classes.join(" "), dataset: { date: key } }, [
      ui.el("div", { class: "cal-num", text: String(dt.parseDateKey(key).getDate()) }),
      ui.el("div", { class: "cal-badges" }, badges),
      bar,
      rate,
    ]);
    attachLongPress(cell, key);
    return cell;
  }

  // 달을 넘길 때 어느 쪽에서 들어오는지. showCalendar 를 거쳐 다시 그려지므로
  // 방향을 여기 남겨 두었다가 새로 그린 격자에 붙인다. 0 이면 애니메이션 없이
  // 그린다 - 앱을 처음 열거나 하루에서 돌아올 때까지 밀려 들어오면 눈이 아프다.
  let enterFrom = 0;

  function render(host, year, month) {
    const state = SP.app.state();
    const ctx = {
      state,
      eventMap: eventsApi.inMonth(state.events, year, month),
      study: studyMinutesByDay(state, year, month),
    };

    const first = year + "-" + String(month).padStart(2, "0") + "-01";
    const leading = dt.weekdayOf(first);
    const total = monthDays(year, month);
    const cells = [];
    for (let i = 0; i < leading; i++) cells.push(dayCell(null, false, ctx));
    for (let i = 0; i < total; i++) cells.push(dayCell(dt.addDays(first, i), true, ctx));
    while (cells.length % 7 !== 0) cells.push(dayCell(null, false, ctx));

    const go = (delta) => {
      enterFrom = delta;
      const d = new Date(year, month - 1 + delta, 1);
      SP.app.showCalendar(d.getFullYear(), d.getMonth() + 1);
    };
    const goToday = () => {
      const t = dt.parseDateKey(SP.app.today());
      SP.app.showCalendar(t.getFullYear(), t.getMonth() + 1);
    };

    const summary = monthSummary(state, year, month);
    // 옆으로 밀어 달을 넘긴다.
    const gridNode = ui.el("div", {
      class: "cal-grid" + (enterFrom > 0 ? " cal-in-left" : enterFrom < 0 ? " cal-in-right" : ""),
    }, cells);
    ui.attachSwipe(gridNode, go, { min: SWIPE_MIN, claim: CLAIM_PX });
    // 한 번 쓰고 지운다. 다음에 다른 길로 들어오면 방향이 없어야 한다.
    enterFrom = 0;

    ui.clear(host).appendChild(
      ui.el("div", { class: "cal" }, [
        ui.el("header", { class: "cal-head" }, [
          ui.el("button", { class: "icon-btn", text: "‹", "aria-label": "이전 달", onclick: () => go(-1) }),
          ui.el("h1", { class: "cal-title" + (gridNode.className.includes("cal-in-left") ? " cal-in-left"
            : gridNode.className.includes("cal-in-right") ? " cal-in-right" : ""),
            text: year + "년 " + month + "월" }),
          ui.el("button", { class: "icon-btn", text: "›", "aria-label": "다음 달", onclick: () => go(1) }),
          ui.el("button", { class: "btn btn-ghost cal-today-btn", text: "오늘", onclick: goToday }),
          // 사전은 날짜와 상관없이 쌓인 할 일을 정리하는 곳이라, 하루 안으로
          // 들어가지 않고도 열 수 있어야 한다. 날짜를 안 넘기므로 '계획에
          // 넣기'는 빠지고 정리만 한다 - 여기서는 넣을 하루가 정해져 있지 않다.
          ui.el("button", { class: "btn btn-ghost cal-today-btn", text: "사전", onclick: () => SP.dictsheet.open() }),
        ]),
        ui.el("div", { class: "cal-weekdays" }, dt.WEEKDAY_NAMES.map((name, i) =>
          ui.el("div", { class: "cal-weekday" + (i === 0 ? " cal-sun" : i === 6 ? " cal-sat" : ""), text: name })
        )),
        gridNode,
        ui.el("div", { class: "cal-summary" }, [
          ui.el("span", { text: "이번 달 공부 " + dt.formatDuration(summary.total) }),
          ui.el("span", { text: "평균 달성률 " + summary.avg + "%" }),
        ]),
      ])
    );
  }

  function onLongPress(dateKey) {
    SP.sheets.dayMenu(dateKey, () => SP.app.showCalendar(SP.app.viewDate().year, SP.app.viewDate().month));
  }

  const api = { render, onLongPress, monthSummary, studyMinutesByDay };
  SP.calendar = api;
  if (typeof module !== "undefined") module.exports = api;
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>
  <script>
(function (root) {
  const SP = (root.SP = root.SP || {});
  const dt = SP.datetime;
  const storeApi = SP.store;
  const ui = SP.ui;

  let store = null;
  let todayKey = null;
  let view = { year: 0, month: 0 };
  let saveTimer = null;
  // 크롬은 설치할 수 있게 되면 이 사건을 한 번 보낸다. 그때 잡아 두지 않으면
  // 나중에 설정에서 "설치" 를 누를 방법이 없다.
  let installEvent = null;

  function safeStorage() {
    try {
      const probe = "__sp_probe__";
      window.localStorage.setItem(probe, "1");
      window.localStorage.removeItem(probe);
      return window.localStorage;
    } catch (e) {
      const map = new Map();
      return {
        getItem: (k) => (map.has(k) ? map.get(k) : null),
        setItem: () => { throw new Error("localStorage unavailable"); },
        removeItem: (k) => map.delete(k),
      };
    }
  }

  function state() { return store.getState(); }

  function writeNow() {
    if (!store.save()) {
      ui.showBanner("저장에 실패했습니다. 이 기기에 계획이 남지 않습니다. 설정에서 JSON 내보내기로 백업하세요.");
    }
  }

  function persist() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { saveTimer = null; writeNow(); }, 300);
  }

  // 블록과 할 일은 한 쌍으로 움직인다. 따로 쓰면 완료 상태가 어긋난 순간이
  // 저장될 수 있다.
  function saveDay(dateKey, next) {
    store.setDay(dateKey, { todos: next.todos, blocks: next.blocks });
    persist();
  }

  // 디바운스 대기 중인 쓰기를 즉시 밀어 넣는다. 폰에서 체크 하나 하고 곧바로 앱을
  // 내리거나 화면을 끄면 300ms를 못 채우고 그 편집이 통째로 사라진다.
  function flush() {
    if (saveTimer === null) return;
    clearTimeout(saveTimer);
    saveTimer = null;
    writeNow();
  }

  function today() { return todayKey; }
  function viewDate() { return { year: view.year, month: view.month }; }

  function showCalendar(year, month) {
    if (year) view = { year, month };
    document.getElementById("screen-day").hidden = true;
    document.getElementById("screen-calendar").hidden = false;
    window.scrollTo(0, 0);
    SP.calendar.render(document.getElementById("screen-calendar"), view.year, view.month);
  }

  function showDay(dateKey) {
    document.getElementById("screen-calendar").hidden = true;
    document.getElementById("screen-day").hidden = false;
    window.scrollTo(0, 0);
    SP.day.render(document.getElementById("screen-day"), dateKey);
  }

  function refreshToday() {
    const next = dt.plannerDateKey(new Date());
    if (next === todayKey) return;
    todayKey = next;
    if (!document.getElementById("screen-calendar").hidden) showCalendar(view.year, view.month);
  }

  function boot() {
    store = storeApi.createStore(safeStorage());
    const result = store.load();
    if (result.recovered) ui.showBanner("저장된 데이터 일부를 읽을 수 없어 복구했습니다.");
    if (result.readOnly) ui.showBanner("더 새로운 버전에서 만든 데이터입니다. 읽기 전용으로 엽니다.");

    todayKey = dt.plannerDateKey(new Date());
    const d = dt.parseDateKey(todayKey);
    view = { year: d.getFullYear(), month: d.getMonth() + 1 };

    showCalendar(view.year, view.month);

    // 알림은 켜 둔 사람에게만 돈다.
    if (SP.notify) SP.notify.start();

    setInterval(refreshToday, 60000);
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) flush();
      else refreshToday();
    });
    // iOS Safari에서는 beforeunload가 신뢰할 수 없다. pagehide가 홈 화면 앱에서도 온다.
    window.addEventListener("pagehide", flush);
  }

  window.addEventListener("beforeinstallprompt", (e) => {
    // 브라우저가 알아서 띄우는 배너를 막고, 설정 안의 버튼으로 옮긴다.
    e.preventDefault();
    installEvent = e;
  });
  window.addEventListener("appinstalled", () => { installEvent = null; });

  async function install() {
    if (!installEvent) return false;
    installEvent.prompt();
    const choice = await installEvent.userChoice;
    installEvent = null;
    return !!choice && choice.outcome === "accepted";
  }

  SP.app = { boot, state, persist, saveDay, showCalendar, showDay, today, viewDate, store: () => store,
    installPrompt: () => installEvent, install };
  document.addEventListener("DOMContentLoaded", boot);
})(typeof globalThis !== "undefined" ? globalThis : window);

</script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    // 상대 경로여야 한다. 등록 범위가 이 파일이 있는 폴더로 잡혀서,
    // 계정 하나에 저장소가 여럿이어도 서로 간섭하지 않는다.
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
